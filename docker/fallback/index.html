<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="10">
  <title>Gremion startet… / starting…</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
    .card { text-align: center; padding: 2rem; }
    .spin { width: 2rem; height: 2rem; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; margin: 0 auto 1rem; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    p { opacity: .8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <h1>Gremion startet…</h1>
    <p>Die Anwendung wird gestartet. Diese Seite lädt automatisch neu.</p>
    <p>Gremion is starting. This page refreshes automatically.</p>
  </div>
</body>
</html>
