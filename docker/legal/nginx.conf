# A-021 wave 2 non-root: master no longer runs as root, so the `user`
# directive is dropped (it errors/warns under a non-root master) and the
# pid file moves to a uid-101-writable path.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    gzip on;
    gzip_types text/html text/css application/javascript;

    # IP anonymization — mask last octet before logging (GDPR requirement).
    # Applies to all visitors including pre-auth access to legal pages.
    map $remote_addr $remote_addr_anon {
        ~(?P<ip>\d+\.\d+\.\d+)\.\d+   $ip.0;
        ~(?P<ip>[^:]+:[^:]+):.*        $ip::;
        default                         0.0.0.0;
    }

    log_format anon '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout anon;

    server {
        # A-021 wave 2 non-root: high port (uid 101 cannot bind <1024).
        listen 8080;
        root /usr/share/nginx/html;
        charset utf-8;

        # entrypoint.sh writes files WITHOUT .html extension for clean URLs.
        # 'index index' serves the file named 'index' for directory requests.
        index index;

        # Clean URLs: /datenschutz → file 'datenschutz' (no extension).
        # Falls back to .html extension if needed.
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
