<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${ORG_NAME} — Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    main { max-width: 640px; margin: 4rem auto; padding: 2rem; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p.sub { color: #555; margin-bottom: 2rem; }
    .apps { display: grid; gap: 1rem; }
    .app-link { display: block; padding: 1rem 1.25rem; background: #f0f4ff; border-radius: 6px; text-decoration: none; color: #1a3c8f; font-weight: 500; border: 1px solid #c8d8ff; }
    .app-link:hover { background: #e0e8ff; }
    .app-link span { display: block; font-size: 0.8rem; font-weight: 400; color: #555; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Willkommen beim ${ORG_NAME} Portal</h1>
    <p class="sub">Bitte wählen Sie einen Dienst:</p>
    <div class="apps">
      <a class="app-link" href="/auth">
        Anmelden / Konto
        <span>Keycloak Identity Management</span>
      </a>
    </div>
  </main>
  ${FOOTER}
</body>
</html>
