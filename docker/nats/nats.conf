# Gremion NATS broker -- the state project's `nats` service (TASK-024,
# CAP-NATS-AUTH; D12, TRD-419). Mounted read-only at /etc/nats/nats.conf.
#
# No anonymous access: there is no no_auth_user and no global authorization
# block. Every client authenticates with an nkey that the included accounts
# file names, and lands in its tenant's account (T_<tenant>): one account per
# tenant, one user per module (Q1: static config, reloaded, no JWT resolver).
# The accounts file is GENERATED by @gremion/nats-auth (packages/nats-auth)
# into the ${STACK}_nats_accounts volume -- never edit it by hand.
#
# The monitor (/healthz, /varz, /connz, /accountz) is unauthenticated, so it
# is bound to the container's loopback: the healthcheck and `docker exec` read
# it; nothing on ${STACK}_state can (Q13, narrowed).

listen: 0.0.0.0:4222
http: 127.0.0.1:8222

# JetStream lives in the tenant accounts only (jetstream: enabled per account).
# Memory-store ceiling sized under the container's 512M limit (TRD-177 [A]).
jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 4GB
}

system_account: SYS

include ./accounts/accounts.conf
