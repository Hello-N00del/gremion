# docker/vector/logrotate.conf — installed at /etc/logrotate.d/vector-logs.
# Run on an interval by the logrotate loop in entrypoint.sh (see that script).
#
# R29-RETENTION-30 [D R29-I6]: no record kept here outlives 30 days. Every rule
# is `daily` with `maxage` equal to `rotate`, and NO live log carries
# `notifempty`: with it a zero-traffic day skips the rotation, and `maxage` is
# checked only when a log is rotated, so a quiet stretch (or a container stop)
# stretched the live file without limit. `ifempty` rotates an empty file too; each
# quiet day adds one tiny empty .gz that `rotate` then bounds. dateext, olddir,
# size and weekly/monthly are deliberately absent: the bound assumes one rotation
# per day named by generation. The arithmetic (per family, with the loop interval,
# the run time and the restart-replay lag) is computed by
# test-edge-retention-bound.sh and quoted in docs/log-retention-policy.md
# ("Upper bound"); test-edge-retention-sim.sh runs this file through the real
# logrotate for 60 simulated days.
#
# copytruncate is used for the live, continuously-appended files because the
# processes that write them (Vector's process-logs.sh appender; Traefik in a
# SEPARATE container) keep the file open and are NOT signalled by this logrotate
# run. copytruncate copies then truncates in place so the open FD keeps writing
# to the same inode — no reopen / SIGHUP needed and no cross-container signal.

# Raw Traefik JSON access log. Traefik owns the RW mount on its side; Vector now
# mounts the same volume :rw (see docker-compose.yml) purely so this rule can
# rotate the file in place. copytruncate avoids signalling the Traefik process.
# Worst case (14+1) d + interval + run = 15 d + 1 h 5 min.
/logs/traefik/access.log {
    daily
    maxage 14
    rotate 14
    compress
    delaycompress
    missingok
    ifempty
    copytruncate
}

# Traefik's own (ERROR level, JSON) log: docker/traefik/traefik.yml log.filePath
# writes it to the same volume instead of container stdout, which Docker keeps by
# size only. Same numbers as the access log. logrotate must be the ONLY rotator of
# this file: traefik.yml sets log.maxSize so high that Traefik's own size rotation
# (which would leave traefik-<timestamp>.log.gz files no rule here matches) never
# fires; test-edge-retention-bound.sh refuses a reachable cap.
/logs/traefik/traefik.log {
    daily
    maxage 14
    rotate 14
    compress
    delaycompress
    missingok
    ifempty
    copytruncate
}

# Pseudonymised security log, appended by process-logs.sh on Vector's RW mount.
# 27 configured days, not 28: after a container restart process-logs.sh's
# `tail -F` replays the last 10 raw lines (up to 1 d + interval old) into this
# file, which adds that lag to the worst case: (27+1) d + interval + run + lag
# = 29 d + 2 h 5 min. With 28 the same case reaches 30 d + 2 h 5 min.
/logs/processed/security.log {
    daily
    maxage 27
    rotate 27
    compress
    delaycompress
    missingok
    ifempty
    copytruncate
}

# Date-partitioned retention sink written by Vector. This rule does NOT age the
# day files out: maxage is checked only when a log is rotated, each day file is
# rotated once (-> .1, empty base re-created) and notifempty stops every later
# rotation, so the .1 would be kept forever (R28-VECTOR-RETENTION). Deletion is
# done by prune-retained.sh, run by the same loop in entrypoint.sh, which removes
# every form of a day file dated more than 27 days before UTC today by its name;
# that script is the authority for this family, this rule only compresses (and
# keeps `notifempty`, which is safe here because the prune, not this rule, ends
# the file's life). The upper bound on record age across all rules is in
# docs/log-retention-policy.md ("Upper bound").
/logs/processed/retained-*.log {
    daily
    maxage 27
    rotate 27
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}
