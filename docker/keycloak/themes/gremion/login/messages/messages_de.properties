# Gremion Keycloak login theme — German copy. Custom gremion* keys for the
# self-contained templates + German overrides of the standard keys they use, so
# the login UI is German regardless of locale resolution. KC 26 reads theme
# message bundles as UTF-8.
gremionLogoLetter=G
gremionBrandSub=Gremion · Anmeldung
gremionLoginTitle=Anmelden
gremionLoginSubtitle=Mit deiner Kennung. Einmal anmelden, alle Dienste deiner Organisation nutzen.
gremionOr=oder
gremionRegister=Neues Konto anlegen
gremionImprint=Impressum
gremionPrivacy=Datenschutz
gremionSecured=Abgesichert durch Keycloak · realm:
gremionOtpTitle=Bestätigung
gremionOtpSubtitle=Gib den 6-stelligen Code aus deiner Authenticator-App ein.
gremionOtpLabel=Einmal-Code
gremionResetTitle=Passwort zurücksetzen
gremionResetSubtitle=Wir senden dir einen Link an deine hinterlegte E-Mail-Adresse.
gremionResetSubmit=Link senden
gremionErrorTitle=Etwas ist schiefgelaufen
gremionErrorSubtitle=Die Anmeldung konnte nicht fortgesetzt werden.
gremionBackToApp=Zurück zur Anmeldung

# v12 (apex topology) — portal escape hatch, shown in all four auth states.
# Rendered ONLY when the realm carries a valid `gremion.portal-url` attribute,
# so this key stays unused on a realm that does not opt in. Sie-Form per the
# design system's copy rule.
gremionBackToPortal=Zurück zum öffentlichen Portal

# Standard-key overrides (force German labels)
usernameOrEmail=Benutzername oder E-Mail
username=Benutzername
password=Passwort
doLogIn=Anmelden
doForgotPassword=Passwort vergessen?
rememberMe=Angemeldet bleiben
doSubmit=Bestätigen
backToLogin=Zurück zur Anmeldung

# Notices and errors Keycloak renders itself on the sign-in, re-authentication,
# step-up and deny screens (base-theme keys, KC 26.6.1; the markup prints them
# through message.summary). Without these the base theme answers in the request
# language, which is English for an en request. The hygiene check t3b keeps every
# one of them translated and identical across the three bundles.
reauthenticate=Bitte melde dich erneut an, um fortzufahren.
acrNotFulfilled=Die Anforderungen an die Anmeldung wurden nicht erfüllt.
invalidUserMessage=Ungültiger Benutzername oder ungültiges Passwort.
invalidUsernameMessage=Ungültiger Benutzername.
invalidPasswordMessage=Ungültiges Passwort.
invalidTotpMessage=Ungültiger Authenticator-Code.
accountTemporarilyDisabledMessage=Ungültiger Benutzername oder ungültiges Passwort.
accountPermanentlyDisabledMessage=Ungültiger Benutzername oder ungültiges Passwort.
accountTemporarilyDisabledMessageTotp=Ungültiger Authenticator-Code.
accountPermanentlyDisabledMessageTotp=Ungültiger Authenticator-Code.
missingUsernameMessage=Bitte gib einen Benutzernamen an.
missingPasswordMessage=Bitte gib ein Passwort an.
missingTotpMessage=Bitte gib den Authenticator-Code an.
expiredCodeMessage=Zeitüberschreitung bei der Anmeldung. Bitte melde dich erneut an.
expiredActionMessage=Die Aktion ist abgelaufen. Bitte setze die Anmeldung jetzt fort.
loginTimeout=Die Anmeldung hat zu lange gedauert und beginnt von vorn.
access-denied=Zugriff verweigert
