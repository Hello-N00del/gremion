# Gremion Keycloak login theme — base/default bundle. Mirrors
# messages_de.properties so the custom sturaos* keys (and German standard-key
# overrides) always resolve, even when the request locale is not 'de'. The
# shipped copy is German-only; the brand line is a neutral default that a
# deployment overrides per tenant (the templates render realm.displayName).
gremionLogoLetter=G
gremionBrandSub=Gremion · Anmeldung
gremionLoginTitle=Anmelden
gremionLoginSubtitle=Mit deiner Kennung. Einmal anmelden, alle Dienste deiner Organisation nutzen.
gremionOr=oder
gremionRegister=Neues Konto anlegen
gremionImprint=Impressum
gremionPrivacy=Datenschutz
gremionSecured=Abgesichert durch Keycloak · realm:
gremionOtpTitle=Bestätigung
gremionOtpSubtitle=Gib den 6-stelligen Code aus deiner Authenticator-App ein.
gremionOtpLabel=Einmal-Code
gremionResetTitle=Passwort zurücksetzen
gremionResetSubtitle=Wir senden dir einen Link an deine hinterlegte E-Mail-Adresse.
gremionResetSubmit=Link senden
gremionErrorTitle=Etwas ist schiefgelaufen
gremionErrorSubtitle=Die Anmeldung konnte nicht fortgesetzt werden.
gremionBackToApp=Zurück zur Anmeldung

# v12 (apex topology) — portal escape hatch, shown in all four auth states.
# Rendered ONLY when the realm carries a valid `gremion.portal-url` attribute,
# so this key stays unused on a realm that does not opt in. Sie-Form per the
# design system's copy rule.
gremionBackToPortal=Zurück zum öffentlichen Portal

# Standard-key overrides (force German labels)
usernameOrEmail=Benutzername oder E-Mail
username=Benutzername
password=Passwort
doLogIn=Anmelden
doForgotPassword=Passwort vergessen?
rememberMe=Angemeldet bleiben
doSubmit=Bestätigen
backToLogin=Zurück zur Anmeldung
