;; docker/pgbouncer/pgbouncer.ini — P2.1b T11 (#202, tenancy design D4)
;;
;; PgBouncer fronts the app's data-plane Postgres connections in PRODUCTION
;; (docker-compose.prod.yml re-points gremion-ui's DATABASE_URL to
;; pgbouncer:6432; dev/CI keep the direct postgres:5432 URL). Transaction
;; pooling keeps the server-side connection count small and stable while the
;; app-side per-tenant pool registry (POOL_REGISTRY_MAX × TENANT_DB_MAX_LIMIT,
;; see gremion-ui/src/lib/server/db/pool-registry.ts) bounds the client side.
;;
;; Deploy/verify/rollback: docs/runbooks/pgbouncer.md (runtime verification is
;; deferred to meta-plan S4 — the deploy freeze holds until then).

[databases]
;; Route every requested database name to the shared compose Postgres
;; instance. The wildcard deliberately also covers future per-tenant
;; databases on this instance (the #201 two-tier model: own DB + own role on
;; a shared server is still a silo data-plane).
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; ── Auth: SCRAM pass-through via auth_query ──────────────────────────────
;; Postgres 16 stores scram-sha-256 verifiers. PgBouncer authenticates
;; clients against the verifier returned by auth_query, which it runs as
;; auth_user (the ONLY entry in userlist.txt). pgbouncer.get_auth is the
;; SECURITY DEFINER lookup installed per target database by
;; docker/pgbouncer/pgbouncer-auth.sql.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

;; ── Pooling ───────────────────────────────────────────────────────────────
;; Transaction mode: a server connection is held only for the duration of a
;; transaction. postgres-js uses protocol-level named prepared statements
;; (conn_profile.prepare defaults true), which transaction mode supports
;; since PgBouncer 1.21 via max_prepared_statements > 0. If this image is
;; ever downgraded below 1.21, set conn_profile.prepare=false per tenant.
pool_mode = transaction
max_prepared_statements = 200

;; Client side: the app's worst case is POOL_REGISTRY_MAX(16) ×
;; TENANT_DB_MAX_LIMIT(5) = 80 client connections; 200 leaves headroom for
;; migrations/psql without being unbounded.
max_client_conn = 200

;; Server side (per database/user pair): far below the client cap — that is
;; the point of transaction pooling. max_db_connections additionally caps
;; EACH database's total server connections so the app's share of the pinned
;; max_connections=100 stays bounded no matter how many user pairs appear.
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 25
server_idle_timeout = 60

;; postgres-js sets no exotic startup parameters; extra_float_digits is the
;; usual driver noise worth ignoring explicitly.
ignore_startup_parameters = extra_float_digits

;; ── Console / logging ─────────────────────────────────────────────────────
;; `psql -h pgbouncer -p 6432 -U pgbouncer_auth pgbouncer` → SHOW POOLS; etc.
admin_users = pgbouncer_auth
log_connections = 0
log_disconnections = 0
