name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # On-demand run against any ref (e.g. to confirm main is green after a CI
  # pause). The push-only jobs below also fire on workflow_dispatch so a manual
  # run gives the same coverage as a main push.
  workflow_dispatch:

# Least-privilege token: read-only on the repo. No job in this workflow needs
# write access (no release uploads, no issue/PR-comment steps). If a future
# step needs write — e.g. publishing artifacts to a release — add a per-job
# `permissions:` block on that single job rather than elevating workflow-wide.
permissions:
  contents: read

# Cancel superseded runs on PR branches; let main/develop pushes complete
# in full so the protected branches always have a green pipeline of record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Lint — fast, no Docker needed
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action needs this to GET /repos/.../pulls/N/commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks needs full history to diff base..head

      # This job used to run on the runner's own node with no install, so every
      # guard below was written to need nothing but node: built-ins. Two steps now
      # import the `yaml` package (the runner-policy arm and the verify-coverage
      # guard read workflow YAML), hence the install. It does not widen what the
      # other steps may rely on: they still run unchanged.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned to the version the local gate runs (0.11.0); the apt package on
      # ubuntu-latest is 0.9.0, which raises SC2317/SC2015 notes 0.11 does not.
      - name: Install shellcheck
        run: |
          curl -fsSLo /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install yamllint
        run: pip install yamllint

      # One home for the rule. This step used to repeat a shellcheck argument
      # list that `make lint-sh` also carried, and the two drifted: ci.yml
      # linted docker/legal/entrypoint.sh and the Makefile did not, while the
      # Makefile linted the pre-commit hook and nats-test.sh and ci.yml did not
      # -- so a local `make lint` and a CI run disagreed about which files were
      # checked. test/host/no-host-literals.bats fails if this step stops
      # delegating. make is preinstalled on ubuntu-latest.
      - name: Lint shell scripts
        run: make lint-sh

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yml docker-compose.yml docker-compose.override.yml
          yamllint -c .yamllint.yml k8s/

      # `files` in a workspace package.json is not only "what npm publish
      # sends": pnpm applies the same allowlist when it packs a workspace
      # dependency, and `pnpm deploy --prod --legacy` — how both runtime
      # Dockerfiles assemble /app/node_modules — goes through that path. A
      # publish-shaped `files` therefore silently empties the package inside
      # the shipped image. This is the cheap half of the guard (no install,
      # no build); the verify-unit-ui job runs the same script against a REAL
      # deploy payload. Both halves live in one script so the rule has one home.
      - name: Workspace packages must ship what their exports name
        run: node scripts/check-shipped-package-files.mjs --static

      # D-01: the three handover migrations ship in no release-1 tree. The
      # guard's own suite runs first so a walker that returned [] cannot make
      # this step pass vacuously.
      - name: No handover migration may ship (D-01)
        run: |
          node --test scripts/check-unshipped-migrations.test.mjs
          node scripts/check-unshipped-migrations.mjs

      # B3: the do-not-overwrite set. Every port-back unit runs this after it
      # writes to the tree (the guard reads the working tree as well as the
      # index, so an unstaged `cp -r` is caught); running it in CI is what
      # keeps it from decaying into a step people remember to run.
      - name: Do-not-overwrite set intact (B3)
        run: make lint-port-back

      # The module split takes every module repo from ONE StuRa-tree commit
      # (docs/ops/extraction-source.md). A module.json that disagrees means the
      # extraction straddled two source states; nothing else in the build reads
      # that key. Delegates to the Makefile so a local `make lint` and CI cannot
      # drift apart.
      - name: Frozen extraction source
        run: make lint-extraction-source

      # TASK-005: marketing copy may state no licence that diverges from
      # docs/compliance/licence-register.md and no election lawfulness or
      # statutory-fitness claim (TRD-265, TRD-112). Delegates to the Makefile
      # so a local `make lint` and CI cannot drift apart.
      - name: Marketing copy matches the licence register and elections scope
        run: make lint-compliance

      # Every Dockerfile that builds a pnpm workspace package must COPY the whole
      # @gremion/* closure of it. Static twin of the Docker Image Builds job: this
      # fails in seconds on any PR, the image build proves it for real when a
      # docker input changed. Delegates to the Makefile so a local `make lint`
      # and CI cannot drift apart.
      - name: Dockerfiles COPY the whole @gremion/* workspace closure
        run: make lint-dockerfile-workspace-closure

      # The pull-request docker path filter and the image matrix: runs the real
      # `changes` step against a synthetic repo (including a change list past the
      # pipe buffer) and asserts every tracked Dockerfile is built or excused.
      - name: Docker path filter and image matrix hold
        run: make lint-ci-docker-filter

      - name: Validate Docker Compose config
        run: |
          # Provide stubs so docker compose config can resolve all references
          cp .env.example .env
          mkdir -p legal && touch legal/legal.env
          docker compose config > /dev/null

      # G-043: in-repo secret scanning. Allowlist for CHANGE_ME_* and docs/
      # lives in .gitleaks.toml. GITLEAKS_LICENSE is optional (the basic
      # ruleset runs without it; some org-only features are gated behind it).
      # If the secret isn't configured, the `|| ''` fallback prevents the
      # workflow context-validator from flagging an unknown secret reference.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Supply-chain :latest tag guard for k8s manifests (G-038)
        run: |
          set -euo pipefail
          # NO image in k8s/ may carry :latest — not even a first-party one.
          # Every manifest here is applied by an operator against a cluster, so
          # a floating tag is unreproducible no matter who owns the namespace.
          # The four first-party images are pinned to the kernel version
          # instead (ghcr.io/hello-n00del/gremion-*:<package.json version>),
          # which scripts/kernel-hygiene-check.mjs check g5 enforces.
          #
          # Two exemptions used to live here and both were dead when removed:
          #   * `gremion/[a-z-]+:latest` — k8s/base has pinned every first-party
          #     image to a version for as long as the kustomization IMAGE note
          #     has existed, so nothing ever matched it;
          #   * `ghcr.io/your-org/helios` — helios is not in this repository at
          #     all (`git ls-files | grep -i helios` is empty), and the sentinel
          #     it described does not exist either.
          # An exemption nothing can trip is an exemption nobody notices is wrong.
          #
          # The pattern accepts both `image:` on its own indented line (how every
          # manifest in this repo writes it) and the `- image:` list-item form.
          # The original only accepted the former and silently ignored the latter.
          #
          # Vacuity guard first: this check greps a path, and a path that stops
          # matching turns "no violations found" into "nothing was scanned".
          scanned=$(grep -rhcE '^[[:space:]]*-?[[:space:]]*image:[[:space:]]' k8s/ --include='*.yaml' \
                    | awk '{n+=$1} END{print n+0}')
          if [ "$scanned" -lt 8 ]; then
            echo "ERROR: only $scanned 'image:' lines found under k8s/ — this guard is not scanning what it thinks it is."
            exit 1
          fi
          echo "Scanning $scanned image: lines under k8s/ ..."
          if grep -rE '^[[:space:]]*-?[[:space:]]*image:[[:space:]]+[^[:space:]]+:latest($|[[:space:]]|"|'"'"')' k8s/ \
               --include='*.yaml' > /tmp/k8s-latest 2>/dev/null; then
            echo "ERROR: :latest image tags in k8s/:"
            cat /tmp/k8s-latest
            echo
            echo "Pin first-party images to the kernel version, and externally-pulled"
            echo "ones to <tag>@sha256:<digest> — see G-037 / G-038."
            exit 1
          fi
          echo "OK — no :latest images in k8s/."

      - name: Supply-chain :latest tag guard for compose (G-037)
        run: |
          set -euo pipefail
          # The guard lives in scripts/check-compose-latest-tags.sh so a local
          # `make lint-compose-latest` and CI run the same code. It renders the
          # state tier AND the app tier (gremion-ui / gremion-public moved into
          # docker-compose.app.yml, TASK-040) and takes render-only values for
          # compose's required variables from compose/ci.placeholder.env.
          cp .env.example .env
          mkdir -p legal && touch legal/legal.env
          bash scripts/check-compose-latest-tags.sh

      - name: SOPS / production-overlay plaintext-secret guard (G-028/G-029/G-030/G-031)
        run: |
          set -euo pipefail
          echo "Scanning production overlay for plaintext secret placeholders..."

          # 1. Production overlay's secrets/ directory must contain no plaintext
          #    *.yaml files. The .gitignore excludes them; this guard catches the
          #    case where someone accidentally `git add -f` adds one.
          plaintext=$(find k8s/overlays/production/secrets -maxdepth 1 -type f \
                        -name '*.yaml' \
                        ! -name '*.enc.yaml' \
                        ! -name '*.example.yaml' || true)
          if [[ -n "$plaintext" ]]; then
            echo "ERROR: plaintext secret files in production overlay:"
            echo "$plaintext"
            exit 1
          fi

          # 2. The production overlay's kustomization.yaml must not reference an
          #    .enc.yaml that doesn't exist on disk. Iterate over every
          #    uncommented `secrets/.*\.enc\.yaml` mention. Commented references
          #    are documentary and don't need backing files yet.
          if grep -E '^[^#]*secrets/.*\.enc\.yaml' k8s/overlays/production/kustomization.yaml > /tmp/refs 2>/dev/null; then
            while IFS= read -r ref; do
              path=$(echo "$ref" | grep -oE 'secrets/[a-zA-Z0-9_-]+\.enc\.yaml' || true)
              [[ -z "$path" ]] && continue
              full="k8s/overlays/production/$path"
              if [[ ! -f "$full" ]]; then
                echo "ERROR: kustomization.yaml references missing file $full"
                exit 1
              fi
            done < /tmp/refs
          fi

          # 3. Base k8s/ Secret manifests must not carry plaintext CHANGE_ME_
          #    values. Sentinel placeholders (__FOO__, <YOUR_…>) are allowed
          #    because they're meant to be replaced by overlay-provided SOPS
          #    Secrets at deploy time. CHANGE_ME_ is forbidden because it's the
          #    legacy plaintext form callers might mistake for ready-to-deploy.
          if grep -rn 'CHANGE_ME_' k8s/base/ --include='*.yaml' > /tmp/changeme 2>/dev/null; then
            echo "ERROR: CHANGE_ME_ plaintext placeholders found in k8s/base/:"
            cat /tmp/changeme
            echo
            echo "Replace with __SENTINEL__ form + comment pointing at the SOPS overlay."
            exit 1
          fi

          echo "OK — no plaintext production secrets detected."

      - name: Domain-sentinel guard for k8s overlays (G-083)
        run: |
          set -euo pipefail
          # Two things must not be committed under k8s/:
          #   1. the legacy `yourdomain.com` placeholder (a non-routable
          #      hostname that would apply silently);
          #   2. a `__GREMION_*_DOMAIN__` sentinel in a file the operator's
          #      substitution recipe does not reach — because the recipe is
          #      what turns those sentinels into a real domain, and one left
          #      behind produces a router that matches nothing. The failure is
          #      late and silent: an IngressRoute `match` is an unconstrained
          #      string, so the API server admits it and Traefik simply routes
          #      nothing there.
          #
          # This guard used to exempt exactly one path,
          # `patches/ingressroutes-prod.yaml`. That file no longer exists — the
          # patches were split into a `patches/ingressroutes-prod/` DIRECTORY —
          # so the exemption matched nothing and the guard flagged the repo's
          # own intended state, 16 sentinel lines across 7 files. It failed
          # closed rather than open, which is the better direction, but it was
          # still a guard that could not pass.
          #
          # The exempt set is now DERIVED FROM THE RECIPE instead of hardcoded,
          # so the two cannot drift apart again: whatever paths the operator
          # recipe sed's over are exactly the paths allowed to carry sentinels.
          violations=0
          if grep -rn 'yourdomain\.com' k8s/ > /tmp/yourdomain 2>/dev/null; then
            echo "ERROR: legacy 'yourdomain.com' placeholder found in k8s/:"
            cat /tmp/yourdomain
            violations=1
          fi

          recipe=k8s/overlays/production/patches/ingressroutes-prod/gremion-ui-https.yaml
          if [ ! -f "$recipe" ]; then
            echo "ERROR: the substitution recipe $recipe is missing — this guard derives its exempt set from it."
            exit 1
          fi
          # Every k8s/overlays/production/patches/... path the recipe names,
          # glob-expanded against the tree.
          #
          # ANCHORED TO THE RECIPE'S ARGUMENT LINES, not to the whole file. The
          # extraction used to be `grep -oE '<path pattern>' "$recipe"` over
          # every line, prose included — so a path merely MENTIONED in a comment
          # silently widened the exempt set, which is the opposite of what this
          # derivation is for. (The recipe file documented that footgun instead
          # of fixing it: "Do not write another such path into this comment
          # block — the guard cannot tell prose from recipe.") A recipe argument
          # line is a comment containing NOTHING but the path and an optional
          # trailing line-continuation backslash, so that is what is matched.
          allowed=$(mktemp)
          grep -E '^#[[:space:]]+k8s/overlays/production/patches/[A-Za-z0-9_./*-]+[[:space:]]*[\]?[[:space:]]*$' "$recipe" \
            | sed -E 's/^#[[:space:]]+//; s/[[:space:]]*[\]?[[:space:]]*$//' \
            | sort -u \
            | while read -r pat; do
                # shellcheck disable=SC2086
                for f in $pat; do [ -f "$f" ] && echo "$f"; done
              done \
            | sort -u > "$allowed"
          n_allowed=$(grep -c . "$allowed" || true)
          if [ "${n_allowed:-0}" -lt 2 ]; then
            echo "ERROR: derived only ${n_allowed:-0} substitutable path(s) from $recipe."
            echo "Either the recipe stopped naming its paths, or they moved — the exempt set is not real."
            exit 1
          fi
          echo "Recipe covers $n_allowed file(s):"
          sed 's/^/  /' "$allowed"

          # Sentinels in COMMENTS are documentation (the recipe quotes its own
          # sentinel names); only a sentinel in a value gets substituted, so
          # only those are checked.
          : > /tmp/unreplaced-strict
          if grep -rnE '__GREMION_[A-Z_]*DOMAIN__' k8s/overlays/production/ 2>/dev/null \
             | grep -vE ':[[:space:]]*#' > /tmp/unreplaced; then
            while IFS= read -r hit; do
              f=${hit%%:*}
              grep -qxF "$f" "$allowed" || printf '%s\n' "$hit" >> /tmp/unreplaced-strict
            done < /tmp/unreplaced
          fi
          if [ -s /tmp/unreplaced-strict ]; then
            echo "ERROR: __GREMION_*_DOMAIN__ sentinel in a file the substitution recipe does not reach:"
            cat /tmp/unreplaced-strict
            echo
            echo "Add the file to the sed recipe at the top of $recipe,"
            echo "or move the sentinel into a file the recipe already covers."
            violations=1
          fi

          if [[ "$violations" -ne 0 ]]; then
            exit 1
          fi
          echo "OK — no yourdomain.com, and every domain sentinel is inside the substitution recipe's reach."

      - name: Proxy-trust sentinel guard (#202 P2.1c FIX4-CLI-CI)
        run: |
          set -euo pipefail
          # The tenant proxy-trust shared secret is materialised into the
          # x-proxy-trust Middleware header by an `op: replace` in a
          # git-tracked patch. UNLIKE the SOPS Secrets, that patch is NOT
          # gitignored, so an operator who runs the substitution in place and
          # commits would push the real shared secret into the history of a
          # public repository. This guard rejects any committed value that is
          # not one of the fail-closed sentinels.
          #
          # The patch used to be one file, k8s/overlays/production/patches/
          # ingressroutes-prod.yaml, and this step still named it after the
          # split into a DIRECTORY of per-resource patches. `grep` on a missing
          # file produced an empty value, which the check below reported as
          # "could not locate" — so the guard failed on every run for a reason
          # that had nothing to do with a leaked secret. It is now discovered
          # by content: whichever tracked file carries the op is the file
          # checked, and if a second one appears it is checked too.
          mapfile -t patches < <(grep -rl 'path: /spec/headers/customRequestHeaders/x-proxy-trust' \
                                   k8s/ --include='*.yaml' | sort)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "ERROR: no file under k8s/ carries the x-proxy-trust op."
            echo "Either the patch was removed (then remove this guard deliberately) or it moved again."
            exit 1
          fi
          # The two accepted sentinels: the overlay placeholder the patch ships
          # with, and the base Middleware's fail-closed value. Either is a
          # no-secret marker; anything else is a materialised real secret.
          accepted='^(__TENANT_PROXY_SHARED_SECRET__|__OVERRIDE_FROM_OVERLAY_TENANT_PROXY_SHARED_SECRET__)$'
          for patch in "${patches[@]}"; do
            # The `value:` line immediately under the `path:` op (-A2 covers it).
            val=$(grep -A2 'path: /spec/headers/customRequestHeaders/x-proxy-trust' "$patch" \
                    | grep -E '^\s*value:' \
                    | head -n1 \
                    | sed -E 's/^\s*value:\s*//; s/^["'\'']//; s/["'\'']\s*$//' || true)
            if [[ -z "$val" ]]; then
              echo "ERROR: found the x-proxy-trust op in $patch but no 'value:' under it."
              echo "If the patch shape changed, update this guard deliberately."
              exit 1
            fi
            if ! echo "$val" | grep -qE "$accepted"; then
              echo "ERROR: the x-proxy-trust value in $patch is not a fail-closed sentinel:"
              echo "  found: $val"
              echo
              echo "A real proxy-trust secret must NEVER be committed. Copy the patch to a"
              echo "gitignored overlay-local file before substituting (see the header note in"
              echo "$patch); the committed file must keep __TENANT_PROXY_SHARED_SECRET__."
              exit 1
            fi
            echo "OK — $patch carries the fail-closed sentinel ($val)."
          done
          echo "OK — checked ${#patches[@]} x-proxy-trust patch file(s)."

      # TRD-364: no self-hosted runner, no signing/age/SSH material and no deploy
      # secret in any workflow. This is the runner-policy arm of
      # scripts/ci-local/guards.mjs, run alone the way suites.json's
      # kernel-runner-policy-guard runs it, NOT `guards.mjs --kernel .`: the other
      # arms of that entry point need things this job does not have (a gitleaks
      # binary on PATH -- the gitleaks step above downloads its own, inside the
      # action -- and a StuRaOS checkout for the vertical arms), and its secret-scan
      # arm would scan the whole tree a second time. The suite runs first so a
      # walker that returned [] cannot make the guard pass vacuously.
      - name: Runner policy (TRD-364)
        run: |
          node --test --test-reporter=tap scripts/ci-local/runner-policy.test.mjs
          node scripts/ci-local/runner-policy.mjs --kernel . --waivers scripts/ci-local/waivers.json

      # The workflow guards itself: every required verify suite is run by some
      # leg below, no suite by two, every leg that uploads a record is awaited by
      # verify-gate, and --allow-missing exists only on the pull-request path.
      # Delegates to the Makefile so a local `make lint` and CI cannot drift apart.
      - name: Every required verify suite is run by exactly one leg
        run: make lint-ci-verify-coverage

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1b: DCO — the inbound=outbound guarantee, actually checked
  #
  # CONTRIBUTING.md requires a Signed-off-by trailer on every commit, and the
  # docs market DCO-not-CLA as this project's provenance story. Nothing
  # enforced it: no DCO app on the repository, no job here, no checkbox on the
  # PR template. The guarantee was documentation only.
  #
  # SCOPE — stated plainly, so nobody reads this as a repository-wide gate:
  #
  #   * It judges pull requests whose head branch lives in ANOTHER repository —
  #     i.e. every third-party contribution, which is the case the DCO exists
  #     for: the contributor is not the copyright holder, so the certification
  #     has to come from them, per commit, in the commit message.
  #
  #   * It does NOT judge branches pushed inside this repository. Only
  #     maintainers can push here, and the history written before the public
  #     flip was authored by the copyright holder rather than contributed
  #     under the DCO — almost none of it carries the trailer. The check is
  #     `git log --format=%b | grep -c Signed-off-by` against
  #     `git rev-list --count HEAD`; no fixed number is quoted here because it
  #     moves with every commit and a stale count in a public file is worse
  #     than none. A gate over
  #     in-repo branches would have failed its own introducing pull request
  #     for a reason unrelated to that diff, and a gate that goes red for an
  #     unrelated reason is how people learn to ignore a gate.
  #
  # This is a REAL narrowing, not a formality, so it is written down in both
  # places a reader meets it: the job name says "(external pull requests)" and
  # .github/PULL_REQUEST_TEMPLATE.md says the same. CONTRIBUTING.md still asks
  # maintainers to sign off (`git commit -s`) — for them it is a habit this job
  # does not police. To gate maintainer commits too, delete the `full_name`
  # clause below; sign off the outstanding branches first, or the next pull
  # request is red on arrival for a reason unrelated to its diff.
  # ──────────────────────────────────────────────────────────────────────────
  dco:
    name: DCO sign-off (external pull requests)
    runs-on: ubuntu-latest
    # `head.repo.full_name != github.repository` rather than `head.repo.fork`:
    # the two agree today, but `.fork` describes the HEAD repository's own
    # nature, so if this repository ever becomes a fork itself every
    # same-repo pull request would start matching. Comparing full names asks
    # the question the scope note actually poses — did this branch come from
    # somewhere else?
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need the full range to walk every commit in the PR

      - name: Every commit in this PR must be signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range="$BASE..$HEAD"
          mapfile -t commits < <(git rev-list "$range")
          # Vacuity guard: a pull request always contains at least one commit.
          # Zero here means the range is wrong, not that everything passed.
          if [ "${#commits[@]}" -eq 0 ]; then
            echo "::error::no commits found in $range — this check is not looking at the PR"
            exit 1
          fi
          echo "Checking ${#commits[@]} commit(s) in $range"
          missing=0
          for c in "${commits[@]}"; do
            # Merge commits are created by GitHub, not by the contributor.
            if [ "$(git rev-list --parents -n 1 "$c" | wc -w)" -gt 2 ]; then
              echo "  skip (merge)  $(git log -1 --format='%h %s' "$c")"
              continue
            fi
            if git log -1 --format='%B' "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "  ok            $(git log -1 --format='%h %s' "$c")"
            else
              echo "  NOT SIGNED    $(git log -1 --format='%h %s' "$c")"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo
            echo "::error::$missing commit(s) have no Signed-off-by trailer."
            echo "Sign off with 'git commit -s'; for commits already made:"
            echo "  git rebase --signoff $BASE"
            echo "CONTRIBUTING.md says what signing off certifies (DCO 1.1)."
            exit 1
          fi
          echo "OK — every commit is signed off."

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Verify legs. `make verify` (scripts/verify/verify.mjs) is the merge
  # gate: it runs every suite in scripts/verify/required-suites.txt and writes
  # a record that scripts/verify/check-record.mjs judges. CI used to run its own
  # partial copy of that gate (this file's unit-test job, plus gremion-ui.yml,
  # gremion-public.yml, control-panel.yml and ports.yml) and the two drifted:
  # whole suites ran locally and nowhere in CI. Now each leg below runs a slice
  # of the SAME suites with `verify --only`, uploads its record, and
  # `verify-gate` combines them (scripts/verify/combine-records.mjs) and judges
  # the result with the SAME check-record.mjs the local gate uses.
  #
  # A leg's part list must not overlap another's, and together the legs must
  # cover every required suite (`unit` and `integration` by every one of their
  # parts). scripts/check-ci-verify-coverage.mjs (make lint-ci-verify-coverage,
  # in the Lint job) fails the build when either stops being true, so adding a
  # UNIT_PARTS key without a leg is red on the pull request that adds it.
  #
  # verify refuses a dirty tree. Everything a leg generates before it runs
  # (the paraglide catalogue, the module overlay, `svelte-kit sync`) is
  # gitignored, which is what keeps the record's "this exact commit" claim true.
  # ──────────────────────────────────────────────────────────────────────────

  # typecheck, migration-hash, boundary-lint, carve-lint. carve-lint is every
  # `make lint-*` target (shellcheck, yamllint, docker for the compose renders, jq,
  # python3), which is why the tools below are installed here.
  verify-static:
    name: "Verify: static suites"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same pinned, checksummed install as the Lint job: the apt package on
      # ubuntu-latest is 0.9.0 and raises notes the local gate (0.11.0) does not.
      - name: Install shellcheck
        run: |
          curl -fsSLo /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install yamllint
        run: pip install yamllint

      # kernel-hygiene check a9 ("the documented onboarding path works") runs
      # `bats --version`; carve-lint runs that check through lint-hygiene.
      - name: Install BATS
        run: sudo npm install -g bats

      # `pnpm check` runs these before svelte-check; the typecheck suite calls
      # svelte-check on its own (to get machine output) and does not, so on a clean
      # checkout it type-checks against a catalogue and a module overlay that do not
      # exist yet (30 errors in gremion-ui, 6 in gremion-public, all "cannot find
      # module ./paraglide/..." or "./$types"). Both outputs are gitignored.
      - name: Generate the i18n catalogue and the module overlay
        run: |
          node src/lib/i18n/compile.js
          node scripts/interim-module-overlay.mjs
        working-directory: gremion-ui

      - name: Generate the portal's i18n catalogue
        run: node src/lib/i18n/compile.js
        working-directory: gremion-public

      - name: Run verify (typecheck, migration-hash, boundary-lint, carve-lint)
        id: verify
        run: node scripts/verify/verify.mjs --only typecheck,migration-hash,boundary-lint,carve-lint

      # control-panel.yml's `pnpm run check`. The typecheck suite walks packages/*
      # and services/*, and apps/control-panel is in neither, so its svelte-check
      # ran in no verify suite. After verify (not before) so a failure here cannot
      # keep the record from being written.
      - name: Control panel svelte-check
        if: ${{ !cancelled() && steps.verify.outcome != 'skipped' }}
        run: pnpm run check
        working-directory: apps/control-panel

      # The record is the leg's whole product, so it is uploaded even when a suite
      # failed (verify writes it either way) and a missing record is itself an
      # error. `steps.verify.outcome` keeps that from firing when the leg never
      # got as far as running verify (a failed install): that failure is reported
      # by the step that failed, not buried under a second one.
      - name: Upload verify record
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-verify-static
          path: scripts/verify/out/*.json
          if-no-files-found: error
          retention-days: 7

  # render-guards and observability render the production compose projects
  # (docker compose config); vendor-mail and expand-contract are node-only.
  verify-render-ops:
    name: "Verify: render and ops suites"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify (render-guards, observability, vendor-mail, expand-contract)
        id: verify
        run: node scripts/verify/verify.mjs --only render-guards,observability,vendor-mail,expand-contract

      # The record is the leg's whole product, so it is uploaded even when a suite
      # failed (verify writes it either way) and a missing record is itself an
      # error. `steps.verify.outcome` keeps that from firing when the leg never
      # got as far as running verify (a failed install): that failure is reported
      # by the step that failed, not buried under a second one.
      - name: Upload verify record
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-verify-render-ops
          path: scripts/verify/out/*.json
          if-no-files-found: error
          retention-days: 7

  # gremion-ui's vitest alone runs three to six minutes, so it has a leg to itself
  # with the disabled-module lane that builds on it.
  verify-unit-ui:
    name: "Verify: gremion-ui units"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Moved here from gremion-ui.yml. THE POST-CONDITION, not a model of it.
      # `pnpm deploy --prod --legacy` is the exact command gremion-ui/Dockerfile
      # uses to assemble the image's /app/node_modules, and it applies each
      # workspace package's `files` allowlist while packing. A publish-shaped
      # allowlist (`["dist", …]`, dist/ being gitignored and never built during a
      # Docker build) copies @gremion/db and @gremion/ports into the image as
      # empty shells whose exports still point at ./src/*.ts. That ships silently
      # today because vite.config.ts marks both packages `ssr.noExternal`, so every
      # import is inlined into build/ and the package is never resolved at runtime
      # -- one dynamic import away from ERR_MODULE_NOT_FOUND on boot.
      #
      # ~4 s, and it covers BOTH packages: gremion-ui is the only app that
      # depends on @gremion/ports as well as @gremion/db. The Lint job runs the
      # same script in `--static` mode on every run. Before verify, because it
      # writes only under $RUNNER_TEMP and keeps the tree clean.
      - name: The deploy payload must contain what the packages export
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/deploy-check"
          pnpm --filter gremion-ui deploy --prod --legacy "$RUNNER_TEMP/deploy-check"
          node scripts/check-shipped-package-files.mjs --deploy "$RUNNER_TEMP/deploy-check"

      - name: Run verify (unit:ui, unit:module-lane)
        id: verify
        run: node scripts/verify/verify.mjs --only unit:ui,unit:module-lane

      # The record is the leg's whole product, so it is uploaded even when a suite
      # failed (verify writes it either way) and a missing record is itself an
      # error. `steps.verify.outcome` keeps that from firing when the leg never
      # got as far as running verify (a failed install): that failure is reported
      # by the step that failed, not buried under a second one.
      - name: Upload verify record
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-verify-unit-ui
          path: scripts/verify/out/*.json
          if-no-files-found: error
          retention-days: 7

  # isolation and every packages/*, apps/control-panel and services/kernel-api unit
  # part. This is where ports.yml's unit run and control-panel.yml's two vitest
  # suites (the control panel and packages/provisioning) now live.
  verify-unit-packages:
    name: "Verify: package units"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # unit:generated-clients' T9 contract gate diffs the spec against the
          # base branch (contracts-check-core.mjs resolveBaseRef). A shallow
          # merge-commit checkout has no origin/main, and the gate correctly
          # fails closed on a missing base rather than passing on nothing.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Dart pipeline integration test never pulls on its own: on a cold
      # host it fails closed with "image not present locally", so a missing
      # image cannot turn into a silently skipped proof. The runner is that
      # cold host, so the pinned images are pulled here, explicitly.
      - name: Pull the pinned Dart toolchain images for unit:generated-clients-dart
        run: pnpm --filter @gremion/generated-clients-dart images:pull

      # The control panel's vitest run needs the gitignored .svelte-kit/tsconfig.json
      # that `svelte-kit sync` writes (control-panel.yml got it as a side effect of
      # running `pnpm run check` first; gremion-ui's pretest:unit does the same).
      - name: svelte-kit sync for the control panel
        run: pnpm exec svelte-kit sync
        working-directory: apps/control-panel

      # ports.yml's server, for the one reason it needed one: unit:ports runs
      # packages/ports/vitest.config.ts, which collects nats-broker*.integration.test.ts
      # with no exclude, and those files self-skip unless NATS_TEST_URL is set. A skip
      # there is allow-listed, but a proof that runs beats one that is excused: with a
      # server the files run instead of skipping. JetStream needs
      # the `-js` argument, which a `services:` entry cannot pass to an image, hence a
      # step. Same digest-pinned image as docker-compose.yml's nats service; the real
      # proof of NatsBroker stays integration:nats (verify-integration-brokers).
      - name: Start NATS (JetStream) for the ports unit part
        run: |
          docker run -d --name nats-js -p 4222:4222 nats:2.12.15-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6 -js
          echo "Waiting for NATS to accept connections on :4222 ..."
          for i in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/4222' 2>/dev/null; then
              echo "NATS ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::NATS did not accept connections within 30 s"
          docker logs nats-js || true
          exit 1

      - name: Run verify (isolation and the package unit parts)
        id: verify
        env:
          NATS_TEST_URL: nats://localhost:4222
        run: node scripts/verify/verify.mjs --only isolation,unit:public,unit:ports,unit:generated-clients,unit:fastify-service-template,unit:generated-clients-dart,unit:tenant-store,unit:module-catalogue,unit:tokens,unit:edge-routers,unit:nats-auth,unit:events,unit:provisioning,unit:member-import,unit:retention,unit:control-panel,unit:tenancy-core,unit:authz-client,unit:kernel-api

      - name: Stop NATS
        if: always()
        run: docker rm -f nats-js || true

      # The record is the leg's whole product, so it is uploaded even when a suite
      # failed (verify writes it either way) and a missing record is itself an
      # error. `steps.verify.outcome` keeps that from firing when the leg never
      # got as far as running verify (a failed install): that failure is reported
      # by the step that failed, not buried under a second one.
      - name: Upload verify record
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-verify-unit-packages
          path: scripts/verify/out/*.json
          if-no-files-found: error
          retention-days: 7

  # unit:modules, unit:node, unit:bats. This leg REPLACES the old unit-test job: the
  # bats part globs test/*.bats and test/host/*.bats, the same set `make test-unit`
  # collects, and test/host/no-host-literals.bats fails if ci.yml stops running it
  # through verify or the part's patterns drift from the Makefile's.
  verify-unit-host:
    name: "Verify: module, script and host units"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What the old unit-test job installed, minus nothing: envsubst is needed by
      # legal.bats' template rendering tests, yamllint by the release-images.yml YAML
      # assertion in test/host/deploy-workflow.bats (which `skip`s when it is absent, and
      # a guard that skips is a guard that passes; that file now guards the keyless
      # release pipeline: release-images.yml, cut-dist-tag.sh, release-tag-check.sh),
      # bats is an EXTERNAL prerequisite from npm
      # (not vendored). jq and openssl are preinstalled on the runner image;
      # python3 too (test/configure-keycloak.bats validates JSON with it).
      - name: Install BATS and test dependencies
        run: |
          sudo apt-get install -y gettext-base jq
          pip install yamllint
          sudo npm install -g bats

      # Same pinned, checksummed install as the Lint job: the apt package on
      # ubuntu-latest is 0.9.0 and raises notes the local gate (0.11.0) does not.
      - name: Install shellcheck
        run: |
          curl -fsSLo /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      # unit:node runs EVERY scripts/**/*.test.mjs, and a few of them drive real
      # release tooling that the old CI never ran. Each is a pinned release asset
      # checked against its sha256 before it is installed (the pins for cosign are
      # the ones scripts/release/lib/tools.mjs#COSIGN asserts; assertCosign refuses
      # any other binary). sops and age were not on the runner image; their hashes
      # are the release's own checksums (sops) and the asset's own (age publishes
      # none beside a transparency-log proof, so that one was computed at pin time).
      - name: Install the release toolchain the node suites drive (cosign, sops, age, gitleaks)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo cosign https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  cosign" | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          curl -fsSLo age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz" | sha256sum -c -
          tar -xzf age.tar.gz
          sudo install -m 0755 age/age age/age-keygen /usr/local/bin/
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          cosign version | head -n 3
          sops --version
          age --version
          gitleaks version

      - name: Run verify (unit:modules, unit:node, unit:bats)
        id: verify
        run: node scripts/verify/verify.mjs --only unit:modules,unit:node,unit:bats

      # The record is the leg's whole product, so it is uploaded even when a suite
      # failed (verify writes it either way) and a missing record is itself an
      # error. `steps.verify.outcome` keeps that from firing when the leg never
      # got as far as running verify (a failed install): that failure is reported
      # by the step that failed, not buried under a second one.
      - name: Upload verify record
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-verify-unit-host
          path: scripts/verify/out/*.json
          if-no-files-found: error
          retention-days: 7

  # integration:vitest (gremion-ui test:integration, with `pnpm migrate:test-fixture`,
  # against a throwaway Postgres the suite starts itself) and integration:fresh-init
  # (`make fresh-init-proof`). Both start their own containers by name; neither
  # touches a service container, so none is declared here.
  verify-integration-db:
    name: "Verify: database integration"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify (integration:vitest, integration:fresh-init)
        id: verify
        run: node scripts/verify/verify.mjs --only integration:vitest,integration:fresh-init

      # The record is the leg's whole product, so it is uploaded even when a suite
      # failed (verify writes it either way) and a missing record is itself an
      # error. `steps.verify.outcome` keeps that from firing when the leg never
      # got as far as running verify (a failed install): that failure is reported
      # by the step that failed, not buried under a second one.
      - name: Upload verify record
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-verify-integration-db
          path: scripts/verify/out/*.json
          if-no-files-found: error
          retention-days: 7

  # integration:nats is ports.yml's NATS step plus its post-condition: `make
  # test-ports-nats` starts its own JetStream container and asserts the integration
  # file's passing-test floor (packages/ports/scripts/nats-test.sh), and verify
  # judges the printed counts again. integration:nats-auth and integration:events
  # are the authenticated-broker and event-relay proofs, each in scratch
  # containers removed by name.
  verify-integration-brokers:
    name: "Verify: broker integration"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify (integration:nats, integration:nats-auth, integration:events)
        id: verify
        run: node scripts/verify/verify.mjs --only integration:nats,integration:nats-auth,integration:events

      # The record is the leg's whole product, so it is uploaded even when a suite
      # failed (verify writes it either way) and a missing record is itself an
      # error. `steps.verify.outcome` keeps that from firing when the leg never
      # got as far as running verify (a failed install): that failure is reported
      # by the step that failed, not buried under a second one.
      - name: Upload verify record
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-verify-integration-brokers
          path: scripts/verify/out/*.json
          if-no-files-found: error
          retention-days: 7

  # census renders the four production compose projects exactly as a host
  # composes them and BUILDS every first-party image to read its HEALTHCHECK, so it
  # is the slowest leg. On a pull request it runs only when something it reads
  # changed (see the `census` output of the `changes` job); verify-gate then
  # requires its absence to be exactly that, never an unexplained gap.
  verify-census:
    name: "Verify: health census"
    runs-on: ubuntu-latest
    needs: [lint, changes]
    # Same shape as docker-build's condition, for the same reason: `changes` is
    # skipped on push / workflow_dispatch, which would skip this job with it. Push
    # and manual runs always census; a pull request does when a census input
    # changed OR when the `changes` job itself failed (fail safe: run it).
    if: >-
      ${{ !cancelled()
      && needs.lint.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.changes.result == 'failure'
          || needs.changes.outputs.census == 'true') }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify
        id: verify
        run: node scripts/verify/verify.mjs --only census

      # The record is the leg's whole product, so it is uploaded even when a suite
      # failed (verify writes it either way) and a missing record is itself an
      # error. `steps.verify.outcome` keeps that from firing when the leg never
      # got as far as running verify (a failed install): that failure is reported
      # by the step that failed, not buried under a second one.
      - name: Upload verify record
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-verify-census
          path: scripts/verify/out/*.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Docker build validation.
  #
  # Every first-party image that builds from this repository, build only: no
  # login, no push, no secrets. All build contexts are the repository root
  # except legal's, fallback's and synapse's, which are their own directories
  # (a pinned nginx or synapse base plus a few COPYs). The one image left out
  # is vector, whose build clones and compiles ipcrypt2 and is not worth a
  # per-commit gate; the two test-runner images (scripts/verify/bats-runner,
  # test/host/runner) are not shipped. scripts/check-ci-docker-filter.test.mjs
  # fails if a tracked Dockerfile is in neither the matrix nor that list.
  #
  # Why this runs on pull requests (2026-10-29): it used to be push-only
  # ("PR-time docker builds duplicate work that is recovered the moment the PR
  # merges"), and the only image it built was legal. TASK-033-a made
  # packages/tenant-store depend on @gremion/retention; the kernel-api and
  # board Dockerfiles never COPYed packages/retention, `pnpm deploy` failed
  # inside the image build, and PR #41 merged green to main with the break in
  # it -- nothing on the PR path ever built those images. The cost objection is
  # answered by the `changes` job below: a PR that touches no image input skips
  # the matrix entirely.
  # ──────────────────────────────────────────────────────────────────────────

  # Decides whether a pull request can have changed any docker build input, and
  # (second output) any input of the health census. A plain `git diff` over the PR range rather than a third-party paths-filter
  # action: nothing to pin, nothing to trust with the checkout. A path filter on
  # the `on:` trigger is not an option -- it would skip the whole workflow
  # (lint, tests) and leave the required checks pending. Push and manual runs
  # do not need it: the docker-build job runs unconditionally for them.
  changes:
    name: Docker inputs changed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      census: ${{ steps.filter.outputs.census }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # three-dot diff needs the merge base
          persist-credentials: false

      - name: Does this PR touch a docker build input or a census input?
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Any Dockerfile/Containerfile or .dockerignore anywhere, plus every
          # tree and root file a Dockerfile COPYs from: the workspace packages,
          # services, modules, apps, both SvelteKit apps, the legal and fallback
          # images, the vertical data directories, the kernel-api's migration
          # register, this workflow, the LICENSE/NOTICE files, and the
          # lockfile/workspace/root manifests every pnpm image copies first.
          pattern='(^|/)(Dockerfile|Containerfile)(\.[^/]*)?$|(^|/)\.dockerignore$|^(packages|services|modules|apps|gremion-ui|gremion-public|verticals|docker/legal|docker/fallback|scripts/migrations)/|^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|LICENSE|NOTICE|\.github/workflows/ci\.yml)$'
          # --no-renames: with rename detection --name-only prints only the
          # destination of a move, so `git mv packages/x docs/x` (a docker input
          # leaving its build tree) would look like a docs-only change. With it
          # a move lists both the old and the new path. quotePath=false keeps
          # non-ASCII names literal so the pattern sees them as written.
          changed=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          # Print a count, never the names: they are PR-controlled and the
          # Actions runner interprets `::command::` at the start of a log line
          # (workflow-command injection through a crafted file name).
          echo "Changed files in this PR: $(printf '%s\n' "$changed" | grep -c . || true)"
          # Count matches; do not feed a producer to a grep that quits early.
          # Under pipefail, a quiet grep exits at its first match, the writer
          # takes SIGPIPE once the list outgrows the 64 KiB pipe buffer (a few
          # thousand paths: a carve, a mass rename), the pipeline returns 141,
          # the if takes its else branch and the step would report
          # docker=false with nothing red. grep -c reads all of its input.
          # Exit 1 only means "no match"; any other grep failure fails the
          # step (and a failed step builds everything, see docker-build).
          matches=$(printf '%s\n' "$changed" | grep -Ec "$pattern" || [ "$?" -eq 1 ])
          if [ "$matches" -gt 0 ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "A docker build input changed: image builds will run."
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "No docker build input changed: image builds skipped."
          fi
          # The health census (verify-census) renders every production compose
          # project and builds the first-party images to read their HEALTHCHECKs:
          # any Dockerfile or .dockerignore, any compose file, compose/ (the ops
          # project), docker/ (the legal, fallback, vector, keycloak and nats
          # contexts the renders build or mount), infra/host/ (the env templates
          # that name each project's COMPOSE_FILE/COMPOSE_PROFILES, and the mail
          # project), the census's own code and fixtures, and this workflow (it
          # judges the result). Same counted-grep idiom as above, for the same
          # reason.
          census_pattern='(^|/)(Dockerfile|Containerfile)(\.[^/]*)?$|(^|/)\.dockerignore$|(^|/)docker-compose[^/]*\.ya?ml$|^(compose|docker|infra/host|scripts/verify/census)/|^\.github/workflows/ci\.yml$'
          census_matches=$(printf '%s\n' "$changed" | grep -Ec "$census_pattern" || [ "$?" -eq 1 ])
          if [ "$census_matches" -gt 0 ]; then
            echo "census=true" >> "$GITHUB_OUTPUT"
            echo "A census input changed: the census will run."
          else
            echo "census=false" >> "$GITHUB_OUTPUT"
            echo "No census input changed: the census is skipped."
          fi

  docker-build:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    needs: [lint, changes]
    # `changes` is skipped on push / workflow_dispatch, and a job that needs a
    # skipped job is skipped itself unless it opts out with always(). So the
    # condition is explicit: the !cancelled() + lint check keep a failed lint
    # blocking the build, and the event clause picks who runs -- pushes and
    # manual runs always, pull requests when a docker input changed OR when the
    # `changes` job itself failed (an unreachable base sha, a fetch error): a
    # broken filter fails safe and builds everything rather than skipping the
    # builds. This is the line that used to read
    # `github.event_name == 'push' || github.event_name == 'workflow_dispatch'`,
    # which made the job skipped on every pull request.
    if: >-
      ${{ !cancelled()
      && needs.lint.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.changes.result == 'failure'
          || needs.changes.outputs.docker == 'true') }}
    # Build only. Read-only token; no registry login anywhere in this job.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: legal, dockerfile: docker/legal/Dockerfile, context: docker/legal/ }
          - { name: kernel-api, dockerfile: services/kernel-api/Dockerfile, context: . }
          - { name: control-panel, dockerfile: apps/control-panel/Dockerfile, context: . }
          - { name: gremion-ui, dockerfile: gremion-ui/Dockerfile, context: . }
          - { name: gremion-public, dockerfile: gremion-public/Dockerfile, context: . }
          - { name: board, dockerfile: modules/board/Dockerfile, context: . }
          - { name: calendar, dockerfile: modules/calendar/Dockerfile, context: . }
          - { name: content, dockerfile: modules/content/Dockerfile, context: . }
          - { name: files, dockerfile: modules/files/Dockerfile, context: . }
          - { name: finance, dockerfile: modules/finance/Dockerfile, context: . }
          - { name: messaging, dockerfile: modules/messaging/Dockerfile, context: . }
          - { name: publishing, dockerfile: modules/publishing/Dockerfile, context: . }
          - { name: vault, dockerfile: modules/vault/Dockerfile, context: . }
          - { name: votes, dockerfile: modules/votes/Dockerfile, context: . }
          - { name: fallback, dockerfile: docker/fallback/Dockerfile, context: docker/fallback/ }
          - { name: synapse, dockerfile: modules/messaging/synapse/Dockerfile, context: modules/messaging/synapse/ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.dockerfile }} -t gremion-ci/${{ matrix.name }}:ci ${{ matrix.context }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Integration tests — requires live Docker Compose stack
  # The Keycloak half: the live realm, its login theme and the OIDC discovery,
  # read off the SERVED pages. It runs on pull requests too since the verify
  # legs replaced the unit-test job it used to wait for: gating a pull request
  # on the unit tests and then discovering a broken realm only after the merge
  # was the same gap the docker-build job closed for images.
  # ──────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install BATS and test dependencies
        run: |
          sudo apt-get install -y gettext-base
          sudo npm install -g bats

      - name: Set up .env
        run: |
          cp .env.example .env
          mkdir -p legal && touch legal/legal.env
          # Replace EVERY CHANGE_ME_* placeholder so no predictable seeder /
          # OIDC / DB / restic / admin secret leaks into a CI container's env
          # (G-042). The hand-curated sed list previously here covered 11 of
          # ~22 placeholders; this loop is self-maintaining as .env.example
          # grows. The guard rail at the end converts any future drift from a
          # silent failure into a CI-blocking error.
          gen() { openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32; }
          # 1) Special-case the discovery URI's CHANGE_ME_domain (hostname, not
          #    a secret) — substitute first so it does not match the generic
          #    placeholder rewrite below.
          sed -i 's|CHANGE_ME_domain|ci.local|g' .env
          # 2) Every remaining CHANGE_ME_<name>: rewrite each DISTINCT token to
          #    a fresh random value, with the same value applied everywhere the
          #    token appears (e.g. PUBLIC_DB_PASSWORD and the embedded
          #    password in GREMION_PUBLIC_DB_URL share CHANGE_ME_public_reader).
          for name in $(grep -oE 'CHANGE_ME_[a-zA-Z0-9_]+' .env | sort -u); do
            val=$(gen)
            sed -i "s|${name}|${val}|g" .env
          done
          # 3) Guard rail — no CHANGE_ME_ may survive in a VALUE line. Fail
          #    loudly if drift introduces a placeholder the loop above missed.
          #    Comment lines may legitimately mention CHANGE_ME_ in prose (e.g.
          #    the G-087 note explaining the sentinel system), so ignore them.
          if grep -vE '^[[:space:]]*#' .env | grep -q 'CHANGE_ME_'; then
            echo "::error::CHANGE_ME_ token survived .env sweep (in a value line):"
            grep -nE '^[[:space:]]*[^#].*CHANGE_ME_' .env
            exit 1
          fi
          echo "Rewrote .env placeholders; $(grep -c '^[A-Z_]*=' .env) settings populated"

      - name: Pull Docker images
        run: docker compose pull postgres keycloak

      # The state tier names its networks and volumes as externals (${STACK}_state
      # etc.; bootstrap.sh creates them on a host). Create them for the .env's STACK
      # first, or compose refuses to start postgres.
      - name: Start databases
        run: |
          make dev-networks DEV_STACK="$(sed -n 's/^STACK=//p' .env | tail -n 1)"
          docker compose up -d postgres

      - name: Wait for PostgreSQL to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 120 bash -c 'until docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-postgres}" >/dev/null 2>&1; do sleep 3; printf "."; done'
          echo " ready"

      # Applies the whole kernel chain to a THROWAWAY Postgres and asserts
      # tables, a column, a CHECK definition and the public-reader grants in the
      # database. Independent of the compose stack started above - it starts and
      # removes its own container on port 15433.
      - name: Fresh init of the kernel migration chain
        run: make fresh-init-proof

      - name: Start Keycloak
        run: docker compose up -d keycloak

      - name: Wait for Keycloak to be healthy
        run: |
          echo "Waiting for Keycloak..."
          # Health endpoint is on management port 9000 (not mapped); check the main
          # API at /auth/realms/master — the built-in realm, which answers as soon
          # as Keycloak has finished migrating its own database. B-01: no realm is
          # created at boot, so master is the only one that exists at this point.
          timeout 300 bash -c 'until curl -sf http://localhost:8082/auth/realms/master 2>/dev/null | grep -q "\"realm\""; do sleep 5; printf "."; done'
          echo " ready"

      - name: Provision the realm under test
        run: |
          # B-01 (spec B T.4): nothing is imported at boot any more, so this job
          # creates the realm it tests. In production tenant-create composes it
          # through buildTenantRealmDoc; until that entrypoint lands, the fixture
          # renderer resolves the same template sentinels (realm name, apex
          # domain, sslRequired, the confidential client secrets) and REFUSES to
          # emit a document in which any survived. The realm CI tests is therefore
          # the committed per-tenant template -- including its loginTheme, which
          # is what login-theme.bats reads back off the SERVED page.
          KEYCLOAK_REALM=$(grep -m1 '^KEYCLOAK_REALM=' .env | cut -d= -f2-)
          KEYCLOAK_ADMIN=$(grep -m1 '^KEYCLOAK_ADMIN=' .env | cut -d= -f2-)
          KEYCLOAK_ADMIN_PASSWORD=$(grep -m1 '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          # G-044: generated at runtime by the "Set up .env" step, so GitHub's
          # own masking (declared secrets only) does not cover it.
          echo "::add-mask::$KEYCLOAK_ADMIN_PASSWORD"
          for v in KEYCLOAK_REALM KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty in .env - the realm under test cannot be created"
              exit 1
            fi
          done
          python3 test/integration/fixtures/render-realm-fixture.py             --realm "$KEYCLOAK_REALM" --apex ci.local > /tmp/ci-realm.json
          TOKEN=$(curl -sf -X POST http://localhost:8082/auth/realms/master/protocol/openid-connect/token             -d grant_type=password -d client_id=admin-cli             --data-urlencode "username=${KEYCLOAK_ADMIN}"             --data-urlencode "password=${KEYCLOAK_ADMIN_PASSWORD}"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          if [ -z "$TOKEN" ]; then
            echo "::error::could not obtain a Keycloak admin token from the master realm"
            exit 1
          fi
          code=$(curl -s -o /tmp/ci-realm-create.out -w '%{http_code}'             -X POST http://localhost:8082/auth/admin/realms             -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json'             --data-binary @/tmp/ci-realm.json)
          if [ "$code" != "201" ]; then
            echo "::error::creating realm ${KEYCLOAK_REALM} answered HTTP ${code}"
            cat /tmp/ci-realm-create.out
            exit 1
          fi
          # Post-conditions, not the exit code: the realm answers on the public
          # endpoint, and it carries a login theme - without one, every theme
          # assertion in login-theme.bats would be measuring the stock fallback.
          if ! curl -sf "http://localhost:8082/auth/realms/${KEYCLOAK_REALM}"                | grep -q "\"realm\":\"${KEYCLOAK_REALM}\""; then
            echo "::error::realm ${KEYCLOAK_REALM} does not answer after creation"
            exit 1
          fi
          theme=$(curl -sf -H "Authorization: Bearer ${TOKEN}"             "http://localhost:8082/auth/admin/realms/${KEYCLOAK_REALM}"             | python3 -c 'import json,sys; print(json.load(sys.stdin).get("loginTheme") or "")')
          if [ -z "$theme" ]; then
            echo "::error::realm ${KEYCLOAK_REALM} carries no loginTheme"
            exit 1
          fi
          echo "created realm ${KEYCLOAK_REALM} (loginTheme=${theme})"

      - name: Run integration tests (health)
        run: |
          # login-theme.bats reads the realm's effective display name from the
          # Admin API and asserts the SERVED page renders it, so it needs the
          # realm under test and the admin credentials. Both are derived, never
          # spelled: the realm is the one the previous step CREATED (named by
          # .env's KEYCLOAK_REALM) and the credentials come out of the same
          # .env. B-01: it is deliberately NOT read out of
          # docker/keycloak/realm-export.base.json any more - that file's realm
          # field is the `__REALM_NAME__` sentinel the provisioner overwrites,
          # and no Keycloak ever has a realm by that name. Unset any input and
          # the suite SKIPS - and a skip is a green test, so this step asserts
          # the inputs and the absence of skips, not the exit code.
          THEME_REALM=$(grep -m1 '^KEYCLOAK_REALM=' .env | cut -d= -f2-)
          KEYCLOAK_ADMIN=$(grep -m1 '^KEYCLOAK_ADMIN=' .env | cut -d= -f2-)
          KEYCLOAK_ADMIN_PASSWORD=$(grep -m1 '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          export THEME_REALM KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD
          # G-044: this password is generated by the "Set up .env" step at
          # runtime, so GitHub's own masking (declared secrets only) does not
          # cover it. Mask it before anything can echo it.
          echo "::add-mask::$KEYCLOAK_ADMIN_PASSWORD"
          # `test -n "$A" && test -n "$B"` was NOT a guard: an && list is a
          # TESTED command, so `bash -e` does not abort the step when the left
          # operand fails (verified: `bash -ec 'A=""; test -n "$A" && test -n
          # "x"; echo SURVIVED'` prints SURVIVED and exits 0), and it never
          # checked the username at all. Check each input on its own line.
          for v in THEME_REALM KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v resolved empty - login-theme.bats would skip, and a skip is green"
              exit 1
            fi
            # An EMPTY value skips; an unresolved `__SENTINEL__` does not - it
            # runs the suite against a realm nobody creates and fails six
            # assertions for a reason that reads like a theme bug. Reject it
            # here, where the message still names the cause.
            case "${!v}" in
              __*__)
                echo "::error::$v is the unresolved template sentinel ${!v} - no realm by that name exists"
                exit 1
                ;;
            esac
          done
          # One line on purpose: hygiene check t5 matches a bats invocation
          # line by line, so a continuation would hide a suite name from it.
          if bats test/integration/health.bats test/integration/oidc.bats test/integration/login-theme.bats >bats-integration.tap 2>&1; then
            rc=0
          else
            rc=$?
          fi
          cat bats-integration.tap
          # TAP marks a skipped test `ok N name # skip reason`, i.e. green. The
          # only reason any of these three suites skips is a missing input, and
          # this job is supposed to provide every one of them.
          if grep -q '# skip' bats-integration.tap; then
            echo "::error::an integration test skipped - CI must run all of them for real:"
            grep -n '# skip' bats-integration.tap
            exit 1
          fi
          exit $rc

      - name: Collect logs on failure
        if: failure()
        run: |
          # Build a redaction filter from the current .env so all CI-generated
          # secrets (G-042 random values) are scrubbed from any log output
          # before it lands in the GHA job log. GitHub's own log masking only
          # covers declared workflow secrets; the values populated by the
          # "Set up .env" step are generated at runtime and therefore NOT
          # masked. This step closes G-044.
          #
          # Special cases excluded from the .env-derived filter:
          #   - values shorter than 12 chars (collide with English words)
          #   - the literal "ci.local" (G-044 hostname, not a secret)
          #   - values containing "localhost" (URLs, paths)
          redact() {
            local sed_args=()
            while IFS='=' read -r _ value; do
              # Strip surrounding quotes, then filter obvious non-secrets
              value="${value%\"}"; value="${value#\"}"
              if [[ ${#value} -ge 12 && "$value" != *"localhost"* && "$value" != "ci.local" && "$value" != *"|"* ]]; then
                sed_args+=(-e "s|${value}|[REDACTED]|g")
              fi
            done < <(grep -E '^[A-Z_]+=' .env)
            # Belt-and-braces: redact common token patterns regardless of
            # whether their value happened to be in .env (e.g. tokens minted
            # at runtime by Keycloak's OIDC flow during integration tests).
            sed_args+=(
              -e 's|Bearer [A-Za-z0-9._\-]\+|Bearer [REDACTED]|g'
              -e 's|"access_token":"[^"]*"|"access_token":"[REDACTED]"|g'
              -e 's|"refresh_token":"[^"]*"|"refresh_token":"[REDACTED]"|g'
              -e 's|"client_secret":"[^"]*"|"client_secret":"[REDACTED]"|g'
              -e 's|password=[^ &]*|password=[REDACTED]|g'
            )
            sed "${sed_args[@]}"
          }

          echo "=== docker compose ps ==="
          docker compose ps                              | redact
          echo "=== keycloak logs ==="
          docker compose logs --tail=50 keycloak         | redact
          echo "=== postgres logs ==="
          docker compose logs --tail=30 postgres         | redact

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: End-to-end smoke. Not part of the verify record: it boots things.
  #
  # Folds the two checks gremion-ui.yml and gremion-public.yml ran that no
  # verify suite covers. Their type checks and unit tests are verify's
  # (typecheck, unit:ui, unit:public); the integration half of gremion-ui.yml is
  # integration:vitest; its image build is the docker-build matrix.
  # ──────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E smoke (gremion-ui, gremion-public)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 40
    # G-099 smoke step needs a real Postgres because hooks.server.ts boot()
    # invokes runMigrations() before the authGuard will serve traffic. With
    # no Postgres, boot fails, the guard returns 503 forever, and every
    # smoke assertion would fail with a meaningless "Service Unavailable".
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: gremion
          POSTGRES_PASSWORD: gremion_test
          POSTGRES_DB: gremion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gremion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: test-secret-for-ci-32-chars-minimum
      AUTH_KEYCLOAK_ID: gremion-ui
      AUTH_KEYCLOAK_SECRET: test-secret
      AUTH_KEYCLOAK_ISSUER: http://localhost/realms/gremion
      CALDAV_URL: http://localhost/remote.php/dav
      DATABASE_URL: postgres://gremion:gremion_test@localhost:5432/gremion
      # ── Multi-tenant control plane (#285 / G-099) ──────────────────────────
      # CONTROL_DATABASE_URL / TENANT_DATA_ROOT / GREMION_DISABLE_SEEDS /
      # KEYCLOAK_ADMIN_CLIENT_SECRET are set at STEP level on the two steps that
      # need them (the `pnpm migrate:test-fixture` seed step + the `pnpm preview`
      # boot), not here at job level: a job-level CONTROL_DATABASE_URL would
      # cache a control connection in anything else this job runs.
      # Tell playwright.config.ts to stamp x-forwarded-host on every smoke request
      # (see the "Run Playwright smoke suite" step). TASK-042: the kernel boots
      # with ZERO tenants; the seed step creates the harness fixture tenant
      # (createTestTenant, slug `fixture`) whose PRIMARY tenant_domain host is
      # this one, so the resolver (TASK-041: the WHOLE host) selects it.
      SMOKE_TENANT_HOST: fixture.test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gremion-ui
        run: pnpm build
        working-directory: gremion-ui

      # #285 / G-099: stand up the control plane the resolver needs. Mirrors the
      # integration:vitest part and its local twin
      # scripts/verify/suites/integration.mjs: create the `control` DB and the
      # gremion_public_reader role migration 058 requires, then
      # `pnpm migrate:test-fixture` (control migrations -> createTestTenant
      # `fixture` with its primary host fixture.test -> fleet-migrate its data
      # plane inside runWithTenant). TASK-042: boot and `pnpm migrate` register
      # NO tenant, so without this step every smoke request 404s. After it the
      # resolver builds an ACTIVE TenantContext for SMOKE_TENANT_HOST, so the
      # smoke `/` and `/finance` requests resolve a tenant.
      # Runs AFTER `pnpm build` because prebuild generates the migration manifests
      # (build-migration-manifest.mjs) that runMigrations() G-012-verifies.
      - name: Create control database
        run: |
          psql "postgres://gremion:gremion_test@localhost:5432/postgres" -c 'CREATE DATABASE control'
          psql "postgres://gremion:gremion_test@localhost:5432/gremion" \
            -c "CREATE ROLE gremion_public_reader LOGIN PASSWORD '$(openssl rand -hex 16)'"

      - name: Seed control plane + fixture tenant (G-099 resolver dependency)
        run: pnpm migrate:test-fixture
        working-directory: gremion-ui
        env:
          CONTROL_DATABASE_URL: postgres://gremion:gremion_test@localhost:5432/control
          TENANT_DATA_ROOT: ${{ github.workspace }}/gremion-ui/tests/integration/fixtures/tenant-data
          GREMION_DISABLE_SEEDS: 'true'
          KEYCLOAK_ADMIN_CLIENT_SECRET: test-kc-admin-secret

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: gremion-ui

      # G-099: previously this step ran `playwright test --list`, which only
      # parses spec files and exits without ever starting the SvelteKit
      # server. A completely broken build (server crashes on boot, root
      # page throws, login page blanks) shipped green. The replacement
      # boots `pnpm preview`, waits for it to accept connections, then
      # runs the `@smoke`-tagged subset of the e2e suite. Job duration
      # going from ~3 s to ~30 s+ is the visible signal that the gate
      # is actually executing.
      - name: Start app for smoke tests
        working-directory: gremion-ui
        run: |
          nohup pnpm preview --port 4173 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          # Wait up to 60 s for the server to ACCEPT a connection and emit ANY
          # HTTP status line. #285 / G-099: the bare apex now 404s by design —
          # the multi-tenant resolver (resolve.ts, sequence element 0) returns
          # 404 for a request with no x-forwarded-host tenant subdomain. That is
          # CORRECT behaviour, not a broken build, so the readiness probe must
          # NOT require 2xx/3xx. We drop curl's -f (which would treat the 404 as
          # failure and loop until the 60 s timeout) and instead require only a
          # non-empty HTTP status code — i.e. the server bound the port and the
          # request pipeline produced a response. A server that crashes on boot
          # or never binds yields an empty body (connection refused) and the loop
          # keeps the original G-099 intent of failing on a server that never
          # comes up. The actual 2xx/3xx route assertions move to the @smoke
          # suite below, which sends x-forwarded-host so routes resolve a tenant.
          timeout 60 bash -c 'until [ -n "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4173/ 2>/dev/null)" ] && [ "000" != "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4173/ 2>/dev/null)" ]; do sleep 1; done'
        env:
          # `pnpm preview` boots the app, which runs runMigrations() + serves the
          # resolver — so the boot needs the same control-plane env as the migrate
          # step (set here, not job-level, to keep other steps clean).
          # TENANT_DATA_ROOT holds the fixture tenant's /<slug>/config.json.
          CONTROL_DATABASE_URL: postgres://gremion:gremion_test@localhost:5432/control
          TENANT_DATA_ROOT: ${{ github.workspace }}/gremion-ui/tests/integration/fixtures/tenant-data
          GREMION_DISABLE_SEEDS: 'true'
          KEYCLOAK_ADMIN_CLIENT_SECRET: test-kc-admin-secret

      - name: Run Playwright smoke suite
        run: pnpm exec playwright test --grep '@smoke'
        working-directory: gremion-ui
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          # #285 / G-099: playwright.config.ts reads SMOKE_TENANT_HOST and stamps
          # it as x-forwarded-host on every request, so the resolver selects the
          # seeded `fixture` tenant for `/` and `/finance` (302 -> /auth/login).
          SMOKE_TENANT_HOST: ${{ env.SMOKE_TENANT_HOST }}

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then
            kill "$(cat /tmp/preview.pid)" 2>/dev/null || true
          fi
          echo "=== preview.log (last 100 lines) ==="
          tail -100 /tmp/preview.log || true

      - name: Upload Playwright report
        if: failure()
        # Pin matches mobile.yml's existing actions/upload-artifact pin so
        # both workflows stay on the same audited release.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: gremion-ui/playwright-report/
          retention-days: 7

      # gremion-public. Its type check and unit tests are verify's (typecheck's
      # svelte-check, unit:public); what no gate did was build the image and RUN
      # it. dependabot.yml pinned the /gremion-public node major until a CI job
      # booted the built image and hit it -- the schema-rename staleness bug fixed
      # in PR #88 passed check, tests and build and was caught only because a
      # rebuild flushed a cached layer. This is that job, so the pin is lifted.
      - name: Build gremion-public
        run: pnpm build
        working-directory: gremion-public

      - name: Build the gremion-public image
        run: docker build -f gremion-public/Dockerfile -t gremion-ci/gremion-public:smoke .

      # Post-conditions, not the exit code: `docker run -d` exits 0 for a container
      # that dies a second later. The route is ${BASE_PATH}/healthz and the image
      # is built with BASE_PATH empty (Dockerfile ARG), so /healthz; the handler
      # touches no database (the probe must stay green while Postgres is away), but
      # the container is started against the job's Postgres anyway so the boot is
      # the one a deployment makes. A 200 alone would also be answered by an error
      # page that happens to say 200, so the body is compared byte for byte too,
      # and the container must still be running after the probe.
      - name: Boot the gremion-public image and probe its health endpoint
        env:
          GREMION_PUBLIC_DB_URL: postgresql://gremion:gremion_test@127.0.0.1:5432/gremion
        run: |
          set -euo pipefail
          docker run -d --name gremion-public-smoke --network host \
            -e PORT=3100 -e ORIGIN=http://127.0.0.1:3100 -e GREMION_PUBLIC_DB_URL \
            gremion-ci/gremion-public:smoke
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /tmp/gremion-public-healthz.body -w '%{http_code}' http://127.0.0.1:3100/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::GET /healthz answered HTTP $code, not 200"
            exit 1
          fi
          body=$(cat /tmp/gremion-public-healthz.body)
          want='{"ok":true,"app":"gremion-public"}'
          if [ "$body" != "$want" ]; then
            echo "::error::GET /healthz body is not the portal's liveness marker: $body"
            exit 1
          fi
          running=$(docker inspect -f '{{.State.Running}}' gremion-public-smoke)
          if [ "$running" != "true" ]; then
            echo "::error::the gremion-public container is not running after the probe"
            exit 1
          fi
          echo "OK -- /healthz answered 200 with the liveness marker from the built image."

      - name: gremion-public container logs
        if: failure()
        run: docker logs gremion-public-smoke || true

      - name: Remove the gremion-public container
        if: always()
        run: docker rm -f gremion-public-smoke || true

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: Verify gate. The one place the legs above become a verdict.
  #
  # Waits for every verify-* leg, merges their records into the record a single
  # `make verify` would have written (combine-records.mjs: one `--only` record
  # per leg, all for THIS commit, no suite twice) and hands it to the SAME
  # check-record.mjs that scripts/release/sign-release.sh trusts. The merge
  # block is therefore not a second implementation of "is this green": it is the
  # local gate's judge, fed by parallel legs.
  # ──────────────────────────────────────────────────────────────────────────
  verify-gate:
    name: Verify gate
    runs-on: ubuntu-latest
    needs:
      - verify-static
      - verify-render-ops
      - verify-unit-ui
      - verify-unit-packages
      - verify-unit-host
      - verify-integration-db
      - verify-integration-brokers
      - verify-census
    # A skipped or failed leg must make this job RUN and fail, not be skipped with
    # it: a skipped required check reads as passing in a branch ruleset.
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # node only: combine-records.mjs and check-record.mjs import nothing but
      # node: built-ins and scripts/verify itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26

      - name: Every verify leg must have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Vacuity floor: a gate that iterates an empty `needs` passes anything.
          total=$(jq 'length' <<<"$NEEDS_JSON")
          if [ "$total" -lt 8 ]; then
            echo "::error::verify-gate waits for only $total job(s); expected the eight verify legs"
            exit 1
          fi
          rows=$(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS_JSON")
          bad=0
          while IFS=$'\t' read -r job result; do
            if [ "$result" = "success" ]; then
              echo "  ok      $job"
            elif [ "$job" = "verify-census" ] && [ "$result" = "skipped" ] && [ "$EVENT_NAME" = "pull_request" ]; then
              # Skipped only when the `changes` job found no census input in the
              # diff (and lint passed). The record check below then allows exactly
              # this one absence, and only on a pull request.
              echo "  skipped $job (pull request; no census input changed)"
            else
              echo "::error::$job finished $result"
              bad=1
            fi
          done <<<"$rows"
          exit "$bad"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: record-*
          merge-multiple: false
          path: ${{ runner.temp }}/verify-records

      - name: Combine the legs' records
        env:
          SHA: ${{ github.sha }}
        run: node scripts/verify/combine-records.mjs --in-dir "$RUNNER_TEMP/verify-records" --sha "$SHA"

      # The pull-request branch is keyed on BOTH the event and the census result:
      # a push or a manual run must never be allowed to miss a suite, and a pull
      # request whose census RAN is judged exactly like a push. --allow-missing
      # permits an absence and nothing else: a census record that is present must
      # still pass, and every other required suite must be there.
      - name: Check the combined record
        if: ${{ github.event_name != 'pull_request' || needs.verify-census.result == 'success' }}
        env:
          SHA: ${{ github.sha }}
        run: node scripts/verify/check-record.mjs "$SHA"

      - name: Check the combined record (pull request, census not required)
        if: ${{ github.event_name == 'pull_request' && needs.verify-census.result == 'skipped' }}
        env:
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CENSUS_RESULT: ${{ needs.verify-census.result }}
        run: |
          set -euo pipefail
          # The `if:` above is what selects this step; this re-asserts it from the
          # environment so a copy of the step pasted into a push path fails closed.
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$CENSUS_RESULT" != "skipped" ]; then
            echo "::error::--allow-missing is only for a pull request whose census was skipped (event $EVENT_NAME, census $CENSUS_RESULT)"
            exit 1
          fi
          node scripts/verify/check-record.mjs "$SHA" --allow-missing census
