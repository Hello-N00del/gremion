name: Control panel

# CI coverage for the operator control panel (apps/control-panel) and the
# provisioning package it submits create requests to (packages/provisioning).
# Before this workflow neither vitest suite had a runner: ci.yml installs only
# BATS, and gremion-ui.yml's include globs do not reach either directory. The
# create-harden drift tests (the panel mirrors provisioning's printable-text
# rule and reserved slugs because the panel image depends on no workspace
# package) only protect anything if they run, so they run here.
on:
  # `push` is main-only so feature-branch commits do NOT double-fire alongside
  # `pull_request` (mirrors gremion-ui.yml / ports.yml).
  push:
    branches: [main]
    paths:
      - 'apps/control-panel/**'
      - 'packages/provisioning/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/control-panel.yml'
  pull_request:
    paths:
      - 'apps/control-panel/**'
      - 'packages/provisioning/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/control-panel.yml'
  workflow_dispatch:

# Least-privilege token: pure consumer (check + test).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Control panel + provisioning unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provisioning typecheck
        working-directory: packages/provisioning
        run: pnpm run typecheck

      - name: Provisioning unit tests
        working-directory: packages/provisioning
        run: pnpm run test

      # `check` runs svelte-kit sync first, which writes the gitignored
      # .svelte-kit/tsconfig.json the vitest run also needs on a clean clone.
      - name: Control panel svelte-check
        working-directory: apps/control-panel
        run: pnpm run check

      - name: Control panel unit tests
        working-directory: apps/control-panel
        run: pnpm run test
