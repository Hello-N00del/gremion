name: Gremion Public

on:
  # `push` is main-only so feature-branch commits do NOT double-fire
  # alongside `pull_request` (mirrors gremion-ui.yml). Before this constraint
  # every PR commit produced two identical runs, one per trigger.
  push:
    branches: [main]
    paths:
      - 'gremion-public/**'
      # The public portal imports the shared @gremion/db wrapper, and
      # workspace/lockfile changes affect every resolved dependency — so a
      # change to any of these must trigger this pipeline too.
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/gremion-public.yml'
  pull_request:
    paths:
      - 'gremion-public/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  # On-demand run against any ref.
  workflow_dispatch:

# Least-privilege token: read-only on the repo. The check/test/build job is a
# pure consumer — no release uploads, no PR comment automation.
permissions:
  contents: read

# Cancel superseded runs on PR branches; let main pushes complete in full
# so every merged commit has a green pipeline of record. `github.ref` is the
# branch ref on push events and `refs/pull/<n>/merge` on PRs, so identity
# grouping per-ref naturally separates each PR's run history from main's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gremion-public
    # The gremion-public vitest suite mocks `postgres` + `$env/dynamic/private`
    # (see src/**/*.test.ts), so — unlike gremion-ui — it needs NO Postgres
    # service. The Playwright e2e suite lives under tests/e2e/ and is excluded
    # by the vite.config.ts test include glob (src/**/*.test.ts), so `pnpm test`
    # runs the pure-unit vitest set here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # TASK-017: gremion-public/Dockerfile now builds and runs on
          # node:26-alpine (was 22), and the root package.json engines.node
          # floor moved to ">=26 <27" with engineStrict on — so 26 here is
          # what actually ships, not merely what .node-version names to
          # develop against. dependabot.yml's node-major ignore rule for
          # /gremion-public moved with it (pinned major 22 -> 26).
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
