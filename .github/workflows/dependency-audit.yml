name: Dependency audit

# Compensating control for the retired root npm Dependabot entry (see the
# RETIRED note in .github/dependabot.yml). Dependabot's npm updater runs Node
# 24 only and this repo requires Node 26 (TASK-017, D R19-D34), so neither
# npm version updates nor npm security-update PRs can open. This workflow
# audits the production dependency tree on Node 26 every week instead.
#
# - `pnpm audit --prod` gates: any high or critical advisory fails the
#   `audit` job (red run), and the `report` job opens one tracking issue, or
#   comments on the open one, so the failure does not depend on someone
#   reading the Actions tab.
# - `pnpm outdated` is information only. It goes to the job summary and never
#   changes the result.
# - A registry or parse error is a failure too, never a silent pass: the
#   gate counts advisories from the JSON report and refuses a report it
#   cannot read.
#
# Not part of ci.yml's verify legs on purpose: it gates nothing in a pull
# request. scripts/check-ci-verify-coverage.mjs reads ci.yml only.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    name: pnpm audit (production, Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      high: ${{ steps.gate.outputs.high }}
      critical: ${{ steps.gate.outputs.critical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26

      # pnpm audit reads pnpm-lock.yaml; no install is needed, so a broken
      # install cannot mask the audit result.
      - name: Audit production dependencies
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          pnpm audit --prod --json > audit.json || rc=$?
          node - audit.json "$rc" <<'EOF'
          const fs = require('node:fs')
          const [file, rc] = process.argv.slice(2)
          let report
          try {
            report = JSON.parse(fs.readFileSync(file, 'utf8'))
          } catch (e) {
            console.log(`::error::pnpm audit (exit ${rc}) produced no readable JSON report: ${e.message}`)
            process.exit(2)
          }
          const counts = report?.metadata?.vulnerabilities
          if (!counts || typeof counts.high !== 'number' || typeof counts.critical !== 'number') {
            console.log(`::error::pnpm audit (exit ${rc}) report has no metadata.vulnerabilities counts`)
            process.exit(2)
          }
          const bad = Object.values(report.advisories ?? {}).filter((a) => a.severity === 'high' || a.severity === 'critical')
          const lines = bad.map((a) => `| ${a.severity} | \`${a.module_name}\` | \`${a.vulnerable_versions}\` | \`${a.patched_versions}\` | [${a.github_advisory_id}](${a.url}) |`)
          const summary = [
            '## pnpm audit --prod',
            '',
            `critical ${counts.critical}, high ${counts.high}, moderate ${counts.moderate ?? 0}, low ${counts.low ?? 0}`,
            '',
            ...(lines.length ? ['| Severity | Package | Vulnerable | Patched | Advisory |', '|---|---|---|---|---|', ...lines] : ['No high or critical advisory.']),
            '',
          ].join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          fs.writeFileSync('audit-summary.md', summary)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `high=${counts.high}\ncritical=${counts.critical}\n`)
          if (counts.high + counts.critical > 0) {
            console.log(`::error::${counts.critical} critical and ${counts.high} high advisories in production dependencies`)
            process.exit(1)
          }
          EOF

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: audit-report
          path: |
            audit.json
            audit-summary.md
          if-no-files-found: ignore
          retention-days: 30

      # Information only: needs an install to resolve the workspace, and its
      # outcome never changes the job result (the gate above already ran).
      - name: Outdated dependencies (information only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          pnpm install --frozen-lockfile > /dev/null
          {
            echo '## pnpm outdated -r (information only)'
            echo
            echo '```'
            pnpm outdated -r --no-table 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Open or update the tracking issue
    needs: audit
    if: ${{ failure() && needs.audit.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the audit issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HIGH: ${{ needs.audit.outputs.high }}
          CRITICAL: ${{ needs.audit.outputs.critical }}
        run: |
          set -euo pipefail
          title='Dependency audit: high or critical advisories in production dependencies'
          if [ -n "$HIGH$CRITICAL" ]; then
            body="The weekly \`pnpm audit --prod\` found ${CRITICAL} critical and ${HIGH} high advisories. Package table and JSON report: ${RUN_URL}"
          else
            body="The weekly \`pnpm audit --prod\` could not produce a readable report (registry or parse error). Nothing was verified. Run: ${RUN_URL}"
          fi
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --label dependencies --body "$body

          Created by .github/workflows/dependency-audit.yml, the compensating control for the retired root npm Dependabot entry. Close this issue once the advisories are fixed; the next red run opens a new one."
          fi
