---
# Dependabot configuration — closes G-043 (in-repo supply-chain visibility).
#
# Working in tandem with the SHA-pin programme from G-040: the github-actions
# ecosystem below opens a weekly PR whenever an Action's pinned SHA rots, so
# the pins stay fresh without manual re-bumping. Without this config the G-040
# pins are reproducible but stagnant — security patches in upstream Actions
# never land.
#
# Current limits: github-actions 5, docker 5 (both blocks). Nothing is
# paused. There is no npm entry; see the RETIRED note under updates. Schedule cadence is weekly across the board to avoid PR-bombing
# reviewers; development-only dependencies are grouped into one PR per
# ecosystem, while runtime dependencies still get individual PRs so their
# changelogs can be evaluated case by case.
#
# Two entries are shaped by the open-core carve rather than by preference:
# the multi-Dockerfile `directories:` list names only the paths that survive
# the carve, and the `/gremion-ui` npm ecosystem is deliberately absent —
# pnpm in workspace mode only ever updates the ROOT lockfile, so a per-app npm
# entry produced nothing but workspace-duplicate PRs.
#
# PAUSING AN ECOSYSTEM: set `open-pull-requests-limit: 0` with an inline
# `# PAUSED — restore to N` comment. That comment is not decoration —
# .github/workflows/dependabot-unpause.yml parses N back out of it to restore
# the limit. A pause without the hint cannot be undone by that workflow.
#
# Every label referenced below must be declared in .github/labels.yml. GitHub
# does NOT create a missing label; it silently drops it, so a PR lands
# unlabelled and any filter keyed on that label quietly matches nothing.
# kernel-hygiene check f6 enforces the pairing.

version: 2
updates:
  # GitHub Actions — keep the G-040 SHA pins fresh. Security patches to
  # upstream Actions ride in via these bumps; without them the pins are
  # reproducible but stagnant. Volume is low (typically 1–3 actions/version
  # per week) and a bump PR only runs the workflows whose `paths:` filter
  # matches its own YAML edit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

  # RETIRED (2026-10-29): the root npm entry. Dependabot's npm updater runs
  # Node v24.22.1 only and has no option to pick another version. This repo
  # requires Node 26 everywhere (TASK-017, D R19-D34: engines.node ">=26 <27",
  # engineStrict in pnpm-workspace.yaml, enforced by scripts/check-toolchain.mjs),
  # so every npm update job ended in tool_version_not_supported and opened no
  # PRs (runs 40953188266, 40957003855). Operator decision: keep Node 26 and
  # retire the job rather than widen engines.node. npm/pnpm bumps are done by
  # hand, batched; `pnpm outdated -r` and `pnpm audit` list what is due.
  # Restore the entry (weekly, limit 10, labels [dependencies, root], the
  # dev-dependencies patch/minor group, and the typescript semver-major ignore
  # from #55 until a TS 7 migration is planned) once the updater supports
  # Node 26: the job log line "supported-versions" names what it runs.

  # Docker images — every Dockerfile in docker/, modules/ and the gremion-ui
  # one, plus both bats runners.
  # `directories:` (plural) with explicit paths is more reliable than a glob
  # for Dependabot v2; the alternative `directory: /` only finds /Dockerfile.
  # The list names exactly the Dockerfile directories this repository has — a
  # path that does not exist is not an error Dependabot reports, it is simply
  # an ecosystem that never opens a PR.
  #
  # /gremion-public is split into its own entry below so it can carry a
  # node-major ignore rule without affecting the other Dockerfiles' cadence.
  - package-ecosystem: docker
    directories:
      - /docker/fallback
      - /docker/legal
      - /docker/vector
      - /gremion-ui
      # TASK-043 G11: the ops control panel image (gremion-control-panel).
      - /apps/control-panel
      # TASK-077 G7: the kernel API image (gremion-kernel-api).
      - /services/kernel-api
      # The local bats runner image (test/host/runner). Not shipped, but it
      # pins a base image like any other; scripts/release/
      # check-dependabot-dockerfiles.mjs fails on a tracked Dockerfile whose
      # directory no docker entry names (TASK-046).
      - /test/host/runner
      # The nine module images (TASK-200) and the bats runner that
      # test/*.bats runs in (TASK-045): a tracked Dockerfile that no entry
      # names never opens a base-image PR (R29-MD-C-K).
      - /modules/board
      - /modules/calendar
      - /modules/content
      - /modules/files
      - /modules/finance
      - /modules/messaging
      # TASK-198: the chat module's Synapse image (gremion-synapse; the
      # upstream FROM is digest-pinned, TRD-350/425).
      - /modules/messaging/synapse
      - /modules/publishing
      - /modules/vault
      - /modules/votes
      - /scripts/verify/bats-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, docker]

  # /gremion-public — split out from the multi-Dockerfile entry above, when it
  # carried its own ignore rule, and kept as its own entry since. Node-major
  # bumps to the /gremion-public base image used to be PINNED at the then-current
  # major (node:26-alpine as of TASK-017, was node:22-alpine) because they need a
  # full rebuild plus a boot smoke before merge: the schema-rename staleness bug
  # fixed in PR #88 was caught only because a rebuild forced the cached
  # pre-rename DDL to flush.
  #
  # The pin is lifted: ci.yml's e2e-smoke job now builds this Dockerfile, boots the
  # image and asserts GET /healthz answers 200 with the portal's liveness marker
  # (status code and body, container still running), so a node-major bump pull
  # request is gated by exactly the boot that check, unit tests and build never
  # did. If that step is ever removed, restore the ignore:
  #   ignore:
  #     - dependency-name: "node"
  #       update-types: ["version-update:semver-major"]
  # See: [[wiki/concepts/build-dockerfile-image-staleness-after-schema-rename]]
  - package-ecosystem: docker
    directory: /gremion-public
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
