---
name: Bug report
description: Something in the kernel behaves differently from what it documents.
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        **Not for security problems.** Use private vulnerability reporting
        instead — see the link on the previous screen, or SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The commands you ran, in order. If it involves the stack, say which
        overlay or compose file, and whether `scripts/setup.sh` had been run.
      placeholder: |
        1. pnpm install
        2. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        Logs, the failing assertion, `docker compose ps` output — whatever
        shows the behaviour rather than describing it. Redact secrets.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The kernel version from package.json, or the commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, pnpm version, Docker version if relevant.
