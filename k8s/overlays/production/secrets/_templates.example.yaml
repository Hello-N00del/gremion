# Per-Secret production templates.
#
# G-028 closure: this file is the canonical reference for what each
# production overlay Secret must contain. Operators DO NOT encrypt this file
# directly — instead, copy the relevant document below into a sibling file
# named `<secret-name>.yaml`, fill in every <PLACEHOLDER>, and run:
#
#   bash ./encrypt-all.sh
#
# That writes `<secret-name>.enc.yaml` and removes the plaintext.
# Commit only the .enc.yaml file.
#
# Password generation (recommended):
#   openssl rand -base64 32          # for opaque passwords
#   openssl rand -hex 16             # for IPCRYPT_KEY (AES-128, 32 hex chars)
#   openssl rand -hex 32             # for BACKUP_ENCRYPTION_KEY (AES-256)
#
# Reference: k8s/overlays/production/secrets/README.md — per-Secret table.
# Bootstrap: k8s/overlays/production/secrets/bootstrap-sops.sh.

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: "<POSTGRES_SUPERUSER>"
  POSTGRES_PASSWORD: "<POSTGRES_SUPERUSER_PASSWORD>"
  NEXTCLOUD_DB_USER: "<NEXTCLOUD_DB_USER>"
  NEXTCLOUD_DB_PASSWORD: "<NEXTCLOUD_DB_PASSWORD>"
  NEXTCLOUD_DB_NAME: "nextcloud"
  KEYCLOAK_DB_USER: "<KEYCLOAK_DB_USER>"
  KEYCLOAK_DB_PASSWORD: "<KEYCLOAK_DB_PASSWORD>"
  KEYCLOAK_DB_NAME: "keycloak"
  # P2.1c T1 (#202): control-plane registry DB, consumed by the
  # init-databases.sh twin in k8s/base/postgres/configmap.yaml.
  CONTROL_DB_USER: "control"
  CONTROL_DB_PASSWORD: "<CONTROL_DB_PASSWORD>"
  CONTROL_DB_NAME: "control"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
type: Opaque
stringData:
  REDIS_PASSWORD: "<REDIS_PASSWORD>"

---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<NEXTCLOUD_DB_PASSWORD>"
  NEXTCLOUD_ADMIN_USER: "<NEXTCLOUD_ADMIN_USER>"
  NEXTCLOUD_ADMIN_PASSWORD: "<NEXTCLOUD_ADMIN_PASSWORD>"
  REDIS_HOST_PASSWORD: "<REDIS_PASSWORD>"
  NEXTCLOUD_OIDC_CLIENT_SECRET: "<NEXTCLOUD_OIDC_CLIENT_SECRET>"
  SMTP_PASSWORD: "<SMTP_PASSWORD>"

---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: "<KEYCLOAK_BOOTSTRAP_ADMIN_USER>"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "<KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD>"
  KC_DB_USERNAME: "<KEYCLOAK_DB_USER>"
  KC_DB_PASSWORD: "<KEYCLOAK_DB_PASSWORD>"
  # C10 / gremion#22: the `substitute-realm-secrets` initContainer
  # (k8s/base/keycloak/deployment.yaml) sources this Secret via envFrom and
  # FAILS to start unless BOTH of these are set — they replace the
  # __GREMION_UI_OIDC_CLIENT_SECRET__ / __GREMION_ADMIN_OIDC_CLIENT_SECRET__
  # sentinels in docker/keycloak/realm-export.json. The kernel realm has no
  # Nextcloud client, so the former NEXTCLOUD_OIDC_CLIENT_SECRET key was
  # module residue and is intentionally dropped.
  GREMION_UI_OIDC_CLIENT_SECRET: "<GREMION_UI_OIDC_CLIENT_SECRET>"
  GREMION_ADMIN_OIDC_CLIENT_SECRET: "<GREMION_ADMIN_OIDC_CLIENT_SECRET>"

---
apiVersion: v1
kind: Secret
metadata:
  name: gremion-ui-secret
type: Opaque
stringData:
  AUTH_SECRET: "<GREMION_UI_AUTH_SECRET>"
  AUTH_KEYCLOAK_SECRET: "<GREMION_UI_KEYCLOAK_CLIENT_SECRET>"
  KEYCLOAK_ADMIN_CLIENT_SECRET: "<KEYCLOAK_ADMIN_CLIENT_SECRET>"
  # P2.1c T1 (#202): overrides the placeholder in gremion-ui-config (the
  # deployment lists this secretRef AFTER the configMapRef, so this wins).
  # D-CONTROLDIRECT: direct postgres:5432, never via a connection pooler.
  CONTROL_DATABASE_URL: "postgresql://control:<CONTROL_DB_PASSWORD>@postgres:5432/control"
  # P2.1c T5 (#202) executable proxy-trust — the app side of the gate
  # (resolve.ts isProxyTrusted reads this env). MUST be byte-equal to the
  # value the production overlay patches into the `gremion-ui-proxytrust`
  # Traefik Middleware header (patches/ingressroutes-prod.yaml) — the edge
  # injects `x-proxy-trust: <this>` and the resolver constant-time-compares.
  # Generate with `openssl rand -base64 32`. Setting this env ACTIVATES the
  # gate (unset = no-op, byte-identical default); set it together with the
  # middleware patch at deploy.
  TENANT_PROXY_SHARED_SECRET: "<TENANT_PROXY_SHARED_SECRET>"

---
apiVersion: v1
kind: Secret
metadata:
  name: synapse-secret
type: Opaque
stringData:
  SYNAPSE_SERVER_NAME: "<SYNAPSE_SERVER_NAME>"
  SYNAPSE_REPORT_STATS: "no"
  POSTGRES_PASSWORD: "<SYNAPSE_DB_PASSWORD>"
  MACAROON_SECRET_KEY: "<SYNAPSE_MACAROON_SECRET>"
  REGISTRATION_SHARED_SECRET: "<SYNAPSE_REGISTRATION_SHARED_SECRET>"
  FORM_SECRET: "<SYNAPSE_FORM_SECRET>"

---
apiVersion: v1
kind: Secret
metadata:
  name: helios-secret
type: Opaque
stringData:
  SECRET_KEY: "<HELIOS_DJANGO_SECRET_KEY>"
  DATABASE_URL: "postgres://helios:<HELIOS_DB_PASSWORD>@postgres:5432/helios"
  EMAIL_HOST_PASSWORD: "<SMTP_PASSWORD>"
  HELIOS_ADMIN_PASSWORD: "<HELIOS_ADMIN_PASSWORD>"

---
# Production overlay's S3-encrypted backup CronJob (NOT the base restic flow).
# Base restic-secret carries only RESTIC_PASSWORD; this Secret is different.
apiVersion: v1
kind: Secret
metadata:
  name: backup-secret
type: Opaque
stringData:
  BACKUP_ENCRYPTION_KEY: "<BACKUP_ENCRYPTION_KEY_64_HEX>"
  BACKUP_S3_BUCKET: "<S3_BUCKET_NAME>"
  BACKUP_S3_PREFIX: "backups"
  AWS_ACCESS_KEY_ID: "<AWS_ACCESS_KEY_ID>"
  AWS_SECRET_ACCESS_KEY: "<AWS_SECRET_ACCESS_KEY>"

---
# G-029 — Vector log-pipeline IP pseudonymisation key.
# Base manifest reference: vector-ipcrypt-secret (NOT vector-secret).
apiVersion: v1
kind: Secret
metadata:
  name: vector-ipcrypt-secret
type: Opaque
stringData:
  IPCRYPT_KEY: "<IPCRYPT_KEY_32_HEX>"

---
# G-030 — base restic backup repository passphrase (dev+overlay; the prod
# overlay actually uses backup-secret above for its S3 flow, but the base
# manifest is still loaded by every overlay).
apiVersion: v1
kind: Secret
metadata:
  name: restic-secret
type: Opaque
stringData:
  RESTIC_PASSWORD: "<RESTIC_REPO_PASSWORD>"

---
# G-031 — gremion-public read-only DB user.
apiVersion: v1
kind: Secret
metadata:
  name: gremion-public-secret
  labels:
    app: gremion-public
type: Opaque
stringData:
  GREMION_PUBLIC_DB_URL: "postgres://gremion_public:<GREMION_PUBLIC_DB_PASSWORD>@postgres:5432/gremion?sslmode=require"

---
# Legal-page service environment (origin: legal/legal.env.example).
apiVersion: v1
kind: Secret
metadata:
  name: legal-config
type: Opaque
stringData:
  # Operators: paste every KEY=VALUE pair from legal/legal.env.example here,
  # converting `KEY=value` lines into `KEY: "<value>"` YAML entries. Keys are
  # service-specific; check legal/legal.env.example for the current set.
  PLACEHOLDER: "<see legal/legal.env.example>"
