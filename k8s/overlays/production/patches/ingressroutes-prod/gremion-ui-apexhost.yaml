# Production overlay: gremion-ui apex-host injection (D-APEX twin) — the
# Middleware value MUST be patched in step with the app host (parity:
# compose default.${DOMAIN}). See gremion-ui-https.yaml for the
# __GREMION_DOMAIN__ sentinel substitution recipe.
- op: replace
  path: /spec/headers/customRequestHeaders/X-Forwarded-Host
  value: default.__GREMION_DOMAIN__
