# NOTE: patches the legacy nginx-ingress example in k8s/base/ingress.yaml,
# which is NOT wired into k8s/base/kustomization.yaml's resources (the live
# routing uses the Traefik IngressRoutes — see patches/ingressroutes-prod.yaml,
# which IS active in this overlay's `patches:` list). This file is kept as a
# reference for operators who wire nginx-ingress in instead of Traefik; it is
# intentionally NOT referenced from kustomization.yaml, since its target
# resource does not exist in the accumulated output.
#
# Production ingress patch — set your real domain here.
# Replace "stura.example.com" with your actual domain before deploying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gremion-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - stura.example.com   # TODO: replace with your domain
      secretName: gremion-tls
  rules:
    - host: stura.example.com  # TODO: replace with your domain
      http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
