##############################################################
# Production overlay — the apex host this deployment serves.
#
# Must match the host substituted into the Traefik routes
# (patches/ingressroutes-prod/*.yaml), so this file is part of the same one-time
# `sed` recipe — see the header of patches/ingressroutes-prod/gremion-ui-https.yaml.
# B-01: no realm is imported at boot; a tenant realm's redirect URIs, web
# origins and CSP frame-ancestors are built from this apex at tenant-create time.
#
# Leaving the sentinel unsubstituted does NOT fail `kubectl apply`: tenant-create
# then writes redirect URIs for a host nobody resolves and every OIDC login is
# refused. The `Domain-sentinel guard` CI step and the `j1` check in
# scripts/kernel-hygiene-check.mjs are what actually reject it.
##############################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  DOMAIN: __GREMION_DOMAIN__
