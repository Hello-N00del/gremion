##############################################################
# Dev overlay — the apex host this deployment serves.
#
# Must match the host this overlay patches into the Traefik routes
# (patches/ingressroutes-dev/*.yaml → stura.localhost). B-01: no realm is
# imported at boot; a tenant realm's redirect URIs are built from the apex at
# tenant-create time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  DOMAIN: stura.localhost
