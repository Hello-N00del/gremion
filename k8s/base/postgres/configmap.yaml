apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  labels:
    app: postgres
data:
  init-databases.sh: |
    #!/bin/sh
    # Idempotent — safe to run on every pod start.
    # Creates the Keycloak, governance kernel (gremion), control-plane and
    # public-reader roles/databases if they do not exist.
    #
    # POSIX sh, NOT bash: statefulset.yaml starts this with
    # `command: ["/bin/sh", "/scripts/init-databases.sh"]`, and /bin/sh in
    # postgres:*-alpine is busybox ash. It rejects `-o pipefail` outright —
    # measured inside postgres:18-alpine on 2026-09-17:
    #   /tmp/k8s-init.sh: set: line 5: illegal option -o pipefail
    # so the whole init container failed on its FIRST line of setup and created
    # nothing at all. `set -eu` is what both this file and its Docker twin need;
    # there is not a single pipe in either.
    set -eu

    create_db_and_user() {
      local db="$1" user="$2" password="$3"
      # Use psql -v variable substitution with format() %I/%L to prevent SQL injection.
      # Single-quoted heredoc stops shell from expanding psql variables.
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" \
           -v _user="$user" -v _password="$password" -v _db="$db" <<-'SQL'
        SELECT CASE
          WHEN NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'_user')
          THEN format('CREATE USER %I WITH PASSWORD %L', :'_user', :'_password')
          ELSE 'SELECT 1'
        END \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'_db', :'_user')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'_db') \gexec
        SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'_db', :'_user') \gexec
    SQL
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$db" \
           -v _user="$user" <<-'SQL'
        SELECT format('GRANT ALL ON SCHEMA public TO %I', :'_user') \gexec
    SQL
    }

    create_db_and_user \
      "${KEYCLOAK_DB_NAME:-keycloak}" \
      "${KEYCLOAK_DB_USER:-keycloak}" \
      "${KEYCLOAK_DB_PASSWORD}"

    create_db_and_user \
      "${GREMION_DB_NAME:-gremion}" \
      "${GREMION_DB_USER:-gremion}" \
      "${GREMION_DB_PASSWORD}"

    # P2.1c T1 (#202): control-plane registry database (tenant registry +
    # fleet-migration ledger, gremion-ui/migrations-control/). Mirrors
    # docker/postgres/init-databases.sh — that file's header mandates
    # keeping the two implementations in sync.
    create_db_and_user \
      "${CONTROL_DB_NAME:-control}" \
      "${CONTROL_DB_USER:-control}" \
      "${CONTROL_DB_PASSWORD}"

    # The read-only role the anonymous public portal logs in as. MIRRORS
    # docker/postgres/init-databases.sh -- that file's header mandates keeping
    # the two implementations in sync, and this role is where they had drifted:
    # gremion-ui/migrations/058_public_reader_grants.sql ABORTS the whole
    # data-plane migration chain when the role is missing, and 058's own abort
    # message sends the operator to THIS ConfigMap. Until now it created
    # keycloak, gremion and control and nothing else, so a K8s-provisioned
    # kernel could never finish migrating. Required, not optional: `:?` fires on
    # unset AND on empty, and the value must be the same password the
    # gremion-public secret's GREMION_PUBLIC_DB_URL carries.
    : "${PUBLIC_DB_PASSWORD:?[init-databases] PUBLIC_DB_PASSWORD is unset or empty. The gremion_public_reader role cannot be created without it, and gremion-ui/migrations/058_public_reader_grants.sql aborts the migration chain when that role is missing. Add PUBLIC_DB_PASSWORD to the postgres-secret Secret.}"

    echo "[init-databases] Creating gremion_public_reader role..."
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -v _password="$PUBLIC_DB_PASSWORD" <<-'SQL'
      SELECT CASE
        WHEN NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'gremion_public_reader')
        THEN format('CREATE ROLE gremion_public_reader LOGIN PASSWORD %L', :'_password')
        ELSE format('ALTER ROLE gremion_public_reader WITH PASSWORD %L', :'_password')
      END \gexec
    SQL

    echo "[init-databases] Done."
