apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  labels:
    app: postgres
data:
  init-databases.sh: |
    #!/usr/bin/env bash
    # Idempotent — safe to run on every pod start.
    # Creates the Keycloak, governance kernel (gremion), and control-plane
    # databases if they do not exist.
    set -euo pipefail

    create_db_and_user() {
      local db="$1" user="$2" password="$3"
      # Use psql -v variable substitution with format() %I/%L to prevent SQL injection.
      # Single-quoted heredoc stops shell from expanding psql variables.
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" \
           -v _user="$user" -v _password="$password" -v _db="$db" <<-'SQL'
        SELECT CASE
          WHEN NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'_user')
          THEN format('CREATE USER %I WITH PASSWORD %L', :'_user', :'_password')
          ELSE 'SELECT 1'
        END \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'_db', :'_user')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'_db') \gexec
        SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'_db', :'_user') \gexec
    SQL
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$db" \
           -v _user="$user" <<-'SQL'
        SELECT format('GRANT ALL ON SCHEMA public TO %I', :'_user') \gexec
    SQL
    }

    create_db_and_user \
      "${KEYCLOAK_DB_NAME:-keycloak}" \
      "${KEYCLOAK_DB_USER:-keycloak}" \
      "${KEYCLOAK_DB_PASSWORD}"

    create_db_and_user \
      "${GREMION_DB_NAME:-gremion}" \
      "${GREMION_DB_USER:-gremion}" \
      "${GREMION_DB_PASSWORD}"

    # P2.1c T1 (#202): control-plane registry database (tenant registry +
    # fleet-migration ledger, gremion-ui/migrations-control/). Mirrors
    # docker/postgres/init-databases.sh — that file's header mandates
    # keeping the two implementations in sync.
    create_db_and_user \
      "${CONTROL_DB_NAME:-control}" \
      "${CONTROL_DB_USER:-control}" \
      "${CONTROL_DB_PASSWORD}"

    echo "[init-databases] Done."
