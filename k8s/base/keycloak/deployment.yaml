apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # G-036 (Wave 3b T4.1): pod-level baseline-PSS hardening.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for PostgreSQL to accept connections before Keycloak starts
        - name: wait-for-postgres
          image: postgres:18-alpine
          # G-036: container-level baseline-PSS hardening.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U $(KC_DB_USERNAME); do
                echo "Waiting for PostgreSQL..."; sleep 3;
              done
          envFrom:
            - secretRef:
                name: keycloak-secret

      containers:
        - name: keycloak
          # gremion#22: converge on 26.6.1 — the live compose-tested version
          # (docker-compose.yml). k8s previously pinned the older 26.1; there is
          # no known incompatibility, this was drift from the compose bump.
          image: quay.io/keycloak/keycloak:26.6.1
          # G-036: container-level baseline-PSS hardening.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - start
            - --optimized
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secret
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
