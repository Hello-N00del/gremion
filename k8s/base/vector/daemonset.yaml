##############################################################
# Vector DaemonSet for Gremion log pseudonymisation pipeline
#
# Runs one Vector pod per node that hosts Traefik. Uses the
# custom Vector image (docker/vector/Dockerfile) which bundles
# the ipcrypt-nd binary for IP pseudonymisation.
#
# Image: ghcr.io/hello-n00del/gremion-vector — built from docker/vector/Dockerfile,
# the same Dockerfile docker-compose.yml's `vector` service builds. The TAGS
# differ deliberately: compose builds `:latest` for a local stack, k8s/base
# pins the kernel version so a rollback is reproducible. Nothing publishes
# either — the kernel has no image-release workflow; you build and push.
#
# Required Secret:
#   vector-ipcrypt-secret: IPCRYPT_KEY (32 hex chars, AES-128 key)
##############################################################
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: gremion-system
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: log-pipeline
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: log-pipeline
    spec:
      serviceAccountName: vector
      # G-036 (Wave 3b T4.1): pod-level baseline-PSS hardening.
      # automountServiceAccountToken is INTENTIONALLY kept (default true) —
      # Vector's k8s_logs source needs API access to look up pod/namespace
      # metadata. This is the legitimate exception called out in the plan.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        # Run on control-plane nodes too in single-node clusters
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vector
          # Built from docker/vector/Dockerfile — matches docker-compose.yml's
          # `vector` service image.
          #
          # A-020/#431: pinned to the kernel version, never `:latest`.
          # See the IMAGE REFERENCES block in ../kustomization.yaml for how to
          # point this at your registry.
          image: ghcr.io/hello-n00del/gremion-vector:0.1.0
          imagePullPolicy: Always
          env:
            - name: IPCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: vector-ipcrypt-secret
                  key: IPCRYPT_KEY
            - name: LOG_RETENTION_SECONDS
              value: "1209600"   # 14 days — matches access_logs_days default
            - name: VECTOR_CONFIG
              value: /etc/vector/vector.toml
          volumeMounts:
            - name: vector-config
              mountPath: /etc/vector
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: vector-data
              mountPath: /var/lib/vector
            - name: log-output
              mountPath: /logs
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Vector writes state to /var/lib/vector
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health
              port: 8686
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: vector-config
          configMap:
            name: vector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: vector-data
          hostPath:
            path: /var/lib/vector-gremion
            type: DirectoryOrCreate
        - name: log-output
          hostPath:
            path: /var/log/gremion/processed
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: gremion-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-gremion
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-gremion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-gremion
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: gremion-system
---
apiVersion: v1
kind: Secret
metadata:
  name: vector-ipcrypt-secret
  namespace: gremion-system
type: Opaque
stringData:
  # G-029 (Wave 3b T1.1): IPCRYPT_KEY is supplied by the overlay, NOT by this
  # base manifest. The base sentinel value forces a kubectl-apply failure if
  # the overlay forgets to override it — that's the intended behaviour. Real
  # values flow from k8s/overlays/<env>/secrets/vector-ipcrypt-secret.enc.yaml
  # via SOPS (see k8s/overlays/production/secrets/README.md). Operators
  # generate the key with `openssl rand -hex 16` and encrypt before commit.
  IPCRYPT_KEY: "__OVERRIDE_FROM_OVERLAY_SOPS_VECTOR_IPCRYPT_SECRET__"
