# ── HOW TO BUILD (#431) ──────────────────────────────────────────────────────
#
#   kubectl kustomize k8s/base
#   kubectl kustomize k8s/overlays/production   (likewise aks, eks, gke)
#
# No flags. Verified against kubectl v1.36.1 / Kustomize v5.8.1: exit 0, EMPTY
# stderr, no warnings, 50 rendered documents — for k8s/base AND for each of the
# production / aks / eks / gke overlays.
#
# "No warnings" is load-bearing and was NOT free: every overlay used to emit
# `bases`/`commonLabels` deprecation warnings on stderr while still exiting 0.
# They were migrated to `resources:` / `labels: includeSelectors: true`, which
# is behaviour-preserving — the rendered output of all five overlays is
# byte-identical across that change.
#
# The dev overlay is the ONE exception and still needs
# `--load-restrictor LoadRestrictionsNone`: it secretGenerates from the repo
# root `../../../.env`, which is a FILE load above its own root and has no
# in-root equivalent (the file is developer-local and deliberately untracked).
#
# Nothing here reaches above this directory to load a FILE any more:
#   - namespace.yaml lives in this directory.
#   - the keycloak-realm / keycloak-scripts ConfigMaps are generated by
#     ../../docker/kustomization.yaml, which sits next to the compose files it
#     reads and is pulled in as a `resources:` DIRECTORY. Referencing a
#     directory above the root is the ordinary overlay mechanism and is always
#     permitted; only FILE loads are root-restricted. Nothing was copied —
#     realm-export.json and substitute-realm-secrets.sh still have exactly one
#     copy each, owned by docker/.
#
# Every claim in this block is enforced by scripts/kernel-hygiene-check.mjs,
# which asserts the RENDERED output and stderr — never an exit code:
#   e3/e4/e5 — base builds bare, emits nothing on stderr, forks no shared file.
#   g8       — dev is the ONLY overlay needing the flag, and every other
#              overlay renders with EMPTY stderr (a deprecation warning on a
#              zero-exit build is a failure here).
# If you change a claim above, change its check — an unenforced claim in this
# file is the exact defect that produced the A-020 image sentinel.
#
# ── IMAGE REFERENCES (A-020/#431) ────────────────────────────────────────────
#
# The four first-party images — ghcr.io/hello-n00del/gremion-{ui,public,legal,
# vector} — are pinned here to the kernel version from package.json (`0.1.0`).
# Not `:latest`: a mutable tag makes a rollback unreproducible.
#
# They are BUILT FROM THIS REPO (`make build` → `docker compose build`). The
# kernel has NO image-publish workflow yet — nothing in .github/workflows runs
# `docker push` — so ghcr.io/hello-n00del/gremion-* is the coordinate these
# images are BUILT AS, not one you can pull today. Push them to a registry you
# control, then override the reference in ONE of two ways:
#
#   1. Preferred — a kustomize `images:` block in your overlay. Every overlay
#      in k8s/overlays/ carries a commented, copy-pasteable example (enforced
#      by g7; the sentence was false when first written). This keeps base
#      untouched, so `git pull` stays conflict-free:
#
#        images:
#          - name: ghcr.io/hello-n00del/gremion-ui
#            newName: registry.example.org/<your-namespace>/gremion-ui
#            digest: sha256:<digest of the image you pushed>
#
#   2. Edit the `image:` lines in base directly (docs/deployment.md, Step 2).
#
# Digest-pinning is the stronger choice and `images:` supports it via `digest:`.
# We do NOT ship a placeholder digest here: an unresolvable reference renders
# an unpullable Deployment in every overlay, and `image:` is an unconstrained
# string in the PodSpec schema — the API server admits it and the pod then sits
# in ImagePullBackOff. Nothing rejects a well-formed but imaginary reference at
# `kubectl apply` time, so a manifest comment CANNOT promise a fail-fast there.
# That enforcement lives in scripts/kernel-hygiene-check.mjs instead (g3–g6),
# where it runs on `make lint` and actually fails the build.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gremion-system

# `labels` + includeSelectors: true is the exact successor to the deprecated
# `commonLabels` (which always wrote into selectors). Keep includeSelectors —
# dropping it would silently stop labelling Deployment/Service selectors, which
# for an already-deployed StatefulSet/Deployment is an immutable-field error.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: gremion
      app.kubernetes.io/managed-by: kustomize

resources:
  # Shared compose<->k8s config, generated at its own root so no FILE load
  # crosses above this kustomization (#431). See ../../docker/kustomization.yaml.
  - ../../docker
  - namespace.yaml
  # Databases
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/configmap.yaml
  # Identity provider
  - keycloak/deployment.yaml
  - keycloak/service.yaml
  - keycloak/configmap.yaml
  - keycloak/pdb.yaml
  # gremion-ui
  - gremion-ui/deployment.yaml
  - gremion-ui/service.yaml
  - gremion-ui/configmap.yaml
  # gremion-public
  - gremion-public/deployment.yaml
  - gremion-public/service.yaml
  - gremion-public/configmap.yaml
  - gremion-public/secret.yaml
  # Legal pages
  - legal/deployment.yaml
  - legal/service.yaml
  # Backup
  - backup/cronjob.yaml
  - backup/pvc.yaml
  - backup/restic-secret.yaml
  - backup/rclone-secret.yaml
  # Vector log pipeline
  - vector/configmap.yaml
  - vector/daemonset.yaml
  # Routing & security
  - traefik/middlewares.yaml
  - traefik/ingressroutes.yaml
  - network-policies.yaml

# ── Secret placeholders ──────────────────────────────────────
# Secrets are managed externally via SOPS or Sealed Secrets.
# The secretGenerator below creates placeholder Secrets from
# a local .env file for development use ONLY.
# For production, replace these with your secret management tool.
#
# To use SOPS:  https://github.com/getsops/sops
# To use Sealed Secrets: https://github.com/bitnami-labs/sealed-secrets
#
# secretGenerator:
#   - name: postgres-secret
#     envs: [../../.env]
#   - name: keycloak-secret
#     envs: [../../.env]

# ── Keycloak realm config ───────────────────────────────────
# NOTE (C9): The base realm-export.json intentionally contains NO users.
# Hard-coded dev accounts (Test1234!) live ONLY in the dev overlay
# (k8s/overlays/dev/) via a separate `keycloak-dev-users` ConfigMap that
# is mounted as a second import file. Production overlays MUST NOT import
# dev-users.json. If you add a new user seeding source, keep it out of
# this base layer.
#
# NOTE (C10): Client secrets in realm-export.json are envsubst sentinels
# (__GREMION_UI_OIDC_CLIENT_SECRET__, __GREMION_ADMIN_OIDC_CLIENT_SECRET__) that are
# replaced at pod start by the `substitute-realm-secrets` initContainer using
# values from the `keycloak-secret` Secret. The `keycloak-scripts` ConfigMap
# ships the substitution shell script used by that initContainer.
# These two ConfigMaps are generated by ../../docker/kustomization.yaml (pulled
# in via `resources:` above), NOT here: a configMapGenerator `files:` entry
# pointing at ../../docker/... is a FILE load above the root and kustomize's
# default LoadRestrictionsRootOnly rejects it, which is what made this base
# unbuildable without `--load-restrictor LoadRestrictionsNone` (#431).
