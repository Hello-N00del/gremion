# G-031 (Wave 3b T1.3): GREMION_PUBLIC_DB_URL is supplied by the overlay,
# NOT by this base manifest. Real values flow from
# k8s/overlays/<env>/secrets/gremion-public-secret.enc.yaml via SOPS
# (see k8s/overlays/production/secrets/README.md). The sentinel below
# fails fast at runtime if the overlay forgets to override it.
#
# Deployment reference (unchanged):
#   envFrom: - secretRef: name: gremion-public-secret
#
# Format: postgresql://<user>:<password>@postgres:5432/gremion?sslmode=require
apiVersion: v1
kind: Secret
metadata:
  name: gremion-public-secret
  labels:
    app: gremion-public
type: Opaque
stringData:
  GREMION_PUBLIC_DB_URL: "__OVERRIDE_FROM_OVERLAY_SOPS_GREMION_PUBLIC_SECRET__"
