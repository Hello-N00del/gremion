apiVersion: apps/v1
kind: Deployment
metadata:
  name: gremion-public
  labels:
    app: gremion-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gremion-public
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gremion-public
    spec:
      # G-036 (Wave 3b T4.1): pod-level baseline-PSS hardening.
      # A-021 (addendum-4): runAsNonRoot/runAsUser now that the image ships a
      # non-root `node` user (uid/gid 1000); this makes the Pod restricted-PSS
      # compliant. The SSR server writes nothing to disk, so no fsGroup/chown.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gremion-public
          # A-020/#431: pinned to the kernel version, never `:latest`.
          # First-party image, built from this repo — see the IMAGE REFERENCES
          # block in ../kustomization.yaml for how to point it at your registry.
          image: ghcr.io/hello-n00del/gremion-public:0.1.0
          # G-036: container-level baseline-PSS hardening.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: gremion-public-config
            - secretRef:
                name: gremion-public-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
