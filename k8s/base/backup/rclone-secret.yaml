##############################################################
# rclone provider credentials for the backup CronJob.
#
# All keys are optional — omit RCLONE_BUCKET to skip the
# rclone sync phase entirely (local-only backup).
#
# rclone reads provider config from environment variables using
# the RCLONE_CONFIG_<REMOTE>_<KEY> convention.
# Set RCLONE_REMOTE to match the <REMOTE> name used below
# (default: "backup").
#
# Example — S3-compatible (AWS, Cloudflare R2, Hetzner Object Storage):
#   RCLONE_CONFIG_BACKUP_TYPE: s3
#   RCLONE_CONFIG_BACKUP_PROVIDER: AWS         # or Cloudflare, Minio, Other
#   RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ...
#   RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ...
#   RCLONE_CONFIG_BACKUP_ENDPOINT: ...         # leave empty for AWS S3
#   RCLONE_CONFIG_BACKUP_REGION: eu-central-1
#
# Example — Azure Blob:
#   RCLONE_CONFIG_BACKUP_TYPE: azureblob
#   RCLONE_CONFIG_BACKUP_ACCOUNT: ...
#   RCLONE_CONFIG_BACKUP_KEY: ...
#
# Never commit real credentials. Use Sealed Secrets, External Secrets
# Operator, or a vault-injector to populate this Secret in production.
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: rclone-secret
  namespace: gremion-system
type: Opaque
stringData:
  RCLONE_BUCKET: ""          # bucket or container name; leave empty to skip sync
  RCLONE_REMOTE: "backup"
  RCLONE_REMOTE_PATH: "stura-restic"
  # Provider-specific keys — add as needed:
  # RCLONE_CONFIG_BACKUP_TYPE: s3
  # RCLONE_CONFIG_BACKUP_PROVIDER: Other
  # RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ""
  # RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ""
  # RCLONE_CONFIG_BACKUP_ENDPOINT: ""
  # RCLONE_CONFIG_BACKUP_REGION: ""
