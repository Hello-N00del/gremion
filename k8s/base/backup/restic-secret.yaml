##############################################################
# restic repository passphrase for the BASE backup CronJob
# (k8s/base/backup/cronjob.yaml — restic + rclone path).
#
# G-030 (Wave 3b T1.2): RESTIC_PASSWORD is supplied by the overlay,
# NOT by this base manifest. Real values flow from
# k8s/overlays/<env>/secrets/restic-secret.enc.yaml via SOPS
# (see k8s/overlays/production/secrets/README.md).
#
# Note: the production overlay's strategic-merge patch
# (k8s/overlays/production/patches/backup-cronjob.yaml) REPLACES the
# base CronJob's command with an S3-encryption path that consumes a
# DIFFERENT Secret named `backup-secret` (BACKUP_ENCRYPTION_KEY etc.).
# In the production overlay, this base restic-secret is therefore
# unused at runtime — but the manifest still loads so we keep the
# sentinel here to fail-fast if a future overlay tries to fall back
# to the base restic path without an overlay override.
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: restic-secret
  namespace: gremion-system
type: Opaque
stringData:
  RESTIC_PASSWORD: "__OVERRIDE_FROM_OVERLAY_SOPS_RESTIC_SECRET__"
