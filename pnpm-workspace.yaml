packages:
  - 'gremion-ui'
  - 'gremion-public'
  - 'packages/*'
  - 'modules/*'
  # TASK-043 G6: the ops control panel (apps/control-panel, SvelteKit 2).
  - 'apps/*'

# TASK-017 (TRD-401 [D R19-D34]): Node 26 everywhere. engineStrict makes a
# mismatched engines.node (root package.json) a FAILED install, not a warning
# — verified empirically: without this key, `pnpm install` on the wrong Node
# major only warns; with it, it exits ERR_PNPM_UNSUPPORTED_ENGINE. This is the
# workspace-root form; the per-app gremion-ui/.npmrc engine-strict=true line
# is likely inert (pnpm reads config at the workspace root, not per-package)
# and is left in place unfixed — recorded, not fixed, per the brief (§3).
engineStrict: true

# TASK-017 (TRD-402 [D R19-D1]): pnpm 10 skips a dependency's install/postinstall
# script by default unless it is explicitly allowed here. strictDepBuilds makes
# an UNDECIDED build script a hard install failure instead of a silent skip —
# verified empirically: without it, an unlisted build script only warns and
# `pnpm install` exits 0; with it, the install exits non-zero naming the dep.
# Every name below must carry a reason in scripts/check-toolchain.mjs's
# ALLOWED_BUILD_DEPS table — `make lint-toolchain` asserts the two sets are
# identical in both directions (an allowance with no reason, or a reason with
# no allowance, both fail the guard).
#
# `ignoredBuiltDependencies` was tried first (matching TRD-402's wording) but
# does NOT suppress strictDepBuilds's hard failure in pnpm 10.33 — verified
# empirically: esbuild + msw listed there still hard-failed the install.
# `onlyBuiltDependencies` (an explicit ALLOW, which actually runs the script)
# is the mechanism that works, and both scripts here are side-effect-free
# dev/build-only steps (see the guard's reason table), so allowing them is
# safe. `better-sqlite3` was once a stale allowance in package.json's `pnpm`
# field and was removed; it is back HERE, with a reason, because the in-tree
# modules (TASK-200) resolve it as a devDependency.
strictDepBuilds: true
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - msw

# CVE floors. `scripts/check-cve-floors.mjs` (wired into `make lint`) pins each entry
# against a committed floor table, asserts the lockfile absorbed it, asserts the
# resolved tree honours it, and rejects an UNBOUNDED replacement — a bare
# `>=x.y.z` raises the floor but removes the ceiling, admitting the next major.
overrides:
  # GHSA-pxg6-pf52-xh8x (CVE-2024-47764) — cookie <0.7.0 accepts out-of-bounds
  # characters in name, path and domain; first patched release 0.7.0, the floor is
  # held at 0.7.2. The ceiling is NEW: while this read a bare '>=0.7.2' it forced
  # cookie 1.1.1 into @sveltejs/kit, which declares 'cookie: ^0.6.0' — two majors
  # outside its own range. '<1' still clears the advisory without that major jump.
  cookie@<0.7.0: '>=0.7.2 <1'
  # GHSA — dompurify <=3.4.12: mXSS sanitiser bypass (Dependabot #58); GHSA-p98j-92pf-mc4p
  # + GHSA-6688-9rhm-gjv2 — 3.4.13 to 3.4.15: a node-removing afterSanitize hook leaves a
  # sanitisation bypass (first patched 3.4.16). Reached through isomorphic-dompurify in both
  # workspace apps. This was an EXACT pin at 3.4.13 — a pin cannot follow an advisory: once
  # 3.4.13 itself was covered it held the tree one release inside the vulnerable range. A
  # floor bounded to 3.x patches the line instead, and lets the next fix land by re-lock.
  dompurify: '>=3.4.16 <4'
  # GHSA — undici <7.29.0: TLS certificate validation bypass via dispatcher,
  # cross-origin request routing via SOCKS5, WebSocket client DoS, plus four
  # lower-severity issues (5 open Dependabot alerts, 1 HIGH). Pulled in transitively
  # by jsdom (test dependency); nothing declares it directly, so only an
  # override moves it. The TLS bypass is the one that matters here: the app
  # talks to Keycloak over HTTPS pinned to an internal CA (G-080), so a
  # dispatcher-level verification bypass undermines that trust anchor.
  # The same override is applied in every repository that consumes this workspace.
  #
  # Then GHSA-w293-vg96-wgc3 (HIGH, a TLS certificate validation bypass through a dropped
  # connection, >=7.24.1), GHSA-rfgv-xxqx-mfg5 (HIGH, unrequested WebSocket subprotocol DoS)
  # and eight more (cookie-cache cross-user disclosure, retry-interceptor response splitting,
  # unbounded decompression, WebSocketStream close, ...) landed on every release below 7.29.1.
  # This was an EXACT pin at 7.29.0 — the shape that already went stale once (7.28.0 in the
  # product repository): a pin cannot follow an advisory, it holds the tree one release inside
  # the vulnerable range. A floor bounded to 7.x patches the line and lets the next fix land by
  # re-lock. jsdom declares a 7.x range, so the ceiling costs nothing.
  undici: '>=7.29.1 <8'
  # GHSA-g7r4-m6w7-qqqr — esbuild dev-server arbitrary file read on Windows.
  # Pulled in via tsx's own `esbuild: ~0.28.0` dependency, which is patched
  # only starting at 0.28.1 (patch bump within tsx's own allowed range).
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1 <0.29'
  # GHSA — @sveltejs/kit <=2.70.1: prototype pollution in the remote-function
  # file-input deletion path, and large remote-form payloads can crash the Node
  # process. gremion-public trailed gremion-ui on this; the override keeps both
  # workspace apps (and any transitive copy) on the patched line.
  #
  # KEEP THIS FLOOR IN LOCKSTEP WITH THE TWO APP MANIFESTS. A pnpm override
  # REPLACES the manifest range rather than intersecting with it: the lockfile
  # records `specifier: '>=2.70.2'` for both importers, NOT the `^x.y.z` written
  # in gremion-ui/package.json and gremion-public/package.json. So while this
  # said `>=2.69.1`, bumping the manifests to ^2.70.1 resolved to 2.70.0 anyway
  # (2.70.0 already satisfies >=2.69.1, so pnpm had no reason to move) and the
  # manifests silently claimed a floor the installed tree did not honour. Any
  # future kit bump must raise this line too, or it is inert.
  '@sveltejs/kit': '>=2.70.2 <3'
  # GHSA — nanoid <3.3.18 (Dependabot #61, HIGH): predictable IDs from a biased
  # random source. Only the 3.x line is affected and it arrives transitively via
  # postcss's `nanoid: ^3.3.11`, so the selector is scoped to <3.3.18 — an
  # unscoped override would drag postcss onto nanoid 6.x, outside its range.
  nanoid@<3.3.18: '>=3.3.18 <4'
  # GHSA — postcss <=8.5.22 (Dependabot #60). Transitive through the Svelte/Vite
  # toolchain; scoped selector so the bump stays inside the 8.x line.
  postcss@<8.5.23: '>=8.5.23 <9'
  # GHSA-2x7j-588g-ccc2 (HIGH) + GHSA-wmmp-3585-3rmp + GHSA-cc9r-2j5m-2m83 (nodemailer <9.1.0)
  # + GHSA-8m3c-c648-2xjj (<=9.1.0), and the ones that are only fixed on the 10.x line:
  # GHSA-prgh-xp8r-p3m5 (HIGH, <=10.0.4), GHSA-v53p-9fqp-m79j (HIGH, address-parser ReDoS,
  # <=10.0.5), GHSA-g57g-f23g-4646 (<10.0.9), GHSA-6vj9-mwq6-2f5v + GHSA-8vvx-rff5-p5rq
  # (<10.0.2). 9.x never receives those fixes, so the floor is the first release past all of
  # them: 10.0.9. Direct dependency of gremion-ui; the floor is held here so
  # scripts/check-cve-floors.mjs can watch it. Bounded to 10.x: 11 would be a major.
  nodemailer: '>=10.0.9 <11'
  # GHSA-82fw-gwwq-j7x9 — vitest >=2.1.0 <4.1.11; the advisory lives in @vitest/mocker, which
  # vitest pins exactly, so both are floored and both stay on the 4.x line.
  vitest: '>=4.1.11 <5'
  '@vitest/mocker': '>=4.1.11 <5'
  # GHSA-w5hq-g745-h8pq — uuid <11.1.1: missing buffer bounds check in v3/v5/v6 when
  # `buf` is provided. Arrives with the in-tree finance module (TASK-200) through
  # exceljs's `uuid: ^8.3.0`, so only an override moves it; 11.x keeps the CJS
  # `require('uuid').v4` entry exceljs uses. Scoped selector, bounded to 11.x.
  uuid@<11.1.1: '>=11.1.1 <12'
  # GHSA-9rgm-9g3h-6x36 — devalue <5.9.1: DoS via malformed input (Dependabot #7, medium;
  # first patched release 5.9.2). Transitive through @sveltejs/kit, which declares
  # `devalue: ^5.x`; bounded to 5.x so the floor never drags kit onto devalue 6.
  devalue: '>=5.9.2 <6'
  # GHSA-68fv-2mgg-jv7q (HIGH) — source-map-js >=1.0.0 <1.2.2: event-loop denial of service
  # through indexed source-map section offsets. Build-time only (gremion-public > @sveltejs/kit
  # > vite > postcss > source-map-js); the postcss floor above does not lift it, because
  # postcss 8.5.23 still accepts source-map-js 1.2.1. Scoped selector, bounded to 1.x.
  source-map-js@<1.2.2: '>=1.2.2 <2'
