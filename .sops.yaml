# .sops.yaml — SOPS encryption rules for Gremion (TRD-442, TASK-046)
# See: https://github.com/getsops/sops
#
# ONE rule for the compose layout the pilot runs: every file under a
# `secrets/` directory and every `*.enc.{yaml,yml,json,env}` anywhere is
# encrypted to the operator's age recipient(s). The k8s-only rule this file
# used to carry is gone (k8s is not the pilot path); the rule below still
# covers k8s/overlays/production/secrets/*.enc.yaml, so encrypt-all.sh keeps
# working unchanged.
#
# OPERATOR ACTIVATION: replace the <OPERATOR_AGE_PUBLIC_KEY_…> sentinel below
# with the age PUBLIC recipient (age1…). Until then
# `node scripts/release/check-sops.mjs` FAILS with `sentinel-recipient` —
# expected, see scripts/release/README.md (activation checklist). The private
# half lives in the operator vault and the recovery kit only; NEVER commit it.
#
# Check: node scripts/release/check-sops.mjs
#   Every secret-class file must be SOPS ciphertext (every value ENC[…], a
#   MAC) encrypted only to the recipient(s) named here.

creation_rules:
  - path_regex: (^|/)secrets/.+|\.enc\.(yaml|yml|json|env)$
    age: >-
      age1ul80t2uw0ujjedcls3fzlhffugtulg9qtcymt3dp2gmh3wa90c2sckt6n5
