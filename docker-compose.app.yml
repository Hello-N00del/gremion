##############################################################
# docker-compose.app.yml — the APP tier, one compose project PER COLOUR
#
# PRD-PLAT-005 / TRD-440 / TRD-038 (TASK-040). The host instantiates this
# file twice, as ${STACK}-app-blue and ${STACK}-app-green:
#
#   docker compose --env-file /opt/gremion/etc/env/app-${COLOUR}.env <verb>
#
# app.env.tmpl carries COMPOSE_FILE (this file + the release pins layer),
# COMPOSE_PROJECT_NAME and COMPOSE_PROFILES, so no -f / -p / --profile is
# ever passed on a host. Local dev: `make up` (docker-compose.app.dev.yml on
# top, project dev-app-blue).
#
# This file carries ONLY the kernel's app-tier services (gremion-ui,
# gremion-public) and its two profile-gated one-shots (migrate,
# tenant-create). The state tier (databases, keycloak, the edge) is the
# separate ${STACK}-state project (docker-compose.yml): a colour switch
# starts and stops only the containers below and never touches a persisted
# volume -- every volume here is EXTERNAL, created once per stack by
# infra/host/bootstrap.sh stage_networks (TRD-038). A new tenant adds
# databases, a realm and an account, never a container here (TRD-440).
#
# The two tiers meet only on the two stack-scoped external networks,
# ${STACK}_state and ${STACK}_edge. Every app-tier service carries the
# alias <service>-${COLOUR} on both, and every first-party host an app-tier
# value names carries that suffix: a bare gremion-ui would resolve to
# whichever colour Docker answered with.
#
# No docker-provider router lives here (traefik.enable=false): the app tier
# is reached ONLY through etc/edge/active.yml, which gremion-switch rewrites.
# A docker router on a colour would survive the switch and keep routing to
# the wrong colour. Placement, limits and the cost record:
# docs/ops/pooled-stack-layout.md; the guard is scripts/check-pooled-stack.mjs.
##############################################################

# Required-variable guard, the idiom of docker-compose.yml's x-required-env:
# compose interpolates the WHOLE document, extension fields included, so an
# unset or empty key named here aborts every verb before a container starts.
# Every key is declared in infra/host/templates/env/app.env.tmpl.
x-required-env:
  stack: "${STACK:?STACK required}"
  colour: "${COLOUR:?COLOUR required}"
  platform-domain: "${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}"
  image-tag: "${IMAGE_TAG:?IMAGE_TAG required}"
  app-v4-subnet: "${APP_V4_SUBNET:?APP_V4_SUBNET required}"
  app-v6-subnet: "${APP_V6_SUBNET:?APP_V6_SUBNET required}"

# Container limits (TRD-177), the same sizes as docker-compose.yml's anchors
# (YAML anchors do not cross files). [A] until TRD-226's measurement exists.
x-limits-m: &limits-m
  resources:
    limits:
      memory: 512M
      cpus: "0.5"
x-limits-l: &limits-l
  resources:
    limits:
      memory: 1G
      cpus: "1.0"

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:

  # ============================================================
  # Gremion UI — unified SvelteKit frontend (production shape)
  # ============================================================
  # The base block of docker-compose.yml merged with its former prod overlay:
  # there is no prod overlay for the app project, so this IS the host shape.
  gremion-ui:
    image: ghcr.io/hello-n00del/gremion-ui:${IMAGE_TAG:?IMAGE_TAG required}
    build:
      context: .
      dockerfile: gremion-ui/Dockerfile
    restart: unless-stopped
    logging: *logging
    deploy: *limits-l
    labels:
      traefik.enable: "false"
      # gremion-switch / gremion-deploy POST /api/internal/evict to every
      # labelled container and abort unless it answers 204. gremion-ui serves
      # that route (routes/api/internal/evict, Bearer INTERNAL_PUSH_SECRET,
      # clears the tenant runtime caches); the tenant_evict NOTIFY listener
      # (hooks.server) and the ~30 s TTL remain the cross-process backstop.
      gremion.evict: "true"
    # No depends_on: postgres and keycloak are the STATE project's, and a
    # cross-project depends_on cannot resolve. Boot ordering is TASK-023's
    # boot retry; test/host/integration/pooled-stack-proof.sh asserts app
    # health after a cold state start.
    environment:
      # TASK-023's hand-off: /healthz reports {"colour":"<COLOUR>"}.
      COLOUR: ${COLOUR:?COLOUR required}
      AUTH_SECRET:              ${AUTH_SECRET}
      AUTH_KEYCLOAK_ID:         ${AUTH_KEYCLOAK_ID:-gremion-ui}
      AUTH_KEYCLOAK_SECRET:     ${AUTH_KEYCLOAK_SECRET}
      AUTH_KEYCLOAK_ISSUER:     ${AUTH_KEYCLOAK_ISSUER:-}
      # G-080: server-to-server OIDC over internal TLS. keycloak resolves on
      # ${STACK}_state (one state project per stack, so the bare state-tier
      # name is unambiguous there).
      AUTH_KEYCLOAK_INTERNAL:   https://keycloak:8443/auth/realms/gremion
      AUTH_TRUST_HOST:          "1"
      STEPUP_FRESHNESS_SECONDS: ${STEPUP_FRESHNESS_SECONDS:-300}
      # TASK-028 (spec B section 6, TRD-039): the app's DOMAIN is bound from
      # the one key the host env files carry, `:?`-guarded (it moved here with
      # the gremion-ui block from docker-compose.prod.yml). Every read of
      # PLATFORM_DOMAIN in the compose files carries `:?`
      # (test/host/validate-env.bats).
      DOMAIN: ${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      PUBLIC_BASE_URL:          ${PUBLIC_BASE_URL:-https://${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}}
      # AGPL-3.0 section 13: an operator running a MODIFIED build MUST point
      # this at their own repository. Unset falls back to upstream.
      PUBLIC_SOURCE_URL:        ${PUBLIC_SOURCE_URL:-}
      # ORIGIN deliberately unset (multi-tenant CSRF, #202): every tenant is
      # served on its OWN bound host (its tenant_domain rows; the apex serves
      # no tenant, TASK-041), so one fixed ORIGIN would 403 every tenant's
      # SSO/form POST. adapter-node derives it from the real inbound Host,
      # while the tenant resolver selects on the whole x-forwarded-host its
      # router pins, cross-checked against that same Host. PROTOCOL_HEADER
      # forces https from Traefik's x-forwarded-proto.
      PROTOCOL_HEADER:          x-forwarded-proto
      KEYCLOAK_ADMIN_URL:       https://keycloak:8443/auth
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      CONFIG_PATH:              /app/config/config.json
      # Data plane through PgBouncer; the control plane stays DIRECT on
      # postgres:5432 (D-CONTROLDIRECT, the "+ control" term of P2.1b's
      # connection budget -- never re-point it off the pooler's bypass). Both
      # hosts carry their -${STACK} segment (the state tier's aliases) so a
      # URL read from inside the container names the stack it targets.
      DATABASE_URL:             postgresql://${GREMION_DB_USER:-gremion}:${GREMION_DB_PASSWORD}@pgbouncer-${STACK:?STACK required}:6432/${GREMION_DB_NAME:-gremion}
      CONTROL_DATABASE_URL:     postgresql://${CONTROL_DB_USER:-control}:${CONTROL_DB_PASSWORD}@postgres-${STACK:?STACK required}:5432/${CONTROL_DB_NAME:-control}
      # TRD-092: the council-admin access-record view. gremion_ui_oac (EXECUTE on
      # oac.list_access_records only), DIRECT to gremion_platform like the other
      # platform roles; without it the view answers 503 "nicht konfiguriert".
      PLATFORM_ACCESS_DATABASE_URL: postgresql://gremion_ui_oac:${UI_OAC_DB_PASSWORD:?UI_OAC_DB_PASSWORD required}@postgres-${STACK:?STACK required}:5432/gremion_platform
      SEED_TOKEN:               ${SEED_TOKEN:-}
      SEED_USER_PASSWORD:       ${SEED_USER_PASSWORD:-}
      # Keep dev *_seed.sql migrations out of every deployment.
      GREMION_DISABLE_SEEDS:    "true"
      INTERNAL_PUSH_SECRET:     ${INTERNAL_PUSH_SECRET:-}
      # LOAD-BEARING for tenant isolation (#202): the inner server-to-server
      # hop targets THIS colour's container directly, bypassing Traefik, so the
      # stamped forwarded host survives. That X-Forwarded-Host (the tenant's
      # registered primary host, TASK-041) is the ENTIRE tenant selector; an
      # edge that restated it would aim a tenant's self-call at another
      # tenant's data plane (cross-tenant read+write). Derived from COLOUR,
      # never read from an env value that could name the other colour or no
      # colour.
      INTERNAL_BASE_URL:        http://gremion-ui-${COLOUR:?COLOUR required}:3000
      # P2.1c T5 (#202): the app enforces the proxy-trust gate with the same
      # secret the traefik container's gremion-ui-proxytrust middleware stamps.
      TENANT_PROXY_SHARED_SECRET: ${TENANT_PROXY_SHARED_SECRET:-}
      # G-080: trust the internal CA (adds to Node's built-in roots).
      NODE_EXTRA_CA_CERTS:      /etc/ssl/internal/internal-ca.pem
      SMTP_TEST_ALLOW_PRIVATE:  ${SMTP_TEST_ALLOW_PRIVATE:-}
      TRACE_EXPORTER:           ${TRACE_EXPORTER:-log}
    volumes:
      - config-data:/app/config
      # /data holds the per-tenant config files the provisioner writes
      # (/data/<slug>/config.json).
      - tenant-config-data:/data
      # D-SECMOUNT: per-tenant secrets cross the host->container boundary via
      # this ONE read-only bind mount (live: a new tenant's file appears
      # without a recreate).
      - ${TENANT_SECRETS_DIR:-./secrets/tenants}:/run/secrets/tenants:ro
      # G-080: internal CA trust anchor (minted by
      # docker/keycloak/certs/gen-internal-ca.sh).
      - ./docker/keycloak/certs/internal-ca.pem:/etc/ssl/internal/internal-ca.pem:ro
    networks:
      edge:
        aliases: ["gremion-ui-${COLOUR:?COLOUR required}"]
      state:
        aliases: ["gremion-ui-${COLOUR:?COLOUR required}"]
      app: {}
    healthcheck:
      # TASK-023 (B-05): /healthz is on the closed boot-and-resolve exemption
      # list, so this probe needs no host header, no proxy-trust secret and no
      # tenant row, and it no longer names the `default` tenant. It is LIVENESS
      # only: a still-booting or boot-failed process also answers 200 here
      # (/api/health is the boot probe). A non-transient boot failure exits 1
      # instead, and `restart: unless-stopped` recycles the container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # gremion-public — read-only public portal (B5)
  # ============================================================
  # Its router and rate limit are no longer docker labels here: the
  # public-ratelimit middleware sits on the traefik container
  # (docker-compose.prod.yml), and the router is the edge's (TASK-034).
  gremion-public:
    image: ghcr.io/hello-n00del/gremion-public:${IMAGE_TAG:?IMAGE_TAG required}
    build:
      context: .
      dockerfile: gremion-public/Dockerfile
      args:
        # Build-time mount point for the portal; the healthcheck below and
        # active.yml.tmpl's public probe follow the same variable.
        BASE_PATH: ${PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    logging: *logging
    deploy: *limits-m
    labels:
      traefik.enable: "false"
      # NO gremion.evict label: gremion-public serves no /api/internal/evict
      # and caches no tenant, so the switch has nothing to evict here.
    environment:
      COLOUR: ${COLOUR:?COLOUR required}
      ORIGIN:                      https://public.${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      GREMION_PUBLIC_DB_URL:       postgresql://gremion_public_reader:${PUBLIC_DB_PASSWORD}@postgres-${STACK:?STACK required}:5432/${GREMION_DB_NAME:-gremion}
      PUBLIC_CONTACT_NAME:         ${PUBLIC_CONTACT_NAME:-}
      PUBLIC_CONTACT_ADDRESS:      ${PUBLIC_CONTACT_ADDRESS:-}
      PUBLIC_CONTACT_EMAIL:        ${PUBLIC_CONTACT_EMAIL:-}
      PUBLIC_CONTACT_PHONE:        ${PUBLIC_CONTACT_PHONE:-}
      PUBLIC_IMPRINT_RESPONSIBLE:  ${PUBLIC_IMPRINT_RESPONSIBLE:-}
      PUBLIC_MAIN_APP_URL:         https://${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      PUBLIC_SOURCE_URL:           ${PUBLIC_SOURCE_URL:-}
      PUBLIC_LEGISLATURE_LABEL:    ${PUBLIC_LEGISLATURE_LABEL:-}
      PUBLIC_APEX_URL:             ${PUBLIC_APEX_URL:-}
      PUBLIC_APEX_LABEL:           ${PUBLIC_APEX_LABEL:-}
      PUBLIC_APEX_NOTE:            ${PUBLIC_APEX_NOTE:-}
      PUBLIC_APEX_COLOPHON:        ${PUBLIC_APEX_COLOPHON:-}
      # #241: Nextcloud admin credentials are deliberately NOT injected here.
    networks:
      edge:
        aliases: ["gremion-public-${COLOUR:?COLOUR required}"]
      state:
        aliases: ["gremion-public-${COLOUR:?COLOUR required}"]
      app: {}
    healthcheck:
      # Follows PUBLIC_BASE_PATH: under a base path the portal 404s outside it,
      # the container is marked unhealthy, and Traefik v3 removes its routers.
      # TASK-023: probes the database-free /healthz marker, not the home page.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000${PUBLIC_BASE_PATH:-}/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # control-panel — the ops shell (TASK-043 Q12, TRD-048)
  # ============================================================
  # SvelteKit 2 (R29-I5). Reachable ONLY from the operator's own realm
  # (`platform`, multi-factor) and never through a customer realm: its hooks
  # refuse any other issuer. NO Traefik route and NO published port: the
  # operator reaches it with `gremion-tenant panel`, which prints the
  # `ssh -L 127.0.0.1:<p>:<ip>:3000` line for this colour's address on
  # ${STACK}-app-<colour>_app (a public control router is TASK-118's). It
  # executes nothing itself (TASK-043d): PANEL_EXECUTOR is `queue`, so
  # "Neuer Mandant" writes ONE request row through
  # plt.submit_provisioning_request (its database role has SELECT plus that
  # one EXECUTE, nothing else); the host-side gremion-executor claims it,
  # re-verifies the operator's signed sign-in and creates the customer. The
  # image carries neither docker nor gremion-tenant.
  control-panel:
    image: ghcr.io/hello-n00del/gremion-control-panel:${IMAGE_TAG:?IMAGE_TAG required}
    build:
      context: .
      dockerfile: apps/control-panel/Dockerfile
    restart: unless-stopped
    logging: *logging
    deploy: *limits-m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    labels:
      traefik.enable: "false"
      # gremion-switch POSTs its evict fan-out to every long-running app
      # container; the panel caches no tenant, so its /api/internal/evict
      # verifies the bearer and answers 204.
      gremion.evict: "true"
    environment:
      COLOUR: ${COLOUR:?COLOUR required}
      INTERNAL_PUSH_SECRET: ${INTERNAL_PUSH_SECRET:-}
      # The origin the operator's browser uses behind `ssh -L`: SvelteKit's
      # CSRF check refuses a form POST from any other origin.
      ORIGIN: http://127.0.0.1:3043
      PANEL_OIDC_ISSUER: https://${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}/auth/realms/platform
      PANEL_OIDC_INTERNAL_BASE: https://keycloak:8443/auth
      NODE_EXTRA_CA_CERTS: /etc/ssl/internal/internal-ca.pem
      PANEL_OIDC_CLIENT_ID: control-panel
      PANEL_OIDC_CLIENT_SECRET_FILE: /run/secrets/control-panel/client_secret
      AUTH_SECRET_FILE: /run/secrets/control-panel/auth_secret
      PANEL_REQUIRED_ACR: loa2
      # The panel READS (tenant, tenant_domain, the ledger and request views)
      # and may EXECUTE plt.submit_provisioning_request only: its own role,
      # made by `gremion-tenant init` (ensurePanelRequester), never the two
      # databases' owners (r3 verifier MEDIUM #70).
      CONTROL_DATABASE_URL: postgresql://${PANEL_DB_USER:-gremion_panel}:${PANEL_DB_PASSWORD:?PANEL_DB_PASSWORD required}@postgres-${STACK:?STACK required}:5432/${CONTROL_DB_NAME:-control}
      PLATFORM_DATABASE_URL: postgresql://${PANEL_DB_USER:-gremion_panel}:${PANEL_DB_PASSWORD:?PANEL_DB_PASSWORD required}@postgres-${STACK:?STACK required}:5432/gremion_platform
      PANEL_EXECUTOR: queue
    volumes:
      - ${GREMION_ROOT:-/opt/gremion}/etc/secrets/control-panel:/run/secrets/control-panel:ro
      - ./docker/keycloak/certs/internal-ca.pem:/etc/ssl/internal/internal-ca.pem:ro
    networks:
      app: {}
      state:
        aliases: ["control-panel-${COLOUR:?COLOUR required}"]
    healthcheck:
      # The process and a valid config only -- never Keycloak or a database,
      # so the panel is healthy before `init`.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # migrate — one-shot (spec A §F.4.7)
  # ============================================================
  #   docker compose --env-file etc/env/app-<colour>.env run --rm migrate
  # profiles: [migrate] is load-bearing: without it `up` creates a migrate
  # container, which has no healthcheck, and gremion-deploy's wait_healthy
  # kills the deploy on health=none. Its own image: the builder stage of
  # gremion-ui/Dockerfile carries scripts/, tsx and both migration
  # directories, which the runner stage deliberately does not.
  migrate:
    profiles: [migrate]
    image: ghcr.io/hello-n00del/gremion-migrate:${IMAGE_TAG:?IMAGE_TAG required}
    build:
      context: .
      dockerfile: gremion-ui/Dockerfile
      target: builder
    # `pnpm migrate` is gremion-ui's script (run-migrations-verified); the
    # builder stage's last WORKDIR is the workspace root, which has none.
    working_dir: /repo/gremion-ui
    command: ["pnpm", "migrate"]
    restart: "no"
    logging: *logging
    deploy: *limits-l
    labels:
      traefik.enable: "false"
    environment:
      COLOUR: ${COLOUR:?COLOUR required}
      # Migrations run DIRECT on postgres, never through the transaction pooler.
      DATABASE_URL: postgresql://${GREMION_DB_USER:-gremion}:${GREMION_DB_PASSWORD}@postgres-${STACK:?STACK required}:5432/${GREMION_DB_NAME:-gremion}
      CONTROL_DATABASE_URL: postgresql://${CONTROL_DB_USER:-control}:${CONTROL_DB_PASSWORD}@postgres-${STACK:?STACK required}:5432/${CONTROL_DB_NAME:-control}
      # TASK-042 (zero-tenant boot, PRD-PLAT-012): run-migrations-verified
      # mirrors boot(): control migrations, then the fleet of ACTIVE registry
      # tenants. It registers no tenant, so it reads no OIDC setting and no
      # deployment config file: every provisioned tenant's secret refs are
      # file: refs (the mount below) and its config is /data/<slug>. On an
      # empty registry it migrates the control plane only and says so.
      GREMION_DISABLE_SEEDS:    "true"
    volumes:
      # Every provisioned tenant's database credential is a file: ref under
      # /run/secrets/tenants, and the fleet opens it before it migrates that
      # tenant. Measured once a second tenant existed: "FAILED: ENOENT ...
      # /run/secrets/tenants/tenant_t040-c_db". Read-only, like gremion-ui's.
      - ${TENANT_SECRETS_DIR:-./secrets/tenants}:/run/secrets/tenants:ro
      # ... and each tenant's config (/data/<slug>/config.json), whose brand
      # identity the fleet asserts (measured: "tenant t040-b config has an
      # INCOMPLETE brand identity" without it).
      - tenant-config-data:/data:ro
    networks:
      state:
        aliases: ["migrate-${COLOUR:?COLOUR required}"]


  # ============================================================
  # tenant-create — the customer lifecycle one-shot (B-06, TASK-043)
  # ============================================================
  #   infra/host/bin/gremion-tenant init|create|suspend|resume|reconcile|status
  # runs it as
  #   docker compose --env-file etc/env/app-<colour>.env run --rm \
  #     tenant-create <init|phase-a|record-step|phase-b|render-router|...> ...
  # (the host phase -- the vendor mail principal and the router file -- runs
  # between those on the host). It stays the interim fallback too: the same
  # package, run by hand (TRD-044, L1-36).
  # entrypoint, not command: the operator's arguments land as the
  # container's ARGUMENTS (a command: would be replaced by them). Same image
  # as migrate. On _state for the databases and _edge for keycloak's
  # public surface; it adds databases, a realm and an account -- no container.
  tenant-create:
    profiles: [tenant-create]
    image: ghcr.io/hello-n00del/gremion-migrate:${IMAGE_TAG:?IMAGE_TAG required}
    build:
      context: .
      dockerfile: gremion-ui/Dockerfile
      target: builder
    # Under tsx, as the runbook (docs/runbooks/tenant-lifecycle.md) and
    # gremion-ui's own `provision` script run it. Measured on the scratch proof,
    # the brief's plain `node gremion-ui/scripts/tenant-provision.mjs` dies with
    # ERR_MODULE_NOT_FOUND on the extensionless '../src/lib/modules/registry'.
    working_dir: /repo/gremion-ui
    entrypoint: ["pnpm", "exec", "tsx", "scripts/tenant-provision.mjs"]
    restart: "no"
    logging: *logging
    deploy: *limits-m
    labels:
      traefik.enable: "false"
    environment:
      COLOUR: ${COLOUR:?COLOUR required}
      DOMAIN: ${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      NODE_EXTRA_CA_CERTS: /etc/ssl/internal/internal-ca.pem
      DATABASE_URL: postgresql://${GREMION_DB_USER:-gremion}:${GREMION_DB_PASSWORD}@pgbouncer-${STACK:?STACK required}:6432/${GREMION_DB_NAME:-gremion}
      CONTROL_DATABASE_URL: postgresql://${CONTROL_DB_USER:-control}:${CONTROL_DB_PASSWORD}@postgres-${STACK:?STACK required}:5432/${CONTROL_DB_NAME:-control}
      KC_ADMIN_URL: https://keycloak:8443/auth
      AUTH_KEYCLOAK_INTERNAL: https://keycloak:8443/auth
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      TENANT_SECRETS_DIR: /run/secrets/tenants
      CONFIG_PATH: /app/config/config.json
      INTERNAL_BASE_URL: http://gremion-ui-${COLOUR:?COLOUR required}:3000
      INTERNAL_PUSH_SECRET: ${INTERNAL_PUSH_SECRET:-}
      # TASK-024: the broker, for ensureTenantAccount's reload and stream
      # ensure. No depends_on (the state project's nats is not in this
      # project): the connection retries itself, bounded, then fails loudly.
      NATS_URL: nats://nats-${STACK:?STACK required}:4222
      # TASK-043 G3: the customer lifecycle's environment contract. The CLI
      # checks every one of these before it connects and names a missing one
      # (exit 2); none has a default. gremion_platform is reached DIRECT (the
      # one runner refuses the pooler), as its owner role.
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      PLATFORM_DATABASE_URL: postgresql://${PLATFORM_DB_USER:-gremion_platform}:${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD required}@postgres-${STACK:?STACK required}:5432/gremion_platform
      # TASK-044 LOW: the scratch-fixture gate refuses when its stack IS the production stack.
      GREMION_PRODUCTION_STACK: ${GREMION_PRODUCTION_STACK:-}
      # `init` makes the control panel's read-only role with these (the
      # control-panel block above connects as it).
      PANEL_DB_USER: ${PANEL_DB_USER:-gremion_panel}
      PANEL_DB_PASSWORD: ${PANEL_DB_PASSWORD:?PANEL_DB_PASSWORD required}
      # `init` also makes the kernel API's SELECT-only role (ensureKernelApiReader);
      # deploy step 7 (kernel-api-migrate) and kernel-api connect as it.
      KERNEL_API_DB_USER: ${KERNEL_API_DB_USER:-gremion_kernel_api}
      KERNEL_API_DB_PASSWORD: ${KERNEL_API_DB_PASSWORD:?KERNEL_API_DB_PASSWORD required}
      # TRD-092: `init` makes the access-record reader gremion_ui_oac
      # (ensureAccessReader) with this password; gremion-ui connects as it.
      UI_OAC_DB_PASSWORD: ${UI_OAC_DB_PASSWORD:?UI_OAC_DB_PASSWORD required}
      # The servers' POSTGRES_USERs (CREATEDB/CREATEROLE for ensureKernelDatabase
      # and enableModule) and each module's app-role password: files written by
      # `gremion-tenant init` into etc/secrets/tenant-create (0600), mounted
      # read-only below and into this one-shot only.
      KERNEL_PG_ADMIN_FILE: /run/secrets/tenant-create/kernel_pg_admin
      MODULE_PG_ADMIN_BOARD_FILE: /run/secrets/tenant-create/module_pg_admin_board
      MODULE_PG_ADMIN_CALENDAR_FILE: /run/secrets/tenant-create/module_pg_admin_calendar
      MODULE_PG_ADMIN_CONTENT_FILE: /run/secrets/tenant-create/module_pg_admin_content
      MODULE_PG_ADMIN_FINANCE_FILE: /run/secrets/tenant-create/module_pg_admin_finance
      MODULE_PG_ADMIN_NEWSLETTER_FILE: /run/secrets/tenant-create/module_pg_admin_newsletter
      MODULE_PG_ADMIN_VAULT_FILE: /run/secrets/tenant-create/module_pg_admin_vault
      MODULE_APP_PASSWORD_BOARD_FILE: /run/secrets/tenant-create/module_app_password_board
      MODULE_APP_PASSWORD_CALENDAR_FILE: /run/secrets/tenant-create/module_app_password_calendar
      MODULE_APP_PASSWORD_CONTENT_FILE: /run/secrets/tenant-create/module_app_password_content
      MODULE_APP_PASSWORD_FINANCE_FILE: /run/secrets/tenant-create/module_app_password_finance
      MODULE_APP_PASSWORD_NEWSLETTER_FILE: /run/secrets/tenant-create/module_app_password_newsletter
      MODULE_APP_PASSWORD_VAULT_FILE: /run/secrets/tenant-create/module_app_password_vault
      # TASK-043b F1: the least-privilege Keycloak provisioner's client secret
      # (master SA `tenant-provisioner`, create-realm only), from the same
      # read-only mount. `gremion-tenant init` writes it (0600) on its first run
      # through `bootstrap-provisioner`; never under /run/secrets/tenants, which
      # gremion-ui mounts (check-tenant-secrets-dir).
      TENANT_PROVISIONER_SECRET_FILE: /run/secrets/tenant-create/tenant_provisioner
      # enableModule's export target; tenant-create never disables a module,
      # so nothing is written here (the disable verb brings its volume).
      TENANT_EXPORT_DIR: /var/lib/gremion/exports
      # TASK-075: the release_ref every ledger row init (gremion_platform) and
      # phase B (module databases) apply records: this colour's release.
      GREMION_RELEASE_REF: ${IMAGE_TAG:?IMAGE_TAG required}
      # gremion-ui and migrate hard-code it; the kernel migration tenant-create
      # now runs must never apply a *_seed.sql file (TDD 6).
      GREMION_DISABLE_SEEDS: "true"
    volumes:
      - config-data:/app/config
      - tenant-config-data:/data
      # TASK-043 G3: the admin credentials above, read-only.
      - ${GREMION_ROOT:-/opt/gremion}/etc/secrets/tenant-create:/run/secrets/tenant-create:ro
      # The ops realm `init` imports (Q5), read-only like the base realm below.
      # Never an etc/edge mount: the router file is written by the host (Q17, j4).
      - ./docker/keycloak/realm-export.ops.json:/repo/docker/keycloak/realm-export.ops.json:ro
      # TASK-024 (Q4): the NATS seeds (rw) -- ONLY this service mounts them;
      # gremion-ui, gremion-public and migrate mount none -- and the rendered
      # accounts file the state project's nats reads.
      - nats-secrets:/run/secrets/nats
      - nats-accounts:/etc/nats/accounts
      # The provisioner WRITES the tenant's secret files here (the long-running
      # gremion-ui mounts the same directory read-only).
      - ${TENANT_SECRETS_DIR:-./secrets/tenants}:/run/secrets/tenants
      - ./docker/keycloak/certs/internal-ca.pem:/etc/ssl/internal/internal-ca.pem:ro
      # The base realm the provisioner composes every tenant realm from
      # (loadBaseRealmDoc reads <repo>/docker/keycloak/realm-export.base.json);
      # the builder image carries only the workspace packages. Measured: without
      # it provision dies "ENOENT ... /repo/docker/keycloak/realm-export.base.json".
      - ./docker/keycloak/realm-export.base.json:/repo/docker/keycloak/realm-export.base.json:ro
    networks:
      edge:
        aliases: ["tenant-create-${COLOUR:?COLOUR required}"]
      state:
        aliases: ["tenant-create-${COLOUR:?COLOUR required}"]

  # ============================================================
  # kernel-api -- the kernel API: tenancy resolution + module registry
  # (TASK-077, L3-17). INTERNAL ONLY: no Traefik router, no published port,
  # not on the edge network. gremion-ui and the modules call it at
  # http://kernel-api-${COLOUR}:3000 (app.env.tmpl KERNEL_API_URL).
  # ============================================================
  # Refuses to boot without TENANT_PROXY_SHARED_SECRET (the proxy-trust gate
  # fails CLOSED here), and reads the control registry and gremion_platform as
  # its own SELECT-only role (ensureKernelApiReader) -- never an owner. Per-
  # customer kernel database credentials are file: refs under the read-only
  # tenants mount, the same one gremion-ui has. It writes nothing at runtime:
  # no DDL on the request path (the migrate job below owns every migration).
  kernel-api:
    image: ghcr.io/hello-n00del/gremion-kernel-api:${IMAGE_TAG:?IMAGE_TAG required}
    build:
      context: .
      dockerfile: services/kernel-api/Dockerfile
    restart: unless-stopped
    logging: *logging
    deploy: *limits-m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    labels:
      traefik.enable: "false"
      # NO gremion.evict label: gremion-switch POSTs /api/internal/evict to
      # every labelled container and requires a 204, and kernel-api serves only
      # the routes of openapi/kernel-core.json (the evict route is TASK-035's).
      # The registry caches no tenant, so there is nothing to evict. Add the
      # label together with the route; scripts/check-pooled-stack.mjs
      # (EVICT_IMPLEMENTERS) fails the build until both exist.
    environment:
      COLOUR: ${COLOUR:?COLOUR required}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      TENANT_PROXY_SHARED_SECRET: ${TENANT_PROXY_SHARED_SECRET:?TENANT_PROXY_SHARED_SECRET required}
      GREMION_RELEASE_REF: ${IMAGE_TAG:?IMAGE_TAG required}
      # DIRECT postgres, as the control panel's reader does: two reads per
      # request, no transaction-pooler state to leak between tenants.
      KERNEL_API_CONTROL_DB_URL: postgresql://${KERNEL_API_DB_USER:-gremion_kernel_api}:${KERNEL_API_DB_PASSWORD:?KERNEL_API_DB_PASSWORD required}@postgres-${STACK:?STACK required}:5432/${CONTROL_DB_NAME:-control}
      KERNEL_API_PLATFORM_DB_URL: postgresql://${KERNEL_API_DB_USER:-gremion_kernel_api}:${KERNEL_API_DB_PASSWORD:?KERNEL_API_DB_PASSWORD required}@postgres-${STACK:?STACK required}:5432/gremion_platform
      # Module-to-kernel service tokens (Q8): a module without a secret here
      # has no trust. Optional -- an unset or short value is ignored.
      KERNEL_API_MODULE_SECRET_BOARD: ${KERNEL_API_MODULE_SECRET_BOARD:-}
      KERNEL_API_MODULE_SECRET_CALENDAR: ${KERNEL_API_MODULE_SECRET_CALENDAR:-}
      KERNEL_API_MODULE_SECRET_CONTENT: ${KERNEL_API_MODULE_SECRET_CONTENT:-}
      KERNEL_API_MODULE_SECRET_ELECTIONS: ${KERNEL_API_MODULE_SECRET_ELECTIONS:-}
      KERNEL_API_MODULE_SECRET_FILES: ${KERNEL_API_MODULE_SECRET_FILES:-}
      KERNEL_API_MODULE_SECRET_FINANCE: ${KERNEL_API_MODULE_SECRET_FINANCE:-}
      KERNEL_API_MODULE_SECRET_HANDOVER: ${KERNEL_API_MODULE_SECRET_HANDOVER:-}
      KERNEL_API_MODULE_SECRET_MESSAGING: ${KERNEL_API_MODULE_SECRET_MESSAGING:-}
      KERNEL_API_MODULE_SECRET_PUBLISHING: ${KERNEL_API_MODULE_SECRET_PUBLISHING:-}
      KERNEL_API_MODULE_SECRET_VAULT: ${KERNEL_API_MODULE_SECRET_VAULT:-}
      KERNEL_API_MODULE_SECRET_VOTES: ${KERNEL_API_MODULE_SECRET_VOTES:-}
    volumes:
      # Each customer's kernel database credential is a file: ref under
      # /run/secrets/tenants (read-only, like gremion-ui's mount).
      - ${TENANT_SECRETS_DIR:-./secrets/tenants}:/run/secrets/tenants:ro
    networks:
      app: {}
      state:
        aliases: ["kernel-api-${COLOUR:?COLOUR required}"]
    healthcheck:
      # The process and a valid config only -- never a database, so it is
      # healthy before the first customer exists.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # kernel-api-migrate -- the per-customer kernel migration one-shot (Q10)
  # ============================================================
  #   docker compose --env-file etc/env/app-<colour>.env run --rm kernel-api-migrate [--customer <id>]
  # profiles: [kernel-api-migrate] is load-bearing for the same reason as
  # migrate's: without it `up` creates a container with no healthcheck and
  # gremion-deploy's wait_healthy kills the deploy. SAME image as kernel-api
  # (the command differs); gremion-deploy step 7 runs it after `migrate`.
  kernel-api-migrate:
    profiles: [kernel-api-migrate]
    image: ghcr.io/hello-n00del/gremion-kernel-api:${IMAGE_TAG:?IMAGE_TAG required}
    build:
      context: .
      dockerfile: services/kernel-api/Dockerfile
    command: ["node", "services/kernel-api/dist/index.js", "migrate"]
    restart: "no"
    logging: *logging
    deploy: *limits-m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    labels:
      traefik.enable: "false"
    environment:
      COLOUR: ${COLOUR:?COLOUR required}
      GREMION_RELEASE_REF: ${IMAGE_TAG:?IMAGE_TAG required}
      # The SAME path as the host (state.env GREMION_MIGRATION_DUMP_DIR), bind-mounted below.
      GREMION_MIGRATION_DUMP_DIR: ${GREMION_MIGRATION_DUMP_DIR:?GREMION_MIGRATION_DUMP_DIR required}
      KERNEL_API_CONTROL_DB_URL: postgresql://${KERNEL_API_DB_USER:-gremion_kernel_api}:${KERNEL_API_DB_PASSWORD:?KERNEL_API_DB_PASSWORD required}@postgres-${STACK:?STACK required}:5432/${CONTROL_DB_NAME:-control}
      # The kernel Postgres server ITSELF (never PgBouncer: DDL, advisory lock
      # and pg_dump need a session). HOST/PORT ONLY: credentials come from each
      # customer's db_conn_ref (directUrlFor refuses userinfo here), so the
      # superuser password is never in this container's environment.
      GREMION_KERNEL_PG_DIRECT_URL: postgresql://postgres-${STACK:?STACK required}:5432/postgres
    volumes:
      # TASK-075's pre-migration dump (the whole database in clear), on the
      # DURABLE host dir gremion-migration-dump (deploy step 5) and bootstrap.sh
      # use, mounted at the SAME path: the host tool and this one-shot share one
      # ledger, and the dump survives the --rm container and is not counted
      # against the 512M limit (a tmpfs would be both lost and charged). The
      # dir must be 0700 and owned by the image's uid (node, 1000) -- the dump
      # code refuses anything else; bootstrap creates it for the deploy user.
      # create_host_path: false -- a missing dir fails the run instead of being
      # created root-owned (which the dump code would then refuse).
      - type: bind
        source: ${GREMION_MIGRATION_DUMP_DIR:?GREMION_MIGRATION_DUMP_DIR required}
        target: ${GREMION_MIGRATION_DUMP_DIR:?GREMION_MIGRATION_DUMP_DIR required}
        bind:
          create_host_path: false
      - ${TENANT_SECRETS_DIR:-./secrets/tenants}:/run/secrets/tenants:ro
    networks:
      state:
        aliases: ["kernel-api-migrate-${COLOUR:?COLOUR required}"]

# ============================================================
# Networks
# ============================================================
networks:
  # The two stack-scoped externals bootstrap.sh stage_networks creates. The
  # KEY is a fixed local alias (compose validates keys before interpolating);
  # name: carries the identity.
  edge:
    external: true
    name: ${STACK:?STACK required}_edge
  state:
    external: true
    name: ${STACK:?STACK required}_state
  # Project-scoped: realised as ${STACK}-app-${COLOUR}_app, the third entry of
  # gremion-deploy's assert_stack_isolation allowed set. Subnets per colour
  # from state.env's APP_BLUE_* / APP_GREEN_* (gremion-init-secrets).
  app:
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${APP_V4_SUBNET:?APP_V4_SUBNET required}
        - subnet: ${APP_V6_SUBNET:?APP_V6_SUBNET required}

# ============================================================
# Volumes — EXTERNAL only (TRD-038)
# ============================================================
# A colour owns no persisted data: both colours mount the same two
# stack-scoped volumes, created once by bootstrap.sh stage_networks (and by
# `make up` in dev), never by compose -- so no `down -v` of a colour can
# take them, and a blue -> green switch leaves every state volume untouched.
volumes:
  config-data:
    external: true
    name: ${STACK:?STACK required}_config_data
  tenant-config-data:
    external: true
    name: ${STACK:?STACK required}_tenant_config_data
  # TASK-024: tenant-create only. Seeds (0600, per-module subtree) and the
  # public-key accounts file; both created by bootstrap.sh stage_networks.
  nats-accounts:
    external: true
    name: ${STACK:?STACK required}_nats_accounts
  nats-secrets:
    external: true
    name: ${STACK:?STACK required}_nats_secrets
