# Bare-Traefik prototype for spikes S10 and S11.
#
#   S10  a loopback-only `internaltest` entrypoint reaches the INACTIVE colour
#        while the public entrypoint reaches the ACTIVE one.
#   S11  per-tenant routers written as file-provider files stay live when the
#        colour containers carry `traefik.enable=false` and every middleware they
#        chain is declared on the Traefik container's own labels.
#
# The stubs serve two paths: /healthz (static, byte-stable) and /whoami (echoes
# the X-Forwarded-Host Traefik forwarded). /whoami is what the prototype points
# VERIFY_MARKER_PATH at, because it plays the role spec B's real /healthz plays on
# a live host: byte-stable per host AND a function of the host the edge resolved.
# A static /healthz here would make the host-pin drill unfalsifiable — which is
# exactly what gremion-verify's marker-discrimination assertion refuses.
#
# EVERY `$` in the stub commands is doubled. Compose interpolates `$VAR` in the
# YAML before the container ever sees it, so a single-dollar `$http_x_forwarded_host`
# is replaced with the empty string and /whoami then answers the SAME bytes for
# every host. That is precisely the vacuous marker gremion-verify refuses, so the
# mistake does not fail quietly — it fails the prototype — but it is worth not
# making: `docker compose config` shows the interpolated text.
#
# Every container carries an explicit container_name under the checkout-unique
# project ${EDGEPROTO_PROJECT} (edgeproto-<sha8>, see edge-proto.sh), because the
# driver tears down BY NAME — `docker rm -f` of exactly these three and
# `docker network rm` of ${EDGEPROTO_PROJECT}_edge — and never runs a
# `compose down`, which under a shared project name reached other checkouts.
#
# Driven only by test/host/integration/edge-proto.sh, which writes .proto-root/
# (env file, dynamic directory, certificates) and removes it again. This is a
# throwaway test fixture, not part of any production composition: images carry
# tags rather than digests and Traefik reads the docker socket directly instead of
# through the socket proxy.
services:
  traefik:
    container_name: "${EDGEPROTO_PROJECT}-traefik"
    image: traefik:v3.7
    restart: "no"
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${EDGE_BIND_IP}:${EDGE_HTTP_PORT}:80"
      - "${EDGE_BIND_IP}:${EDGE_HTTPS_PORT}:443"
      - "${EDGE_BIND_IP}:${INTERNALTEST_PORT}:8081"
      - "${EDGE_BIND_IP}:${TRAEFIK_API_PORT}:8080"
    volumes:
      # The STATIC configuration is mounted from the throwaway root, not from the
      # tracked ./traefik.yml beside it: the driver copies the tracked file there
      # at start-up and the acme-red drill rewrites the COPY (it removes the ACME
      # resolver, which is the only way to make the challenge path shadowable —
      # see edge-proto.sh:red_acme). A drill that edited the tracked fixture in
      # place would leave the repository dirty whenever it was interrupted.
      - ./.proto-root/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./.proto-root/etc/edge:/etc/traefik/dynamic:ro
      - ./.proto-root/etc/edge-certs:/etc/traefik/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      edge:
        aliases: ["traefik"]
    labels:
      traefik.enable: "true"
      traefik.http.services.traefik.loadbalancer.server.port: "8080"
      # traefik.enable=true (needed so the docker provider reads the middleware
      # labels below) with NO router label makes Traefik GENERATE a default
      # router, Host(`<container name>`) on EVERY entrypoint: public, unpinned,
      # no certresolver. gremion-verify's router universal names it
      # (measured 2026-09-25: "router traefik-<project>@docker: no
      # certresolver", "0 host pins"). Declaring one explicit router stops the
      # default one; it lives on the loopback internaltest entrypoint only and
      # answers with noop@internal.
      traefik.http.routers.traefik.entrypoints: "internaltest"
      traefik.http.routers.traefik.rule: "Host(`traefik.invalid`)"
      traefik.http.routers.traefik.service: "noop@internal"
      # The PLATFORM middlewares, on the Traefik container's own labels (spec B
      # B-09): exactly the set @gremion/edge-routers platformMiddlewareLabels()
      # states for apex example.org / sales sales.example.org —
      # packages/edge-routers/test/edge-proto-fixture.test.ts asserts every
      # key and value. The PER-TENANT pins and per-IP caps are not here: they
      # live in each tenant's emitted file (dynamic/tenant-*.yml).
      traefik.http.middlewares.edge-hostpin-apex.headers.customrequestheaders.X-Forwarded-Host: "example.org"
      traefik.http.middlewares.edge-hostpin-www.headers.customrequestheaders.X-Forwarded-Host: "www.example.org"
      traefik.http.middlewares.edge-hostpin-control.headers.customrequestheaders.X-Forwarded-Host: "control.example.org"
      traefik.http.middlewares.edge-hostpin-sales.headers.customrequestheaders.X-Forwarded-Host: "sales.example.org"
      traefik.http.middlewares.edge-hsts-platform.headers.stsseconds: "31536000"
      traefik.http.middlewares.edge-hsts-platform.headers.stsincludesubdomains: "true"
      traefik.http.middlewares.edge-hsts-platform.headers.stspreload: "false"
      traefik.http.middlewares.edge-hsts-custom.headers.stsseconds: "31536000"
      traefik.http.middlewares.edge-hsts-custom.headers.stsincludesubdomains: "false"
      traefik.http.middlewares.edge-hsts-custom.headers.stspreload: "false"
      traefik.http.middlewares.edge-ratelimit-app.ratelimit.average: "300"
      traefik.http.middlewares.edge-ratelimit-app.ratelimit.burst: "100"
      traefik.http.middlewares.edge-ratelimit-app.ratelimit.period: "1m"
      traefik.http.middlewares.edge-ratelimit-app.ratelimit.sourcecriterion.ipstrategy.depth: "0"
      traefik.http.middlewares.edge-ratelimit-portal.ratelimit.average: "100"
      traefik.http.middlewares.edge-ratelimit-portal.ratelimit.burst: "50"
      traefik.http.middlewares.edge-ratelimit-portal.ratelimit.period: "1m"
      traefik.http.middlewares.edge-ratelimit-portal.ratelimit.sourcecriterion.ipstrategy.depth: "0"
      traefik.http.middlewares.edge-ratelimit-auth.ratelimit.average: "30"
      traefik.http.middlewares.edge-ratelimit-auth.ratelimit.burst: "10"
      traefik.http.middlewares.edge-ratelimit-auth.ratelimit.period: "1m"
      traefik.http.middlewares.edge-ratelimit-auth.ratelimit.sourcecriterion.ipstrategy.depth: "0"
      # TASK-043c (Qc3): the interim proxy-trust stamp every tenant APP router
      # chains last (production: docker-compose.prod.yml, value from
      # TENANT_PROXY_SHARED_SECRET). A dummy value here, never a secret.
      traefik.http.middlewares.gremion-ui-proxytrust.headers.customrequestheaders.x-proxy-trust: "edgeproto-dummy-not-a-secret"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: "5s"
      timeout: "3s"
      retries: 12

  stub-blue:
    container_name: "${EDGEPROTO_PROJECT}-stub-blue"
    image: nginx:1.29-alpine
    restart: "no"
    environment:
      STUB_COLOUR: "blue"
    volumes:
      - ./stub/index.html:/seed/index.html:ro
    networks:
      edge:
        aliases: ["gremion-ui-blue", "gremion-public-blue"]
    labels:
      traefik.enable: "false"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        sed "s/__COLOUR__/$$STUB_COLOUR/g" /seed/index.html > /usr/share/nginx/html/index.html
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 3000;
          location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }
          location = /whoami  { add_header Content-Type text/plain; return 200 "colour=__COLOUR__ xfh=$$http_x_forwarded_host trust=$$http_x_proxy_trust\n"; }
          location / { root /usr/share/nginx/html; index index.html; }
        }
        CONF
        sed -i "s/__COLOUR__/$$STUB_COLOUR/g" /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/healthz"]
      interval: "5s"
      timeout: "3s"
      retries: 12

  stub-green:
    container_name: "${EDGEPROTO_PROJECT}-stub-green"
    image: nginx:1.29-alpine
    restart: "no"
    environment:
      STUB_COLOUR: "green"
    volumes:
      - ./stub/index.html:/seed/index.html:ro
    networks:
      edge:
        aliases: ["gremion-ui-green", "gremion-public-green"]
    labels:
      traefik.enable: "false"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        sed "s/__COLOUR__/$$STUB_COLOUR/g" /seed/index.html > /usr/share/nginx/html/index.html
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 3000;
          location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }
          location = /whoami  { add_header Content-Type text/plain; return 200 "colour=__COLOUR__ xfh=$$http_x_forwarded_host trust=$$http_x_proxy_trust\n"; }
          location / { root /usr/share/nginx/html; index index.html; }
        }
        CONF
        sed -i "s/__COLOUR__/$$STUB_COLOUR/g" /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/healthz"]
      interval: "5s"
      timeout: "3s"
      retries: 12

# Project-scoped, no `name:` — §E. The subnet is pinned so traefik.yml can trust
# it by CIDR; it is the prototype's own range and appears nowhere in production.
networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: "10.90.250.0/24"
