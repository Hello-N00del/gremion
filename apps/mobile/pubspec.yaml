name: stura
description: StuRaOS mobile app — Android & iOS

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.29.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Auth
  flutter_appauth: ^7.0.0
  flutter_secure_storage: ^9.2.0
  local_auth: ^2.3.0

  # Matrix (SDK v6 — B1: HiveCollectionsDatabase removed; B2: flutter_olm removed)
  matrix: ^6.2.0
  flutter_vodozemac: ^0.5.0         # replaces flutter_olm (B2)
  flutter_openssl_crypto: ^0.5.0    # required by flutter_vodozemac (B2)
  sqflite: ^2.3.3                   # sqflite_common types; transitive of matrix (B1)
  # #245: encrypt the Matrix SQLite DB at rest with SQLCipher. Bundles
  # SQLCipher natively on Android/iOS (no separate sqlcipher_flutter_libs
  # needed for the mobile sqflite path). Exact pin (SDK floor stays >=3.3.0,
  # inside our declared >=3.6.0) per the repo's supply-chain-hygiene pinning
  # convention (cf. path / firebase_messaging). Provides a sqflite_common
  # Database that MatrixSdkDatabase.init accepts (documented path).
  sqflite_sqlcipher: 3.3.0

  # State + routing
  provider: ^6.1.0
  go_router: ^17.2.3               # updated from ^14.6.0 — no StatefulShellRoute breaking changes (goBranch deprecated → use branches param)

  # Push notifications
  firebase_core: ^4.7.0             # direct dep — required by firebase_messaging
  firebase_messaging: 16.0.4        # EXACT pin — 16.1.x has active iOS crash bug (issue #18110, open 2026-03-27; do NOT change to ^16.0.4) (B4)
  flutter_local_notifications: ^18.0.0
  unifiedpush: ^6.2.0
  device_info_plus: ^12.4.0

  # Files
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  path_provider: ^2.1.0

  # Networking
  # uni_links removed — flutter_appauth handles HTTPS App Link / Universal Link callback internally
  http: ^1.2.0
  jose: ^0.3.4             # JWKS-based JWT signature verification (H-4)
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5

  # Filesystem path manipulation (G-049 — promoted from transitive to direct)
  # Exact pin (no caret) per Wave 3c policy on supply-chain hygiene (A-006).
  path: 1.9.1

  # Persistence (hive_flutter removed — sqflite moved to Matrix section above)
  shared_preferences: ^2.3.2

  # UI
  flutter_svg: ^2.0.10
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/splash/

  # v4 re-audit slice 9 — bundle the design fonts so the GremionTokens font
  # families actually resolve (previously none were bundled → platform
  # fallback). Single variable-axis (wght) .ttf per family; Flutter maps
  # FontWeight onto the wght axis. Display face = Archivo Narrow, matching the
  # web slice-1 --font-display fix (was the never-loaded "Outfit").
  fonts:
    - family: Archivo Narrow
      fonts:
        - asset: assets/fonts/ArchivoNarrow.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
