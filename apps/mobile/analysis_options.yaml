include: package:flutter_lints/flutter.yaml

analyzer:
  # G-090: opt into Dart's strict type modes so latent dynamic-typing,
  # raw-generic, and inference-loss bugs surface at analyze time rather than
  # at runtime. See https://dart.dev/tools/analysis#enabling-additional-type-checks.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - lib/tokens/app_tokens.dart  # generated file

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_final_fields: true
    use_super_parameters: true
    unnecessary_null_checks: true
    avoid_unnecessary_containers: true
    prefer_single_quotes: true
