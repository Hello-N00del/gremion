# infra/hardening/values.yaml
# Single source of truth for hardening config.
# Run `make -C infra/hardening hardening-config` after editing to regenerate
# docker-compose and K8s outputs.

retention:
  # Values mirror RETENTION_DEFAULTS in gremion-ui/src/lib/retention-tiers.ts;
  # caps follow RETENTION_CAPS under the operator ceiling of 30 days [D R29-I6].
  access_logs_days: 14        # Tier 1 — hard cap 29 (30 d ceiling minus the daily purge tick)
  app_logs_days: 28           # Tier 2 — hard cap 29
  security_logs_days: 27      # Tier 3 — hard cap 29
  security_nopii_logs_days: 27 # Tier 4 — hard cap 30 (no purge tick, operator value R31-I4a)

backup:
  local_retention_days: 30
  remote_retention_days: 365
  financial_retention_days: 3650  # 10 years (HGB §257 / AO §147)
  cron_start: "0 2 * * *"         # 02:00 UTC daily chain start
  restic_check_subset: "10%"

ipcrypt:
  rotation_days: 14
