##############################################################
# docker-compose.prod.yml
#
# Production-only overrides — NOT auto-loaded.
# Load explicitly when deploying to production:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds port mappings for services where the base docker-compose.yml
# intentionally omits them (Docker Compose merges port lists, so
# putting environment-specific ranges in the base would pollute
# every environment — including Windows local dev where the large
# UDP ranges fall in the reserved ephemeral zone 49152-65535).
#
# Also wires Traefik path routing for the core services (Phase 0).
# Base docker-compose.yml defines NO labels for these services, so
# these labels are purely additive (no Compose label-merge conflict).
# TLS is the Cloudflare Origin Certificate served by Traefik's file
# provider (docker/traefik/dynamic/tls.yml) — `tls=true`, no resolver.
##############################################################

services:

  # ----------------------------------------------------------
  # P2.1b T11 (#202): pin max_connections to the exact value the app's
  # connection-budget invariant asserts (MAX_CONNECTIONS in
  # gremion-ui/src/lib/server/db/pool-registry.ts, unit-tested) so the budget
  # reflects runtime reality instead of relying on the image default
  # (postgres:18-alpine also defaults to 100 — this pin makes the contract
  # explicit and survives image-default changes).
  # NOTE: `command` only takes effect on container RECREATE, not restart.
  # Runtime verification deferred to S4 — docs/runbooks/pgbouncer.md.
  # ----------------------------------------------------------
  postgres:
    command: ["postgres", "-c", "max_connections=100"]

  # ----------------------------------------------------------
  # P2.1b T11 (#202, tenancy D4): PgBouncer — transaction-pooling front
  # for the app's data-plane connections. gremion-ui's DATABASE_URL (below)
  # points here in production; dev/CI keep the direct postgres URL from
  # the base file. Config: docker/pgbouncer/pgbouncer.ini; auth =
  # scram-sha-256 + auth_query (docker/pgbouncer/pgbouncer-auth.sql);
  # userlist.txt is rendered from userlist.txt.example at deploy
  # (gitignored). Deploy/verify/rollback: docs/runbooks/pgbouncer.md
  # (runtime verification deferred to S4 — deploy freeze).
  # ----------------------------------------------------------
  pgbouncer:
    # G-037: externally-pulled image digest-pinned (PgBouncer 1.25.2).
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    restart: unless-stopped
    healthcheck:
      # TASK-036 (TRD-178): BusyBox nc (measured present at the pinned digest)
      # sends the PostgreSQL SSLRequest packet (length 8, code 80877103) to the
      # pooler's own listen_port (6432, docker/pgbouncer/pgbouncer.ini) and
      # requires a protocol answer, 'S' or 'N' (measured: 'N'). A bare TCP
      # connect cannot tell "port bound" from "pooler speaking Postgres". Octal
      # escapes, because BusyBox printf does not guarantee \xHH.
      test: ["CMD-SHELL", "printf '\\000\\000\\000\\010\\004\\322\\026\\057' | nc -w 3 127.0.0.1 6432 | head -c 1 | grep -q '[SN]'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gremion-net

  # ----------------------------------------------------------
  # Core service path routing (Phase 0).
  # Apex host ${DOMAIN}; gremion-ui catch-all at priority 10.
  # ----------------------------------------------------------

  keycloak:
    # Keycloak sits behind Traefik (TLS termination) + Cloudflare. Trust the
    # X-Forwarded-* headers so Keycloak emits https:// issuer/endpoint URLs
    # instead of http:// — otherwise OIDC iss-claim validation fails.
    environment:
      KC_PROXY_HEADERS: xforwarded
      # Theme static resources get a SHORT max-age so a CDN (Cloudflare) can't
      # pin an edited login theme for 30 days. Keycloak serves theme assets under
      # a fixed /resources/<resourceVersion>/ URL whose version does NOT change
      # when you edit a theme file, so the default 30-day immutable-style cache
      # makes edits invisible behind a CDN until a manual purge. 60s keeps a tiny
      # cache while letting theme changes propagate on the next request.
      KC_SPI_THEME_STATIC_MAX_AGE: "60"
      # G-080: internal TLS listener on :8443 with the internal-CA-signed cert
      # (SAN keycloak,localhost,127.0.0.1) minted by gen-internal-ca.sh. Server-
      # to-server callers (gremion-ui) reach KC at https://keycloak:8443 and trust
      # the internal CA. The plain :8080 listener stays for the Traefik edge hop,
      # which arrives with X-Forwarded-Proto=https (KC_PROXY_HEADERS above) and so
      # satisfies sslRequired=all. The realm itself is pinned to sslRequired=all
      # by buildTenantRealmDoc when tenant-create composes it (B-01: the
      # KC_REALM_SSL_REQUIRED compose knob and the boot import that read it are
      # both deleted).
      KC_HTTPS_CERTIFICATE_FILE:     /opt/keycloak/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak.key
    volumes:
      # G-080: internal CA + KC server cert for the :8443 listener (git-ignored).
      - ./docker/keycloak/certs:/opt/keycloak/certs:ro
    labels:
      - "traefik.enable=true"
      # G-082 (Mediums Cluster 4 / T2.1): the public-facing Keycloak surface
      # is split into TWO routers so /auth/admin can sit behind an IP
      # allowlist while end-user OIDC flows stay open to the world.
      #
      # Match ONLY Keycloak's own path namespaces, not all of /auth. The
      # gremion-ui app (Auth.js) owns /auth/login, /auth/signin, /auth/callback,
      # /auth/session etc. on the same host; a broad PathPrefix(/auth) router
      # would shadow them and every app login hit Keycloak's 404 page.
      #
      # PUBLIC router — OIDC discovery, JWKS, login/callback flows, branded
      # account console, account-recovery emails. No /auth/admin here.
      # TASK-041 (TRD-074): Host-literal on the apex only. The wildcard tenant
      # leg is gone with whole-host resolution; per-host Keycloak routing for a
      # customer primary host (its issuer host, spec B section T.2) is the named
      # carry-over to TASK-034 / TASK-043 (TASK-041 Q6).
      - "traefik.http.routers.keycloak.rule=Host(`${DOMAIN}`) && (PathPrefix(`/auth/realms`) || PathPrefix(`/auth/resources`) || PathPrefix(`/auth/js`))"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.priority=100"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      # ADMIN router — Keycloak admin console + Admin REST API. Protected by
      # the kc-admin-allowlist IPAllowList middleware below.
      #
      # KC_ADMIN_ALLOWLIST_CIDRS defaults to 127.0.0.1/32 in .env, so by
      # default no external request matches — the admin path returns 403
      # from public ingress and operators reach the console via
      # `docker compose exec keycloak /opt/keycloak/bin/kcadm.sh ...` or
      # `kubectl port-forward`. To allow a bastion / VPN, set
      # KC_ADMIN_ALLOWLIST_CIDRS to a comma-separated CIDR list
      # (e.g. "203.0.113.10/32,198.51.100.0/24") in .env on the prod host.
      # TASK-041: Host-literal on the apex, like the public router; the
      # kc-admin-allowlist IPAllowList still gates every match.
      - "traefik.http.routers.keycloak-admin.rule=Host(`${DOMAIN}`) && PathPrefix(`/auth/admin`)"
      - "traefik.http.routers.keycloak-admin.entrypoints=websecure"
      - "traefik.http.routers.keycloak-admin.tls=true"
      - "traefik.http.routers.keycloak-admin.priority=110"
      - "traefik.http.routers.keycloak-admin.service=keycloak"
      - "traefik.http.routers.keycloak-admin.middlewares=kc-admin-allowlist"
      - "traefik.http.middlewares.kc-admin-allowlist.ipallowlist.sourcerange=${KC_ADMIN_ALLOWLIST_CIDRS:-127.0.0.1/32}"

  legal:
    labels:
      - "traefik.enable=true"
      # /legal is now served by gremion-ui — the v4 config-driven legal pages
      # (config.legal.*_html, edited via Settings → Rechtliches) rendered by the
      # gremion-ui apex catch-all router (priority 10). The static `legal` nginx no
      # longer has a /legal router; it is retained for the legal/imprint pages and
      # is reached internally by gremion-ui. (v4 re-audit slice 7.)
      # A-021 wave 2: legal nginx serves on :8080 (non-root).
      - "traefik.http.services.legal.loadbalancer.server.port=8080"

  gremion-ui:
    environment:
      # TASK-028 (spec B section 6, TRD-039): the app's DOMAIN is bound ONCE,
      # here, from the one key the host env files carry. `:?` aborts the whole
      # render -- every `docker compose` verb, before any container is created
      # -- when PLATFORM_DOMAIN is unset or empty. The app key stays DOMAIN (no
      # `?? DOMAIN` fallback). NOT yet covered: the Traefik rules and
      # gremion-public's ORIGIN below still interpolate the host variable
      # ${DOMAIN}, which the host templates do not carry; rewriting those
      # default-less uses to this expression is TASK-040's (B15 Tasks 5-10).
      DOMAIN: ${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      # Keep dev *_seed.sql migrations out of production — they insert test
      # committees/members keyed by dev-only Keycloak UUIDs.
      GREMION_DISABLE_SEEDS: "true"
      # G-080: trust the internal CA so undici (global fetch) + jose
      # (createRemoteJWKSet) verify the keycloak:8443 cert. NODE_EXTRA_CA_CERTS
      # ADDS to Node's built-in roots, so public TLS (the apex host) still works.
      NODE_EXTRA_CA_CERTS: /etc/ssl/internal/internal-ca.pem
      # P2.1b T11 (#202): the app's data-plane connections go through
      # PgBouncer (transaction pooling, pgbouncer:6432) instead of raw
      # postgres:5432 — overrides the base-file URL; dev/CI are unchanged.
      # Remember the compose-env lesson: this only lands on the container
      # via `up -d --force-recreate gremion-ui`, never plain `restart`.
      # Deploy/verify/rollback: docs/runbooks/pgbouncer.md (S4).
      DATABASE_URL: postgresql://${GREMION_DB_USER:-gremion}:${GREMION_DB_PASSWORD}@pgbouncer:6432/${GREMION_DB_NAME:-gremion}
      # P2.1c T1 (#202) D-CONTROLDIRECT: CONTROL_DATABASE_URL is deliberately
      # NOT overridden here — production inherits the base-file value, which
      # targets postgres:5432 DIRECTLY. The control plane must never be
      # re-pointed through PgBouncer (it is the direct "+ control" term in
      # P2.1b's connection budget; registry reads are cached). Do not add a
      # CONTROL_DATABASE_URL key to this overlay.
      # P2.1c T5 (#202): the APP reads TENANT_PROXY_SHARED_SECRET to enforce the
      # proxy-trust gate (resolve.ts isProxyTrusted). It MUST equal the value the
      # gremion-ui-proxytrust Traefik middleware (below) injects — both interpolate
      # the same .env var. Without this env line the middleware stamps an
      # x-proxy-trust header the app never checks, so the gate is a silent no-op
      # even with the secret set (found during the S4 deploy).
      TENANT_PROXY_SHARED_SECRET: ${TENANT_PROXY_SHARED_SECRET:-}
      # Per-tenant origin (#202 multi-tenant CSRF fix): the base file leaves
      # ORIGIN unset so adapter-node derives the origin from the REAL inbound
      # Host header (preserved per-tenant by Traefik passHostHeader), making
      # event.url.origin == the tenant's own host. That fixes the SvelteKit CSRF
      # 403 that previously blocked every non-default tenant's SSO/form POST and
      # gives Auth.js per-tenant signin/callback URLs. PROTOCOL_HEADER forces the
      # scheme to https from Traefik's x-forwarded-proto (TLS terminates at the
      # edge; the backend hop is plaintext, so without this the origin would be
      # http:// and still mismatch the browser's https Origin).
      PROTOCOL_HEADER: x-forwarded-proto
    volumes:
      # G-080: internal CA trust anchor (git-ignored; minted by
      # docker/keycloak/certs/gen-internal-ca.sh before bringing up the stack).
      - ./docker/keycloak/certs/internal-ca.pem:/etc/ssl/internal/internal-ca.pem:ro
    labels:
      - "traefik.enable=true"
      # TASK-041 (L3-08; TRD-074/075): a request is resolved by its WHOLE host
      # (tenant_domain.host). This router matches the apex literally; Traefik
      # forwards the ORIGINAL Host as X-Forwarded-Host and the resolver looks
      # it up whole. The apex binds no tenant (TRD-075), so it 404s until a
      # customer router exists (TASK-034 renders one Host-literal router per
      # customer host, with the X-Forwarded-Host pin). No wildcard leg and no
      # injected default host: scripts/check-edge-host-model.mjs (make
      # lint-edge-host) keeps both from coming back.
      - "traefik.http.routers.gremion-ui.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.gremion-ui.entrypoints=websecure"
      - "traefik.http.routers.gremion-ui.tls=true"
      - "traefik.http.routers.gremion-ui.priority=10"
      - "traefik.http.services.gremion-ui.loadbalancer.server.port=3000"
      # P2.1c T5 (#202): executable proxy-trust. The edge stamps a shared-secret
      # x-proxy-trust header on EVERY request reaching gremion-ui; the tenant
      # resolver (resolve.ts isProxyTrusted) 403s any request lacking it once
      # TENANT_PROXY_SHARED_SECRET is set — so x-forwarded-host trust no longer
      # rests on topology alone. Applied to the gremion-ui router (and to every
      # customer router TASK-034 renders). Unset secret = the resolver gate is
      # a no-op (S4 sets env + this label together). The header is set
      # (overwriting any client value), not merely added.
      - "traefik.http.middlewares.gremion-ui-proxytrust.headers.customrequestheaders.x-proxy-trust=${TENANT_PROXY_SHARED_SECRET}"
      # PR-C (reboot-404): when gremion-ui is down/unhealthy (cold start, crash
      # loop) Traefik would otherwise return a raw 5xx/404. The errors
      # middleware intercepts 502-504 and serves the static "starting" fallback
      # service instead, so a cold start shows a friendly auto-refreshing page.
      - "traefik.http.routers.gremion-ui.middlewares=gremion-ui-proxytrust,gremion-ui-starting"
      - "traefik.http.middlewares.gremion-ui-starting.errors.status=502-504"
      - "traefik.http.middlewares.gremion-ui-starting.errors.service=fallback"
      - "traefik.http.middlewares.gremion-ui-starting.errors.query=/"

  # ----------------------------------------------------------
  # PR-C (reboot-404): static "starting" fallback. A low-priority (1)
  # apex router that gremion-ui (priority 10) normally shadows; it only
  # serves traffic the gremion-ui-starting errors middleware redirects to
  # it (502-504) — i.e. when gremion-ui is mid-cold-start or crash-looping.
  # Replaces a raw Traefik 404/5xx with a friendly auto-refreshing page.
  # ----------------------------------------------------------
  fallback:
    profiles: [production]
    build:
      context: ./docker/fallback
      dockerfile: Dockerfile
    image: ghcr.io/hello-n00del/gremion-fallback:latest
    restart: unless-stopped
    healthcheck:
      # TASK-036 (TRD-178): nginx:alpine ships BusyBox wget. The probe asserts
      # the marker in the served page (docker/fallback/index.html line 2), not
      # just a 200 -- the try_files rule answers 200 even for an empty root.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q gremion-fallback"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gremion-net
    labels:
      - "traefik.enable=true"
      # TASK-041: Host-literal on the apex. A customer host keeps the starting
      # page only through a router that chains gremion-ui-starting (the errors
      # middleware), not through a wildcard leg here. Priority stays 1.
      - "traefik.http.routers.fallback.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.fallback.entrypoints=websecure"
      - "traefik.http.routers.fallback.tls=true"
      - "traefik.http.routers.fallback.priority=1"
      - "traefik.http.routers.fallback.service=fallback"
      - "traefik.http.services.fallback.loadbalancer.server.port=80"
