##############################################################
# docker-compose.prod.yml
#
# Production-only overrides for the STATE project — NOT auto-loaded. On a
# host, state.env's COMPOSE_FILE names it:
#
#   docker compose --env-file /opt/gremion/etc/env/state.env <verb>
#
# (docker-compose.yml : docker-compose.prod.yml : docker-compose.state-pins.yml,
# the state project's own release pins layer; the app layer
# docker-compose.pins.yml is the colour projects').
# The app tier (gremion-ui, gremion-public) is NOT overlaid here any more:
# it is docker-compose.app.yml, one project per colour, reached only through
# etc/edge/active.yml (TASK-040). No router or middleware label here names
# an app-tier container.
#
# Every docker-routed service here carries
# traefik.docker.network=${STACK}_edge: the provider-wide network key is gone
# from docker/traefik/traefik.yml, and a container on more than one network
# (keycloak: _edge + _state) must name the one Traefik reaches it on.
##############################################################

services:

  # ----------------------------------------------------------
  # P2.1b T11 (#202): pin max_connections to the exact value the app's
  # connection-budget invariant asserts (MAX_CONNECTIONS in
  # gremion-ui/src/lib/server/db/pool-registry.ts, unit-tested) so the budget
  # reflects runtime reality instead of relying on the image default
  # (postgres:18-alpine also defaults to 100 — this pin makes the contract
  # explicit and survives image-default changes).
  # NOTE: `command` only takes effect on container RECREATE, not restart.
  # Runtime verification deferred to S4 — docs/runbooks/pgbouncer.md.
  # ----------------------------------------------------------
  postgres:
    command: ["postgres", "-c", "max_connections=100"]

  # ----------------------------------------------------------
  # P2.1b T11 (#202, tenancy D4): PgBouncer — transaction-pooling front
  # for the app's data-plane connections. The app tier's DATABASE_URL
  # (docker-compose.app.yml) points at pgbouncer-${STACK}:6432; the control
  # plane stays direct on postgres. Config: docker/pgbouncer/pgbouncer.ini;
  # auth = scram-sha-256 + auth_query (docker/pgbouncer/pgbouncer-auth.sql);
  # userlist.txt is rendered from userlist.txt.example at deploy
  # (gitignored). Deploy/verify/rollback: docs/runbooks/pgbouncer.md
  # (runtime verification deferred to S4 — deploy freeze).
  # ----------------------------------------------------------
  pgbouncer:
    # G-037: externally-pulled image digest-pinned (PgBouncer 1.25.2).
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    restart: unless-stopped
    healthcheck:
      # TASK-036 (TRD-178): BusyBox nc (measured present at the pinned digest)
      # sends the PostgreSQL SSLRequest packet (length 8, code 80877103) to the
      # pooler's own listen_port (6432, docker/pgbouncer/pgbouncer.ini) and
      # requires a protocol answer, 'S' or 'N' (measured: 'N'). A bare TCP
      # connect cannot tell "port bound" from "pooler speaking Postgres". Octal
      # escapes, because BusyBox printf does not guarantee \xHH.
      test: ["CMD-SHELL", "printf '\\000\\000\\000\\010\\004\\322\\026\\057' | nc -w 3 127.0.0.1 6432 | head -c 1 | grep -q '[SN]'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    networks:
      state:
        # <service>-<stack>, like postgres's alias: the app tier's DATABASE_URL
        # names the stack it targets.
        aliases: ["pgbouncer-${STACK:?STACK required}"]

  # ----------------------------------------------------------
  # Core service path routing (Phase 0).
  # Apex host PLATFORM_DOMAIN, the one domain key the host env templates
  # carry: every Host rule reads it `:?`-guarded (TASK-028's binding, the
  # B15 rewrite handed to TASK-040), so an unset key aborts the render
  # instead of rendering Host(``). The gremion-ui routers left with the app
  # tier (TASK-040): the apex and tenant hosts are routed by the edge's file
  # provider / TASK-034's labels, never by a docker label on a colour.
  # ----------------------------------------------------------

  keycloak:
    # Keycloak sits behind Traefik (TLS termination). Trust the
    # X-Forwarded-* headers so Keycloak emits https:// issuer/endpoint URLs
    # instead of http:// — otherwise OIDC iss-claim validation fails.
    environment:
      KC_PROXY_HEADERS: xforwarded
      # Theme static resources get a SHORT max-age so a cache can't pin an
      # edited login theme for 30 days. Keycloak serves theme assets under
      # a fixed /resources/<resourceVersion>/ URL whose version does NOT change
      # when you edit a theme file, so the default 30-day immutable-style cache
      # makes edits invisible until a manual purge. 60s keeps a tiny
      # cache while letting theme changes propagate on the next request.
      KC_SPI_THEME_STATIC_MAX_AGE: "60"
      # G-080: internal TLS listener on :8443 with the internal-CA-signed cert
      # (SAN keycloak,localhost,127.0.0.1) minted by gen-internal-ca.sh. Server-
      # to-server callers (gremion-ui) reach KC at https://keycloak:8443 and trust
      # the internal CA. The plain :8080 listener stays for the Traefik edge hop,
      # which arrives with X-Forwarded-Proto=https (KC_PROXY_HEADERS above) and so
      # satisfies sslRequired=all. The realm itself is pinned to sslRequired=all
      # by buildTenantRealmDoc when tenant-create composes it (B-01: the
      # KC_REALM_SSL_REQUIRED compose knob and the boot import that read it are
      # both deleted).
      KC_HTTPS_CERTIFICATE_FILE:     /opt/keycloak/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak.key
    volumes:
      # G-080: internal CA + KC server cert for the :8443 listener (git-ignored).
      - ./docker/keycloak/certs:/opt/keycloak/certs:ro
    labels:
      - "traefik.enable=true"
      # keycloak is on ${STACK}_edge AND ${STACK}_state: Traefik must reach it
      # on the edge network, the only one traefik itself is attached to.
      - "traefik.docker.network=${STACK:?STACK required}_edge"
      # G-082 (Mediums Cluster 4 / T2.1): the public-facing Keycloak surface
      # is split into TWO routers so /auth/admin can sit behind an IP
      # allowlist while end-user OIDC flows stay open to the world.
      #
      # Match ONLY Keycloak's own path namespaces, not all of /auth. The
      # gremion-ui app (Auth.js) owns /auth/login, /auth/signin, /auth/callback,
      # /auth/session etc. on the same host; a broad PathPrefix(/auth) router
      # would shadow them and every app login hit Keycloak's 404 page.
      #
      # PUBLIC router — OIDC discovery, JWKS, login/callback flows, branded
      # account console, account-recovery emails. No /auth/admin here.
      # TASK-041 (TRD-074): Host-literal on the apex only. The wildcard tenant
      # leg is gone with whole-host resolution; per-host Keycloak routing for a
      # customer primary host (its issuer host, spec B section T.2) is the named
      # carry-over to TASK-034 / TASK-043 (TASK-041 Q6). The apex reads the one
      # domain key the host env templates carry, `:?`-guarded (TASK-040).
      - "traefik.http.routers.keycloak.rule=Host(`${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}`) && (PathPrefix(`/auth/realms`) || PathPrefix(`/auth/resources`) || PathPrefix(`/auth/js`))"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.priority=100"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      # ADMIN router — Keycloak admin console + Admin REST API. Protected by
      # the kc-admin-allowlist IPAllowList middleware below.
      #
      # KC_ADMIN_ALLOWLIST_CIDRS defaults to 127.0.0.1/32 in .env, so by
      # default no external request matches — the admin path returns 403
      # from public ingress and operators reach the console via
      # `docker compose exec keycloak /opt/keycloak/bin/kcadm.sh ...` or
      # `kubectl port-forward`. To allow a bastion / VPN, set
      # KC_ADMIN_ALLOWLIST_CIDRS to a comma-separated CIDR list
      # (e.g. "203.0.113.10/32,198.51.100.0/24") in .env on the prod host.
      # TASK-041: Host-literal on the apex, like the public router; the
      # kc-admin-allowlist IPAllowList still gates every match.
      - "traefik.http.routers.keycloak-admin.rule=Host(`${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}`) && PathPrefix(`/auth/admin`)"
      - "traefik.http.routers.keycloak-admin.entrypoints=websecure"
      - "traefik.http.routers.keycloak-admin.tls=true"
      - "traefik.http.routers.keycloak-admin.priority=110"
      - "traefik.http.routers.keycloak-admin.service=keycloak"
      - "traefik.http.routers.keycloak-admin.middlewares=kc-admin-allowlist"
      - "traefik.http.middlewares.kc-admin-allowlist.ipallowlist.sourcerange=${KC_ADMIN_ALLOWLIST_CIDRS:-127.0.0.1/32}"

  legal:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK:?STACK required}_edge"
      # /legal is now served by gremion-ui — the v4 config-driven legal pages
      # (config.legal.*_html, edited via Settings → Rechtliches). The static
      # `legal` nginx has no /legal router; it is retained for the
      # legal/imprint pages and is reached internally by gremion-ui over
      # ${STACK}_edge. (v4 re-audit slice 7.)
      # A-021 wave 2: legal nginx serves on :8080 (non-root).
      - "traefik.http.services.legal.loadbalancer.server.port=8080"

  # ----------------------------------------------------------
  # Traefik's own labels: the middlewares every edge router chains. They
  # live on the traefik container — the only container guaranteed to exist
  # whenever a router does (active.yml.tmpl: "no middleware here") — because
  # the app tier they used to sit on is traefik.enable=false now and a colour
  # switch would make them vanish mid-flight. Interim names (TASK-040 Q5:
  # gremion-ui-proxytrust, gremion-ui-starting, public-ratelimit): TASK-034's
  # 34b retires them together with the static routers, the platform host pins
  # and the edge-hostpin-* labels. TASK-043c landed the host-independent
  # edge-* set below (the tenant routers chain it).
  #
  # traefik.enable=true is what makes the docker provider read these labels
  # at all (exposedByDefault: false). A container with no router label gets
  # a DEFAULT router (Host(`<container name>`)) and service; the one explicit
  # router below prevents that: it sits on the unpublished ping entrypoint,
  # matches only a reserved .invalid host (RFC 2606), and serves noop@internal.
  # ----------------------------------------------------------
  traefik:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK:?STACK required}_edge"
      - "traefik.http.routers.edge-labels.rule=Host(`edge-labels.invalid`)"
      - "traefik.http.routers.edge-labels.entrypoints=ping"
      - "traefik.http.routers.edge-labels.service=noop@internal"
      # P2.1c T5 (#202): executable proxy-trust. The edge stamps a shared-secret
      # x-proxy-trust header on EVERY request reaching gremion-ui; the tenant
      # resolver (resolve.ts isProxyTrusted) 403s any request lacking it once
      # TENANT_PROXY_SHARED_SECRET is set. The header is set (overwriting any
      # client value), not merely added. The app reads the same variable
      # (docker-compose.app.yml).
      - "traefik.http.middlewares.gremion-ui-proxytrust.headers.customrequestheaders.x-proxy-trust=${TENANT_PROXY_SHARED_SECRET:-}"
      # PR-C (reboot-404): when gremion-ui is down/unhealthy (cold start, crash
      # loop) Traefik would otherwise return a raw 5xx/404. The errors
      # middleware intercepts 502-504 and serves the static "starting" fallback
      # service instead, so a cold start shows a friendly auto-refreshing page.
      - "traefik.http.middlewares.gremion-ui-starting.errors.status=502-504"
      - "traefik.http.middlewares.gremion-ui-starting.errors.service=fallback"
      - "traefik.http.middlewares.gremion-ui-starting.errors.query=/"
      # The public portal's rate limit (formerly on gremion-public). No
      # sourceCriterion: Traefik is the first hop, so the connection's remote
      # address is the real client (TASK-022; guarded by
      # scripts/check-compose-edge.test.mjs guard 4).
      - "traefik.http.middlewares.public-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.period=1m"
      # TASK-043c (P1): the HOST-INDEPENDENT edge-* set the tenant routers chain
      # (@gremion/edge-routers render.ts). Before this the names existed only in
      # the edge-proto test fixture, so every tenant router reported "middleware
      # edge-ratelimit-app@docker does not exist" and customer hosts 404'd.
      # The values are packages/edge-routers/src/platform-middlewares.ts
      # platformMiddlewareLabels, asserted by
      # packages/edge-routers/test/prod-compose-labels.test.ts and chained-name
      # coverage by scripts/check-compose-edge.test.mjs guard 5. preload is never
      # set; edge-hsts-custom never sends includeSubDomains (a customer's own
      # domain is not this platform's namespace). The platform host pins
      # (edge-hostpin-*) are NOT declared: they stay 34b's, with the static
      # routers that chain them.
      - "traefik.http.middlewares.edge-hsts-platform.headers.stsseconds=31536000"
      - "traefik.http.middlewares.edge-hsts-platform.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.edge-hsts-platform.headers.stspreload=false"
      - "traefik.http.middlewares.edge-hsts-custom.headers.stsseconds=31536000"
      - "traefik.http.middlewares.edge-hsts-custom.headers.stsincludesubdomains=false"
      - "traefik.http.middlewares.edge-hsts-custom.headers.stspreload=false"
      - "traefik.http.middlewares.edge-ratelimit-app.ratelimit.average=300"
      - "traefik.http.middlewares.edge-ratelimit-app.ratelimit.burst=100"
      - "traefik.http.middlewares.edge-ratelimit-app.ratelimit.period=1m"
      - "traefik.http.middlewares.edge-ratelimit-app.ratelimit.sourcecriterion.ipstrategy.depth=0"
      - "traefik.http.middlewares.edge-ratelimit-portal.ratelimit.average=100"
      - "traefik.http.middlewares.edge-ratelimit-portal.ratelimit.burst=50"
      - "traefik.http.middlewares.edge-ratelimit-portal.ratelimit.period=1m"
      - "traefik.http.middlewares.edge-ratelimit-portal.ratelimit.sourcecriterion.ipstrategy.depth=0"
      - "traefik.http.middlewares.edge-ratelimit-auth.ratelimit.average=30"
      - "traefik.http.middlewares.edge-ratelimit-auth.ratelimit.burst=10"
      - "traefik.http.middlewares.edge-ratelimit-auth.ratelimit.period=1m"
      - "traefik.http.middlewares.edge-ratelimit-auth.ratelimit.sourcecriterion.ipstrategy.depth=0"

  # ----------------------------------------------------------
  # PR-C (reboot-404): static "starting" fallback. A low-priority (1)
  # apex router that the app routers normally shadow; it only serves
  # traffic the gremion-ui-starting errors middleware redirects to it
  # (502-504) — i.e. when gremion-ui is mid-cold-start or crash-looping.
  # Replaces a raw Traefik 404/5xx with a friendly auto-refreshing page.
  # ----------------------------------------------------------
  fallback:
    profiles: [production]
    build:
      context: ./docker/fallback
      dockerfile: Dockerfile
    image: ghcr.io/hello-n00del/gremion-fallback:${IMAGE_TAG:-dev}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      # TASK-036 (TRD-178): nginx:alpine ships BusyBox wget. The probe asserts
      # the marker in the served page (docker/fallback/index.html line 2), not
      # just a 200 -- the try_files rule answers 200 even for an empty root.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q gremion-fallback"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${STACK:?STACK required}_edge"
      # TASK-041: Host-literal on the apex. A customer host keeps the starting
      # page only through a router that chains gremion-ui-starting (the errors
      # middleware), not through a wildcard leg here. Priority stays 1.
      - "traefik.http.routers.fallback.rule=Host(`${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}`)"
      - "traefik.http.routers.fallback.entrypoints=websecure"
      - "traefik.http.routers.fallback.tls=true"
      - "traefik.http.routers.fallback.priority=1"
      - "traefik.http.routers.fallback.service=fallback"
      - "traefik.http.services.fallback.loadbalancer.server.port=80"

  # cloudflared is gone (TASK-040 Q11, TASK-036 Q1): it is not in the TRD
  # topology (PRD §10.2 "Edge CDN: none"), and Traefik has been the first hop
  # since TASK-022. docker/cloudflared/origin-ca-root.pem is no longer mounted.
