              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "A container is unhealthy, the log pipeline (vector) is not running, or the host collector stopped"
          component: "{{ $labels.component }}"
      - uid: gremion-cert-expiry
