                    type: gt
                    params: [0]
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Less than 10 percent memory available, or the procfs reading is blind"
          component: "{{ $labels.component }}"
      - uid: gremion-container-unhealthy
        title: ContainerUnhealthy2m
        condition: B
