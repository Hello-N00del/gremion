# compose/observability/grafana/provisioning/alerting/rules.yaml -- the
# Grafana-managed alert rules (TASK-039; TRD-181/182/224, FLOW-OPS-009)
# [D R17-23: Grafana alerting replaces Alertmanager].
#
# One rule per condition. Every rule reads ONE recording rule of
# ../../../prometheus/rules.yml (gremion:cond:<name>, 0 or 1, labelled by
# `component`) and fires on `> 0`; the threshold logic and every absent() arm
# live there, under promtool tests. The title is the alertname; together with
# `component` it is the grouping key of ../alerting/policies.yaml, so one
# breached component is one e-mail.
#
# No data and an evaluation error both ALERT: a recording rule that stopped
# producing, or a Prometheus that does not answer, is not a healthy world.
# Templates are written plainly (`{{ $labels.component }}`): measured on the
# pinned Grafana 12.4.0, alerting provisioning files are NOT environment-
# expanded, and a `$$` stays literal and breaks the template. The README
# carries the rule table; compose/observability/alerting.test.mjs pins every
# field below.
apiVersion: 1

groups:
  - orgId: 1
    name: gremion-ops
    folder: Gremion operations
    interval: 1m
    rules:
      - uid: gremion-disk-above-70
        title: DiskAbove70
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: gremion:cond:disk_above_70
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: Alerting
        execErrState: Alerting
        for: 15m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem above 70 percent, or its byte counts stopped arriving"
          component: "{{ $labels.component }}"
      - uid: gremion-memory-pressure
        title: MemoryPressure
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: gremion:cond:memory_pressure
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
