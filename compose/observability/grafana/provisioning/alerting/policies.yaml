# compose/observability/grafana/provisioning/alerting/policies.yaml -- the
# notification policy (TRD-182, FLOW-OPS-009).
#
# Exactly one deduplicated, grouped e-mail per breached component, and one
# resolve notice when it clears:
#   group_by        [alertname, component]: a second breach of the SAME
#                   component while the group fires adds no e-mail; a breach
#                   of another component is its own group.
#   group_wait      30s: the first notice waits this long for siblings.
#   group_interval  5m: a group that changed is re-notified at most this often.
#   repeat_interval 8760h: an unchanged open condition is not repeated (Q7).
#                   Grafana's embedded Alertmanager keeps its notification log
#                   for a bounded period (about 5 days), so an alert that stays
#                   open longer may be notified again once the log entry has
#                   expired: a named deviation for the operator [A, R16-6].
# The resolve notice is the contact point's (disableResolveMessage: false,
# rendered by render-ops.sh into runtime/ops/grafana-provisioning).
#
# Quiet hours (TRD-205), routes under the root (first match wins):
#   severity = critical    -> platform, NO time interval: always immediate.
#   severity != critical   -> platform, active_time_intervals [active-hours]
#                          (time-intervals.yaml, rendered from ops.env):
#                          outside the window the notification is muted and the
#                          alerts wait in the group; group_by [severity] makes
#                          that ONE digest (singleEmail contact point), sent at
#                          the first group_interval flush after the window
#                          opens (at most 5m after the start of active hours).
#   the root itself is the default route for any alert the matchers miss.
# compose/observability/alerting.test.mjs refuses a shorter repeat, a group_by
# without alertname, and a contact point with resolve notices off.
apiVersion: 1

policies:
  - orgId: 1
    receiver: platform
    group_by: ["alertname", "component"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 8760h
    routes:
      - receiver: platform
        object_matchers:
          - ["severity", "=", "critical"]
      - receiver: platform
        object_matchers:
          - ["severity", "!=", "critical"]
        group_by: ["severity"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 8760h
        active_time_intervals:
          - active-hours
