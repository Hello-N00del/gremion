##############################################################
# Gremion — Docker Compose: the STATE project (governance-only kernel)
#
# One pooled stack per host (PRD-PLAT-005, TRD-440): this file (+ the prod
# overlay and the release pins layer) is the ${STACK}-state project --
# postgres, the six profile-gated <id>-postgres, nats, keycloak, legal,
# vector, and in the production profile traefik, docker-socket-proxy,
# pgbouncer and fallback. mailpit is dev-only (profiles: [dev]).
#
# The app tier (gremion-ui, gremion-public, the migrate and tenant-create
# one-shots) is NOT here: it is docker-compose.app.yml, instantiated twice as
# ${STACK}-app-blue and ${STACK}-app-green, so a colour switch never touches a
# persisted volume (TRD-038). The two tiers meet only on the external
# ${STACK}_state and ${STACK}_edge networks bootstrap.sh creates. A new tenant
# adds databases, a realm and an account -- never a container (TRD-440).
# Placement and limits: docs/ops/pooled-stack-layout.md; the guard is
# scripts/check-pooled-stack.mjs (make lint-pooled-stack).
#
# Quick start (dev):
#   cp .env.example .env
#   ./scripts/setup.sh      (generates secrets, starts state + app-blue)
#   make logs               (follow logs)
##############################################################

# ============================================================
# Container limits (TRD-177) — every service of every project declares both
# ============================================================
# Three sizes plus Keycloak's own (TASK-040 Q4). compose applies
# deploy.resources.limits outside swarm too: they land as HostConfig.Memory and
# HostConfig.NanoCpus, which is what test/host/integration/pooled-stack-proof.sh
# reads back from the running containers. Values are [A] until TRD-226's
# measurement exists; the proof's idle-RSS check (below 80 % of the limit on
# every container) is what catches a limit set too low. Keycloak: the Keycloak
# 26 guide "Concepts for sizing CPU and memory resources" gives a 1250 MB base
# with 300 MB non-heap at a 70 % heap share, so (1250 - 300) / 0.7 = 1.36 GB,
# rounded up to 1.5 GB. The same anchors are repeated in docker-compose.app.yml
# (YAML anchors do not cross files).
x-limits-s: &limits-s
  resources:
    limits:
      memory: 256M
      cpus: "0.25"
x-limits-m: &limits-m
  resources:
    limits:
      memory: 512M
      cpus: "0.5"
x-limits-l: &limits-l
  resources:
    limits:
      memory: 1G
      cpus: "1.0"
x-limits-keycloak: &limits-keycloak
  resources:
    limits:
      memory: 1536M
      cpus: "1.0"

# ============================================================
# Per-module PostgreSQL (D14) — the shape every <id>-postgres shares
# ============================================================
# One server per module, one database per (tenant, module) inside it (D13).
# The per-(tenant, module) databases are created by the provisioner
# (TASK-021), not here: each server starts with only the image's defaults. The image is the kernel's own pin — tag AND index
# digest, asserted by `make lint-postgres-major` — and the data volume is
# mounted at /var/lib/postgresql, the 18+ layout (see
# docs/ops/postgres-major.md). Each service adds its own profile, label,
# credentials and volume; the org.gremion.postgres label is how
# scripts/check-postgres-major-running.mjs finds the running servers.
x-module-postgres: &module-postgres
  image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  restart: unless-stopped
  deploy: *limits-s
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - state
  healthcheck:
    # over TCP: the entrypoint's temporary init server listens on no address,
    # so it can never be mistaken for the final one
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\""]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

# Required-variable guard for the edge (TASK-022, spec A §A/§E), copied from
# infra/host/mail/docker-compose.yml. Compose interpolates the WHOLE document,
# extension fields included, so an unset or empty variable named here aborts
# every `docker compose` verb before a container starts. It cannot be written
# inline on the ports entries: an empty EDGE_BIND_IP renders "- :80:80", which
# publishes on 0.0.0.0 -- precisely what §A forbids -- and the ${VAR:?} form
# would also hide the bind address from scripts/check-compose-edge.test.mjs.
# So the ports stay plain and the requirement is asserted once, here. Every key
# is declared in infra/host/templates/env/state.env.tmpl and in .env.example
# (test/host/edge-env.bats). Intended consequence: this binds EVERY profile and
# verb, dev and `make lint-compose` included, so a local .env that predates the
# edge must gain the Edge block from .env.example (docs/deployment.md).
x-required-env:
  stack: "${STACK:?STACK required}"
  gremion-root: "${GREMION_ROOT:?GREMION_ROOT required}"
  acme-ca-server: "${ACME_CA_SERVER:?ACME_CA_SERVER required}"
  edge-v4-subnet: "${EDGE_V4_SUBNET:?EDGE_V4_SUBNET required}"
  edge-v6-subnet: "${EDGE_V6_SUBNET:?EDGE_V6_SUBNET required}"
  edge-bind-ip: "${EDGE_BIND_IP:?EDGE_BIND_IP required}"
  edge-bind-ip6: "${EDGE_BIND_IP6:?EDGE_BIND_IP6 required}"
  edge-http-port: "${EDGE_HTTP_PORT:?EDGE_HTTP_PORT required}"
  edge-https-port: "${EDGE_HTTPS_PORT:?EDGE_HTTPS_PORT required}"
  traefik-api-port: "${TRAEFIK_API_PORT:?TRAEFIK_API_PORT required}"
  internaltest-port: "${INTERNALTEST_PORT:?INTERNALTEST_PORT required}"

services:

  # ============================================================
  # PostgreSQL — database for Keycloak and the governance kernel
  # ============================================================
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       postgres
      # Passed into init-databases.sh
      KEYCLOAK_DB_USER:      ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD:  ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_DB_NAME:      ${KEYCLOAK_DB_NAME:-keycloak}
      GREMION_DB_USER:         ${GREMION_DB_USER:-gremion}
      GREMION_DB_PASSWORD:     ${GREMION_DB_PASSWORD}
      GREMION_DB_NAME:         ${GREMION_DB_NAME:-gremion}
      # P2.1c T1 (#202): control-plane registry DB (tenant registry +
      # fleet-migration ledger), created by init-databases.sh.
      CONTROL_DB_USER:       ${CONTROL_DB_USER:-control}
      CONTROL_DB_PASSWORD:   ${CONTROL_DB_PASSWORD}
      CONTROL_DB_NAME:       ${CONTROL_DB_NAME:-control}
      # Read-only role for gremion-public (b5). Created by init-databases.sh
      # because migration 008 runs as the gremion user, which lacks CREATEROLE.
      PUBLIC_DB_PASSWORD:    ${PUBLIC_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    labels:
      org.gremion.postgres: "kernel"
    deploy: *limits-l
    networks:
      state:
        # <service>-<stack>, the idiom of gremion-deploy's evict_alias: every
        # app-tier database URL names its stack (postgres-${STACK}), so a URL
        # can be read for WHICH stack it targets from inside the container.
        aliases: ["postgres-${STACK:?STACK required}"]
    healthcheck:
      # over TCP: the entrypoint's temporary init server listens on no
      # address, so "healthy" can never mean that server
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # Per-module PostgreSQL (D14) — one per extraction-source leaf
  # ============================================================
  # Profile-gated: a plain `up` starts none of them, `--profile <id>` starts
  # that module's server. Each is size `s` (x-module-postgres) and sits on
  # ${STACK}_state only (D14: only the enabled profiles start). Credentials
  # come from <ID>_PG_USER / <ID>_PG_PASSWORD; an unset password makes the
  # image refuse to initialise, loudly.
  # The volumes carry NO global name any more (TASK-040): each realises as
  # ${STACK}-state_<id>-pg-data, so it can never be the extraction source's
  # gremion_<id>_pg_data (live PG16 clusters). check-pooled-stack.mjs refuses
  # any rendered gremion_* name.
  board-postgres:
    <<: *module-postgres
    profiles: [board]
    labels:
      org.gremion.postgres: "module:board"
    environment:
      POSTGRES_USER:     ${BOARD_PG_USER:-board}
      POSTGRES_PASSWORD: ${BOARD_PG_PASSWORD}
    volumes:
      - board-pg-data:/var/lib/postgresql

  calendar-postgres:
    <<: *module-postgres
    profiles: [calendar]
    labels:
      org.gremion.postgres: "module:calendar"
    environment:
      POSTGRES_USER:     ${CALENDAR_PG_USER:-calendar}
      POSTGRES_PASSWORD: ${CALENDAR_PG_PASSWORD}
    volumes:
      - calendar-pg-data:/var/lib/postgresql

  content-postgres:
    <<: *module-postgres
    profiles: [content]
    labels:
      org.gremion.postgres: "module:content"
    environment:
      POSTGRES_USER:     ${CONTENT_PG_USER:-content}
      POSTGRES_PASSWORD: ${CONTENT_PG_PASSWORD}
    volumes:
      - content-pg-data:/var/lib/postgresql

  finance-postgres:
    <<: *module-postgres
    profiles: [finance]
    labels:
      org.gremion.postgres: "module:finance"
    environment:
      POSTGRES_USER:     ${FINANCE_PG_USER:-finance}
      POSTGRES_PASSWORD: ${FINANCE_PG_PASSWORD}
    volumes:
      - finance-pg-data:/var/lib/postgresql

  newsletter-postgres:
    <<: *module-postgres
    profiles: [newsletter]
    labels:
      org.gremion.postgres: "module:newsletter"
    environment:
      POSTGRES_USER:     ${NEWSLETTER_PG_USER:-newsletter}
      POSTGRES_PASSWORD: ${NEWSLETTER_PG_PASSWORD}
    volumes:
      - newsletter-pg-data:/var/lib/postgresql

  vault-postgres:
    <<: *module-postgres
    profiles: [vault]
    labels:
      org.gremion.postgres: "module:vault"
    environment:
      POSTGRES_USER:     ${VAULT_PG_USER:-vault}
      POSTGRES_PASSWORD: ${VAULT_PG_PASSWORD}
    volumes:
      - vault-pg-data:/var/lib/postgresql

  # ============================================================
  # NATS JetStream — the event broker (TASK-024, CAP-NATS-AUTH; D12, TRD-419)
  # ============================================================
  # Admits a client only by nkey, into its tenant's account (T_<tenant>): one
  # account per tenant, one user per module, no anonymous user
  # (docker/nats/nats.conf). The accounts file is RENDERED by
  # @gremion/nats-auth (tenant-create; `nats-auth init` before the first state
  # up) into the external ${STACK}_nats_accounts volume, mounted here
  # read-only; a tenant add reloads the server over the network, never
  # restarts it (TRD-440). The seeds live in ${STACK}_nats_secrets, which only
  # tenant-create mounts. On ${STACK}_state only; no host port (clients reach
  # nats-${STACK}:4222); the monitor listens on the container loopback.
  nats:
    image: nats:2.12.15-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    command: ["-c", "/etc/nats/nats.conf"]
    restart: unless-stopped
    deploy: *limits-m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Go runtime soft limit under the 512M container limit (TRD-177 [A]).
      GOMEMLIMIT: 400MiB
    volumes:
      - ./docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-accounts:/etc/nats/accounts:ro
      - nats-data:/data
    networks:
      state:
        # the postgres idiom: gremion-deploy evict_alias reads <service>-<stack>
        aliases: ["nats-${STACK:?STACK required}"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Mailpit — SMTP catcher for staging / local dev (#162)
  # ============================================================
  # Listens on :1025 (SMTP, internal network only) and captures every
  # message the stack sends instead of relaying it to the outside world.
  # Read the trapped mail via the web UI (port 8025, mapped to a
  # 127.0.0.1 host port in docker-compose.override.yml).
  #
  # Mail producers (gremion-ui) default to
  #   host=mailpit port=1025 no-auth TLS-off
  # via the ${VAR:-default} indirection below, so flipping the stack to a
  # real outbound relay is a pure .env change — no compose edit. See
  # docs/runbooks/email-smtp.md for the activation steps.
  mailpit:
    # Dev only (TRD topology "mailpit: not deployed", TRD-251): a host renders
    # with COMPOSE_PROFILES=production, so no mail catcher exists there. Local
    # dev sets COMPOSE_PROFILES=dev (.env.example; `make up` defaults it).
    profiles: [dev]
    # Pinned — do NOT use :latest. Bump deliberately after a smoke test.
    image: axllent/mailpit:v1.30.1
    restart: unless-stopped
    deploy: *limits-s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Persist captured mail across restarts in the named volume below.
      MP_DATABASE: /data/mailpit.db
      # Accept any (or no) SMTP auth so producers configured with empty
      # creds still hand off cleanly; nothing leaves the host regardless.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit-data:/data
    networks:
      - state
    healthcheck:
      # Mailpit ships without a shell/curl/wget; use its own CLI healthcheck.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # gremion-ui and gremion-public live in docker-compose.app.yml (TASK-040):
  # one app project per colour, attached to ${STACK}_state and ${STACK}_edge.

  # ============================================================
  # Keycloak — central identity provider (OIDC/SSO)
  # Handles authentication for the Gremion portal (gremion-ui).
  # Admin UI: http://localhost:8082/auth/admin
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # B-01 (spec B §T.4): no boot-time realm. Keycloak starts with `master`
    # only; every tenant realm is composed by buildTenantRealmDoc
    # (gremion-ui/src/lib/server/tenant/provisioner/realm-doc.ts:254) and
    # created through the master bootstrap admin at tenant-create time.
    command:
      - start
      - --http-relative-path
      - /auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # TASK-036 (brief Q3, TRD-178): Keycloak's own readiness check on the
      # management port (9000; KC_HEALTH_ENABLED + KC_HTTP_MANAGEMENT_RELATIVE_PATH
      # below put it at /health/ready). A bare socket connect on :8080 passed as
      # soon as the JVM bound the port, before the database or anything else was
      # ready. The image ships neither curl nor wget, so bash's /dev/tcp speaks
      # HTTP/1.0 itself; the probe needs a 200 status line AND "status": "UP".
      # scripts/verify/census/keycloak-probe.test.mjs runs this script against
      # 503/DOWN stubs. `$$` is compose's escape for a literal `$`.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          r=''
          while IFS= read -r -t 5 l <&3; do r+="$$l"$$'\n'; done
          r+="$$l"
          case "$$r" in 'HTTP/1.'?' 200 '*'"status": "UP"'*) exit 0 ;; esac
          exit 1
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      # TASK-036 (Q3): health endpoints on the management port, at its root.
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      # The management interface inherits HTTPS once a TLS certificate is set
      # (docker-compose.prod.yml, G-080), and the probe above speaks plain HTTP.
      # Port 9000 is never published, so keep it on HTTP inside the container.
      KC_HTTP_MANAGEMENT_SCHEME: http
      # Admin credentials (KC_BOOTSTRAP_* replaces KEYCLOAK_ADMIN_* in KC 26+)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Database
      KC_DB:          postgres
      KC_DB_URL:      jdbc:postgresql://postgres/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # HTTP
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED:       "true"
      KC_HOSTNAME_STRICT:    "false"
    volumes:
      # PR 7 (T7.1): gremion login theme (design-refresh tokens).
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
    deploy: *limits-keycloak
    networks:
      # _state: its database, and the app tier's server-to-server OIDC and
      # Admin REST calls (https://keycloak:8443). _edge: Traefik's docker
      # provider routes the public OIDC surface to it.
      - edge
      - state

  # ============================================================
  # Legal — Static legal/portal pages (GDPR, Impressum, etc.)
  # ============================================================
  legal:
    # Same reason as gremion-public above: k8s/base/legal/deployment.yaml pins
    # ghcr.io/hello-n00del/gremion-legal, which nothing could build.
    # IMAGE_TAG is the release tag on a host (the pins layer resolves it to a
    # digest); `:-latest` keeps the TASK-022 edge-render fixture, which carries
    # no IMAGE_TAG, rendering unchanged.
    image: ghcr.io/hello-n00del/gremion-legal:${IMAGE_TAG:-latest}
    build:
      context: docker/legal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - legal/legal.env
    ports:
      # A-021 wave 2: container now serves on :8080 (non-root nginx).
      - "127.0.0.1:8083:8080"
    deploy: *limits-s
    networks:
      # _edge only: Traefik routes to it, and gremion-ui (also on _edge) reads
      # its imprint pages. It holds no data and needs no database.
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/impressum | grep -q 'Impressum' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================
  # Traefik — reverse proxy (production only)
  # Writes JSON access logs to traefik-logs volume for Vector.
  # Local dev: skipped — services are exposed via direct ports.
  # ============================================================
  traefik:
    profiles: [production]
    image: traefik:v3.7.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Traefik cannot read these itself: with --configFile it ignores CLI
      # flags and TRAEFIK_* variables, and the static file performs no ${}
      # expansion (measured, scripts/verify-traefik-acme-wiring.sh). The
      # command below substitutes them into a rendered COPY at start-up.
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Whether this host issues its own certificates, and so whether
      # ACME_EMAIL is required. Dash, not colon-dash: an explicitly EMPTY value
      # means "TLS terminates in front of Traefik", the supported staging mode.
      TRAEFIK_CERT_RESOLVER: ${TRAEFIK_CERT_RESOLVER-le-http}
      ACME_CA_SERVER: ${ACME_CA_SERVER}
      EDGE_V4_SUBNET: ${EDGE_V4_SUBNET}
      EDGE_V6_SUBNET: ${EDGE_V6_SUBNET}
    # Render-at-start (spec B "Edge" §2): a plain `sed` of the four markers
    # into /tmp, then the image's OWN entrypoint, so Traefik runs exactly as it
    # did before. `$$` escapes compose interpolation so the CONTAINER's shell
    # expands these, against the environment block above. Every refusal names
    # its reason and stops the container before Traefik starts:
    #   - a resolver with a blank contact registers an ACME account that can
    #     never be recovered, so ACME_EMAIL is required while
    #     TRAEFIK_CERT_RESOLVER is non-empty (and only then);
    #   - an empty CA or subnet, a value carrying a sed or YAML metacharacter
    #     (| & backslash or "), or a subnet wider than /8 (v4) or /16 (v6)
    #     would render a different -- or a wide-open -- file than reviewed;
    #   - a marker that survives the render means a sed expression is missing.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        if [ -n "$${TRAEFIK_CERT_RESOLVER}" ] && [ -z "$${ACME_EMAIL}" ]; then
        echo "FATAL: TRAEFIK_CERT_RESOLVER=$${TRAEFIK_CERT_RESOLVER} means this host issues its own certificates, so ACME_EMAIL is required." >&2;
        exit 1; fi;
        for v in "$${ACME_CA_SERVER}" "$${EDGE_V4_SUBNET}" "$${EDGE_V6_SUBNET}"; do
        [ -n "$$v" ] || { echo "FATAL: ACME_CA_SERVER, EDGE_V4_SUBNET and EDGE_V6_SUBNET are required." >&2; exit 1; }; done;
        case "$${ACME_EMAIL}$${ACME_CA_SERVER}$${EDGE_V4_SUBNET}$${EDGE_V6_SUBNET}" in
        *'|'*|*'&'*|*'\'*|*'"'*) echo "FATAL: an edge value carries a sed or YAML metacharacter (| & backslash or double quote)." >&2; exit 1;; esac;
        case "$${EDGE_V4_SUBNET}" in */[0-7]) echo "FATAL: EDGE_V4_SUBNET is wider than /8 and would trust forwarded headers from much of the internet." >&2; exit 1;; esac;
        case "$${EDGE_V6_SUBNET}" in */[0-9]|*/1[0-5]) echo "FATAL: EDGE_V6_SUBNET is wider than /16 and would trust forwarded headers from much of the internet." >&2; exit 1;; esac;
        sed -e "s|@ACME_EMAIL@|$${ACME_EMAIL:-acme-unused@invalid}|g"
        -e "s|@ACME_CA_SERVER@|$${ACME_CA_SERVER}|g"
        -e "s|@EDGE_V4_SUBNET@|$${EDGE_V4_SUBNET}|g"
        -e "s|@EDGE_V6_SUBNET@|$${EDGE_V6_SUBNET}|g"
        /etc/traefik/traefik.yml > /tmp/traefik.yml;
        if grep -q '@[A-Z][A-Z0-9_]*@' /tmp/traefik.yml; then
        echo "FATAL: a @MARKER@ survived the render of /tmp/traefik.yml." >&2; exit 1; fi;
        exec /entrypoint.sh traefik --configFile=/tmp/traefik.yml
    # TRD-178. The entrypoint above is a shell: if the render produces a file
    # Traefik rejects, the container could sit "Up" routing nothing. This
    # probes the ping entrypoint (:8082, unpublished). `traefik healthcheck`
    # is not used: it re-reads configuration and cannot see the /tmp copy.
    # busybox wget is present in traefik:v3.7.1.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/ping | grep -q OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # Nothing here binds 0.0.0.0 (spec A §A). web/websecure publish on the
      # edge IP of each family; :80 carries the ACME HTTP-01 challenge and the
      # HTTPS redirect. The API (:8080) and internaltest (:8081) are loopback
      # only: an unauthenticated Traefik API on every interface is the whole
      # routing graph. ping (:8082) is not published at all.
      - "${EDGE_BIND_IP}:${EDGE_HTTP_PORT}:80"
      - "[${EDGE_BIND_IP6}]:${EDGE_HTTP_PORT}:80"
      - "${EDGE_BIND_IP}:${EDGE_HTTPS_PORT}:443"
      - "[${EDGE_BIND_IP6}]:${EDGE_HTTPS_PORT}:443"
      - "127.0.0.1:${TRAEFIK_API_PORT}:8080"
      - "127.0.0.1:${INTERNALTEST_PORT}:8081"
    # The Docker socket is no longer mounted here (#244): Traefik reaches the
    # Docker API through the read-only docker-socket-proxy over TCP instead, so a
    # compromise of this internet-facing edge proxy can no longer drive the full
    # Docker Engine API (POST /containers/create with a host bind == host root).
    depends_on:
      - docker-socket-proxy
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # The host's router directory (per-tenant files, etc/edge/active.yml):
      # the ONLY mount of /etc/traefik/dynamic any container holds, and
      # read-only -- writers work on the host side (spec B "Edge" §2).
      # Long syntax so a missing host directory is a refusal at `up`, not an
      # empty directory Docker creates and Traefik watches forever.
      - type: bind
        source: ${GREMION_ROOT}/etc/edge
        target: /etc/traefik/dynamic
        read_only: true
        bind:
          create_host_path: false
      # ACME account and certificates live only here (TRD-042). The Cloudflare
      # Origin certificate mounts left with dynamic/tls.yml.
      - traefik-acme:/letsencrypt
      - traefik-logs:/logs
    deploy: *limits-m
    networks:
      # ${STACK}_edge (the pinned EDGE_V4/V6 subnets the forwardedHeaders list
      # trusts) plus the private socket net to its Docker API proxy. NEVER
      # ${STACK}_state: the edge process holds no route to a data store.
      - edge
      - socket

  # ============================================================
  # docker-socket-proxy — read-only Docker API gateway (production only)
  # Holds /var/run/docker.sock so Traefik's docker provider can read container
  # labels WITHOUT the internet-facing edge proxy mounting the raw socket. Only
  # the GET endpoints the provider needs are allowed; all writes (POST) and
  # dangerous endpoints stay denied. Not published, and on the private `socket`
  # network ONLY (internal: true, shared with traefik and nothing else): no app
  # container and no data store can reach the Docker API (BSI NET.1.1).
  # Pinned by digest (supply-chain hardening, #252 / gremion#22): the digest
  # below is the multi-arch manifest-list index for the 0.1.1 tag, so `docker`
  # still selects the right platform at pull time while the ref stays immutable.
  # To re-pin after an intentional bump: docker buildx imagetools inspect
  # tecnativa/docker-socket-proxy:<tag> --format '{{.Manifest.Digest}}'.
  # ============================================================
  docker-socket-proxy:
    profiles: [production]
    image: tecnativa/docker-socket-proxy:0.1.1@sha256:6c22b9545adc95258af9deffdde6c0ce0a0a70716771e5a4e02d24d1b6e0dda1
    restart: unless-stopped
    healthcheck:
      # TASK-036 (TRD-178): /_ping is in the proxy's default-allowed set, measured
      # at the pinned digest (wget present, body "OK"). An OK proves HAProxy is
      # listening AND can still reach the Docker socket -- the failure Traefik's
      # docker provider actually sees.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # Read scopes Traefik's docker provider consults. POST defaults to 0 — the
      # load-bearing denial that blocks container create / exec / image run.
      CONTAINERS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      TASKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy: *limits-s
    networks:
      - socket

  # ============================================================
  # Vector — log pipeline with ipcrypt-nd IP pseudonymisation
  # Tails Traefik access logs, pseudonymises IPs, enforces retention.
  # ============================================================
  vector:
    build:
      context: docker/vector
      dockerfile: Dockerfile
    image: ghcr.io/hello-n00del/gremion-vector:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No network at all (TASK-040 Q3): vector reads traefik's access log off a
    # shared volume and writes its output to another; it talks to nothing.
    # The healthcheck below still works: network_mode none keeps loopback.
    network_mode: none
    deploy: *limits-m
    healthcheck:
      # TASK-036 (TRD-178): Vector's own loopback API (docker/vector/vector.toml
      # [api]), measured answering {"ok":true} in the built image. entrypoint.sh
      # supervises process-logs.sh and the logrotate loop and exits the
      # container via `wait -n` when either dies, so container liveness covers
      # those two and this probe covers Vector actually serving.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8686/health | grep -q '\"ok\":true'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      IPCRYPT_KEY_FILE: /run/secrets/ipcrypt_key
      IPCRYPT_KEY_EPOCH: "0"
      # LOG_RETENTION_SECONDS must be a plain integer (seconds).
      # Computed from LOG_ACCESS_RETENTION_DAYS (days × 86400).
      LOG_RETENTION_SECONDS: "${LOG_ACCESS_RETENTION_SECONDS:-1209600}"
      RAW_LOG_PATH: /logs/traefik/access.log
      PROCESSED_LOG_PATH: /logs/processed/security.log
    secrets:
      - ipcrypt_key
    volumes:
      # :rw (was :ro) so the logrotate loop in entrypoint.sh can copytruncate the
      # raw access.log in place (#242). Traefik writes it on its own RW mount in a
      # separate container; copytruncate avoids any cross-container signal. Vector
      # only TAILS this file (process-logs.sh) and never writes it, so RW here is
      # used solely by the rotation loop.
      - traefik-logs:/logs/traefik:rw
      - vector-processed-logs:/logs/processed

# ============================================================
# Volumes
# ============================================================
# No global name: on any of them (TASK-040): each realises as
# ${COMPOSE_PROJECT_NAME}_<key>, i.e. ${STACK}-state_<key> on a host, so two
# stacks (or two worktrees) on one Docker engine never share a data volume.
# The app tier's persisted volumes are EXTERNAL (docker-compose.app.yml,
# created by bootstrap.sh stage_networks), never declared by a colour.
volumes:
  pg-data:
  board-pg-data:
  calendar-pg-data:
  content-pg-data:
  finance-pg-data:
  newsletter-pg-data:
  vault-pg-data:
  # JetStream's store: project-scoped like pg-data (${STACK}-state_nats-data),
  # backed up by project label with the rest of the state volumes.
  nats-data:
  # The rendered accounts file (public keys only): written by tenant-create,
  # read by nats. External, created by bootstrap.sh stage_networks (and by
  # `make dev-networks`), so no `down -v` of either project can take it.
  nats-accounts:
    name: ${STACK}_nats_accounts
    external: true
  mailpit-data:
  traefik-logs:
  # Created by infra/host/bootstrap.sh (stage_networks) and never by compose,
  # so a `down -v` cannot take the ACME account with it. Stack-scoped name
  # (spec A §E): a hardcoded gremion_traefik_acme is forbidden.
  traefik-acme:
    name: ${STACK}_traefik_acme
    external: true
  vector-processed-logs:

# ============================================================
# Secrets
# ============================================================
secrets:
  ipcrypt_key:
    file: ./secrets/ipcrypt_key.txt

# ============================================================
# Networks
# ============================================================
networks:
  # The two stack-scoped externals bootstrap.sh stage_networks creates (dual
  # stack, pinned subnets). The KEY is a fixed local alias because compose
  # validates keys before interpolating; name: carries the identity.
  edge:
    external: true
    name: ${STACK:?STACK required}_edge
  state:
    external: true
    name: ${STACK:?STACK required}_state
  # Project-scoped (${STACK}-state_socket): traefik <-> docker-socket-proxy
  # only. internal: true -- no route off the host from it.
  socket:
    internal: true
