##############################################################
# Gremion — Docker Compose (governance-only kernel)
#
# Services: postgres, keycloak, gremion-ui, gremion-public, legal,
#           vector, mailpit (+ traefik / docker-socket-proxy in the
#           production profile).
#
# Quick start:
#   cp .env.example .env
#   ./scripts/setup.sh      (generates secrets, starts services)
#   make logs               (follow logs)
##############################################################

# ============================================================
# Per-module PostgreSQL (D14) — the shape every <id>-postgres shares
# ============================================================
# One server per module, one database per (tenant, module) inside it (D13).
# The per-(tenant, module) databases are created by the provisioner
# (TASK-021), not here: each server starts with only the image's defaults. The image is the kernel's own pin — tag AND index
# digest, asserted by `make lint-postgres-major` — and the data volume is
# mounted at /var/lib/postgresql, the 18+ layout (see
# docs/ops/postgres-major.md). Each service adds its own profile, label,
# credentials and volume; the org.gremion.postgres label is how
# scripts/check-postgres-major-running.mjs finds the running servers.
x-module-postgres: &module-postgres
  image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - gremion-net
  healthcheck:
    # over TCP: the entrypoint's temporary init server listens on no address,
    # so it can never be mistaken for the final one
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\""]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

# Required-variable guard for the edge (TASK-022, spec A §A/§E), copied from
# infra/host/mail/docker-compose.yml. Compose interpolates the WHOLE document,
# extension fields included, so an unset or empty variable named here aborts
# every `docker compose` verb before a container starts. It cannot be written
# inline on the ports entries: an empty EDGE_BIND_IP renders "- :80:80", which
# publishes on 0.0.0.0 -- precisely what §A forbids -- and the ${VAR:?} form
# would also hide the bind address from scripts/check-compose-edge.test.mjs.
# So the ports stay plain and the requirement is asserted once, here. Every key
# is declared in infra/host/templates/env/state.env.tmpl and in .env.example
# (test/host/edge-env.bats). Intended consequence: this binds EVERY profile and
# verb, dev and `make lint-compose` included, so a local .env that predates the
# edge must gain the Edge block from .env.example (docs/deployment.md).
x-required-env:
  stack: "${STACK:?STACK required}"
  gremion-root: "${GREMION_ROOT:?GREMION_ROOT required}"
  acme-ca-server: "${ACME_CA_SERVER:?ACME_CA_SERVER required}"
  edge-v4-subnet: "${EDGE_V4_SUBNET:?EDGE_V4_SUBNET required}"
  edge-v6-subnet: "${EDGE_V6_SUBNET:?EDGE_V6_SUBNET required}"
  edge-bind-ip: "${EDGE_BIND_IP:?EDGE_BIND_IP required}"
  edge-bind-ip6: "${EDGE_BIND_IP6:?EDGE_BIND_IP6 required}"
  edge-http-port: "${EDGE_HTTP_PORT:?EDGE_HTTP_PORT required}"
  edge-https-port: "${EDGE_HTTPS_PORT:?EDGE_HTTPS_PORT required}"
  traefik-api-port: "${TRAEFIK_API_PORT:?TRAEFIK_API_PORT required}"
  internaltest-port: "${INTERNALTEST_PORT:?INTERNALTEST_PORT required}"

services:

  # ============================================================
  # PostgreSQL — database for Keycloak and the governance kernel
  # ============================================================
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       postgres
      # Passed into init-databases.sh
      KEYCLOAK_DB_USER:      ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD:  ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_DB_NAME:      ${KEYCLOAK_DB_NAME:-keycloak}
      GREMION_DB_USER:         ${GREMION_DB_USER:-gremion}
      GREMION_DB_PASSWORD:     ${GREMION_DB_PASSWORD}
      GREMION_DB_NAME:         ${GREMION_DB_NAME:-gremion}
      # P2.1c T1 (#202): control-plane registry DB (tenant registry +
      # fleet-migration ledger), created by init-databases.sh.
      CONTROL_DB_USER:       ${CONTROL_DB_USER:-control}
      CONTROL_DB_PASSWORD:   ${CONTROL_DB_PASSWORD}
      CONTROL_DB_NAME:       ${CONTROL_DB_NAME:-control}
      # Read-only role for gremion-public (b5). Created by init-databases.sh
      # because migration 008 runs as the gremion user, which lacks CREATEROLE.
      PUBLIC_DB_PASSWORD:    ${PUBLIC_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    labels:
      org.gremion.postgres: "kernel"
    networks:
      - gremion-net
    healthcheck:
      # over TCP: the entrypoint's temporary init server listens on no
      # address, so "healthy" can never mean that server
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # Per-module PostgreSQL (D14) — one per extraction-source leaf
  # ============================================================
  # Profile-gated: a plain `up` starts none of them, `--profile <id>` starts
  # that module's server. Credentials come from <ID>_PG_USER /
  # <ID>_PG_PASSWORD; an unset password makes the image refuse to initialise,
  # loudly. The volumes carry names of their own (gremion_module_<id>_pg_data)
  # and NEVER the extraction source's gremion_<id>_pg_data: those hold its
  # live PG16 clusters (the guard refuses them, FORBIDDEN_MODULE_VOLUMES).
  board-postgres:
    <<: *module-postgres
    profiles: [board]
    labels:
      org.gremion.postgres: "module:board"
    environment:
      POSTGRES_USER:     ${BOARD_PG_USER:-board}
      POSTGRES_PASSWORD: ${BOARD_PG_PASSWORD}
    volumes:
      - board-pg-data:/var/lib/postgresql

  calendar-postgres:
    <<: *module-postgres
    profiles: [calendar]
    labels:
      org.gremion.postgres: "module:calendar"
    environment:
      POSTGRES_USER:     ${CALENDAR_PG_USER:-calendar}
      POSTGRES_PASSWORD: ${CALENDAR_PG_PASSWORD}
    volumes:
      - calendar-pg-data:/var/lib/postgresql

  content-postgres:
    <<: *module-postgres
    profiles: [content]
    labels:
      org.gremion.postgres: "module:content"
    environment:
      POSTGRES_USER:     ${CONTENT_PG_USER:-content}
      POSTGRES_PASSWORD: ${CONTENT_PG_PASSWORD}
    volumes:
      - content-pg-data:/var/lib/postgresql

  finance-postgres:
    <<: *module-postgres
    profiles: [finance]
    labels:
      org.gremion.postgres: "module:finance"
    environment:
      POSTGRES_USER:     ${FINANCE_PG_USER:-finance}
      POSTGRES_PASSWORD: ${FINANCE_PG_PASSWORD}
    volumes:
      - finance-pg-data:/var/lib/postgresql

  newsletter-postgres:
    <<: *module-postgres
    profiles: [newsletter]
    labels:
      org.gremion.postgres: "module:newsletter"
    environment:
      POSTGRES_USER:     ${NEWSLETTER_PG_USER:-newsletter}
      POSTGRES_PASSWORD: ${NEWSLETTER_PG_PASSWORD}
    volumes:
      - newsletter-pg-data:/var/lib/postgresql

  vault-postgres:
    <<: *module-postgres
    profiles: [vault]
    labels:
      org.gremion.postgres: "module:vault"
    environment:
      POSTGRES_USER:     ${VAULT_PG_USER:-vault}
      POSTGRES_PASSWORD: ${VAULT_PG_PASSWORD}
    volumes:
      - vault-pg-data:/var/lib/postgresql

  # ============================================================
  # Mailpit — SMTP catcher for staging / local dev (#162)
  # ============================================================
  # Listens on :1025 (SMTP, internal network only) and captures every
  # message the stack sends instead of relaying it to the outside world.
  # Read the trapped mail via the web UI (port 8025, mapped to a
  # 127.0.0.1 host port in docker-compose.override.yml).
  #
  # Mail producers (gremion-ui) default to
  #   host=mailpit port=1025 no-auth TLS-off
  # via the ${VAR:-default} indirection below, so flipping the stack to a
  # real outbound relay is a pure .env change — no compose edit. See
  # docs/runbooks/email-smtp.md for the activation steps.
  mailpit:
    # Pinned — do NOT use :latest. Bump deliberately after a smoke test.
    image: axllent/mailpit:v1.30.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Persist captured mail across restarts in the named volume below.
      MP_DATABASE: /data/mailpit.db
      # Accept any (or no) SMTP auth so producers configured with empty
      # creds still hand off cleanly; nothing leaves the host regardless.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit-data:/data
    networks:
      - gremion-net
    healthcheck:
      # Mailpit ships without a shell/curl/wget; use its own CLI healthcheck.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Gremion UI — unified SvelteKit frontend
  # ============================================================
  gremion-ui:
    build:
      context: .
      dockerfile: gremion-ui/Dockerfile
    image: ghcr.io/hello-n00del/gremion-ui:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      AUTH_SECRET:              ${AUTH_SECRET}
      AUTH_KEYCLOAK_ID:         ${AUTH_KEYCLOAK_ID:-gremion-ui}
      AUTH_KEYCLOAK_SECRET:     ${AUTH_KEYCLOAK_SECRET}
      AUTH_KEYCLOAK_ISSUER:     ${AUTH_KEYCLOAK_ISSUER}
      # G-080: server-to-server OIDC over internal TLS (token/userinfo/jwks/refresh
      # + Bearer-JWKS) — the secure prod default. docker-compose.prod.yml adds
      # NODE_EXTRA_CA_CERTS so undici/jose trust the internal cert; the dev
      # override drops this back to http://keycloak:8080 (dev realm=external).
      AUTH_KEYCLOAK_INTERNAL:   https://keycloak:8443/auth/realms/gremion
      AUTH_TRUST_HOST:          "1"
      # Generic step-up freshness window (seconds) — the validity of a fresh LoA-2
      # elevation before a re-prompt. Kernel auth keeps the KC step-up/acr plumbing;
      # the finance approval enforcement flag left with the finance module.
      STEPUP_FRESHNESS_SECONDS: ${STEPUP_FRESHNESS_SECONDS:-300}
      PUBLIC_BASE_URL:          ${PUBLIC_BASE_URL:-http://localhost:3000}
      # AGPL-3.0 section 13: the running app offers its Corresponding Source.
      # An operator running a MODIFIED build MUST point this at their own
      # repository — upstream is not the corresponding source of their version,
      # so leaving it unset would make the offer false. Unset (empty) falls back
      # to upstream, which is correct for an unmodified deployment.
      PUBLIC_SOURCE_URL:        ${PUBLIC_SOURCE_URL:-}
      # NOTE: ORIGIN is deliberately NOT pinned here. In the multi-tenant
      # deployment every tenant is served on its OWN host (<slug>.${DOMAIN} +
      # the apex = default), so a single fixed ORIGIN would make SvelteKit's
      # adapter-node derive the same origin for every tenant — which then makes
      # the CSRF origin check 403 every non-default tenant's SSO/form POST
      # (the browser's Origin is the tenant host, the pinned origin is the apex).
      # With ORIGIN unset, adapter-node derives the origin from the real inbound
      # Host header (Traefik passHostHeader=true preserves it per tenant), while
      # the tenant resolver independently reads the rewritten x-forwarded-host.
      # Protocol is forced to https in the prod overlay (PROTOCOL_HEADER).
      # Dev/local: docker-compose.override.yml sets ORIGIN=http://localhost:<port>.
      # G-080: Admin REST over internal TLS (governance committee provisioning,
      # #164 hasOtpCredential). Dev override → http://keycloak:8080.
      KEYCLOAK_ADMIN_URL:       https://keycloak:8443/auth
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      CONFIG_PATH:              /app/config/config.json
      DATABASE_URL:             postgresql://${GREMION_DB_USER:-gremion}:${GREMION_DB_PASSWORD}@postgres:5432/${GREMION_DB_NAME:-gremion}
      # P2.1c T1 (#202): control-plane registry DB (tenant registry + fleet-
      # migration ledger, gremion-ui/migrations-control/) — without it boot()'s
      # runControlMigrations() dies and every request 503s. D-CONTROLDIRECT:
      # targets postgres:5432 DIRECTLY on purpose — it must NOT follow the
      # production overlay's PgBouncer DATABASE_URL re-point (the control
      # plane is the direct "+ control" term in P2.1b's connection budget;
      # registry reads are cached). The prod overlay deliberately does NOT
      # override this key — it inherits this value (see docker-compose.prod.yml).
      CONTROL_DATABASE_URL:     postgresql://${CONTROL_DB_USER:-control}:${CONTROL_DB_PASSWORD}@postgres:5432/${CONTROL_DB_NAME:-control}
      SEED_TOKEN:               ${SEED_TOKEN:-}
      SEED_USER_PASSWORD:       ${SEED_USER_PASSWORD:-}
      # Shared secret for the server-only internalFetch helper (server-to-server
      # hops). Set by scripts/setup.sh.
      INTERNAL_PUSH_SECRET:     ${INTERNAL_PUSH_SECRET:-}
      # P2.1c (#202): the in-container origin internalFetch's server-to-server
      # hop targets — so resolveInternalBaseUrl() (internal-fetch.ts) returns
      # THIS instead of falling through to PUBLIC_BASE_URL = the public apex.
      # LOAD-BEARING for tenant isolation: the inner hop must NOT traverse the
      # apex router (docker-compose.prod.yml gremion-ui-apex, priority 20), whose
      # gremion-ui-apexhost middleware UNCONDITIONALLY sets
      # X-Forwarded-Host=default.${DOMAIN} and would OVERWRITE the <slug>.<apex>
      # value T4 stamps -> a 2nd tenant's self-call would resolve `default` and
      # hit the DEFAULT tenant's data plane (cross-tenant read+write). Hitting
      # gremion-ui:3000 directly (adapter-node's in-container port; the compose
      # service name resolves on gremion_net) bypasses Traefik entirely, so the
      # stamped forwarded host survives and the resolver re-selects the right
      # tenant. Set in the BASE file so dev + prod inherit. Do NOT point this at
      # the public apex.
      INTERNAL_BASE_URL:        http://gremion-ui:3000
      # /api/setup/test-smtp refuses any target that is not a demonstrably
      # public address (SSRF / internal port-probe oracle — see
      # docs/security/test-smtp-guard.md). This is the ONE opt-in that widens
      # that predicate, for RFC1918 + IPv6 unique-local only, so an operator can
      # point the SMTP test at an internal relay. It is read from the process
      # environment, so without this passthrough a value in .env never reaches
      # the container and the refusal hint would name a variable that does
      # nothing. Default OFF; compose reads .env at CREATE time, so a change
      # needs `up -d --force-recreate gremion-ui`, not `restart`.
      SMTP_TEST_ALLOW_PRIVATE:  ${SMTP_TEST_ALLOW_PRIVATE:-}
      TRACE_EXPORTER:           ${TRACE_EXPORTER:-log}
    volumes:
      - gremion-config-data:/app/config
      # /data holds the per-tenant config files written by the provisioner
      # (/data/<slug>/config.json — see registry.ts configPathForTenant). It used
      # to ALSO hold the newsletter SQLite store, removed in Task 23; the mount
      # (and its named volume) stay because tenant config still lives here.
      - newsletter-data:/data
      # P2.1c T1 (#202) D-SECMOUNT: per-tenant secrets cross the host->container
      # boundary via this ONE read-only bind mount. Bind mounts are LIVE — a new
      # per-tenant secret file written by the provisioner appears in the running
      # container WITHOUT a compose edit or recreate (compose top-level `secrets:`
      # are static per-file and cannot do this). The T7 `file:` secret-ref
      # allowlist is pinned to the CONTAINER prefix /run/secrets/. Create the
      # host dir (mkdir -p secrets/tenants) before `up` — Docker would otherwise
      # create it root-owned.
      - ${TENANT_SECRETS_DIR:-./secrets/tenants}:/run/secrets/tenants:ro
    networks:
      - gremion-net
    healthcheck:
      # TASK-023 (B-05): /healthz is on the closed boot-and-resolve exemption
      # list, so this probe needs no host header, no proxy-trust secret and no
      # tenant row, and it no longer names the `default` tenant. It is LIVENESS
      # only: a still-booting or boot-failed process also answers 200 here
      # (/api/health is the boot probe). A non-transient boot failure exits 1
      # instead, and `restart: unless-stopped` recycles the container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # gremion-public — read-only public portal (B5)
  # Served at public.${DOMAIN} — no auth, no sessions
  # ============================================================
  gremion-public:
    # The image COORDINATE, so `docker compose build` produces the name
    # k8s/base/gremion-public/deployment.yaml pins and k8s/base/kustomization.yaml
    # tells an operator to push. Without it the build was tagged
    # <project>-gremion-public and ghcr.io/hello-n00del/gremion-public could never
    # be produced by the documented `make build`.
    image: ghcr.io/hello-n00del/gremion-public:latest
    build:
      context: .
      dockerfile: gremion-public/Dockerfile
      args:
        # v12 apex topology — build-time mount point for the portal. Empty (the
        # default) serves it at `/`, which is what the `Host(public.${DOMAIN})`
        # router below expects. Set PUBLIC_BASE_PATH=/portal only together with a
        # router rule that actually routes that prefix here; the healthcheck
        # below follows the same variable, because probing `/` under a base path
        # 404s and Traefik drops an unhealthy container's routers.
        BASE_PATH: ${PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORIGIN:                     https://public.${DOMAIN}
      GREMION_PUBLIC_DB_URL:        postgresql://gremion_public_reader:${PUBLIC_DB_PASSWORD}@postgres:5432/${GREMION_DB_NAME:-gremion}
      PUBLIC_CONTACT_NAME:        ${PUBLIC_CONTACT_NAME:-Studierendenrat}
      PUBLIC_CONTACT_ADDRESS:     ${PUBLIC_CONTACT_ADDRESS:-}
      PUBLIC_CONTACT_EMAIL:       ${PUBLIC_CONTACT_EMAIL:-}
      PUBLIC_CONTACT_PHONE:       ${PUBLIC_CONTACT_PHONE:-}
      PUBLIC_IMPRINT_RESPONSIBLE:  ${PUBLIC_IMPRINT_RESPONSIBLE:-Vorsitz des StuRa}
      PUBLIC_MAIN_APP_URL:         https://${DOMAIN}
      # AGPL-3.0 section 13 — see the gremion-ui block above. Same variable, so
      # one setting in .env covers both shells.
      PUBLIC_SOURCE_URL:           ${PUBLIC_SOURCE_URL:-}
      PUBLIC_LEGISLATURE_LABEL:    ${PUBLIC_LEGISLATURE_LABEL:-}
      # v12 — optional back-route up to a site above the portal. Unset here by
      # default; the portal then renders neither the apex strip nor the footer
      # colophon. Each of the two needs BOTH a URL and its own label.
      PUBLIC_APEX_URL:             ${PUBLIC_APEX_URL:-}
      PUBLIC_APEX_LABEL:           ${PUBLIC_APEX_LABEL:-}
      PUBLIC_APEX_NOTE:            ${PUBLIC_APEX_NOTE:-}
      PUBLIC_APEX_COLOPHON:        ${PUBLIC_APEX_COLOPHON:-}
      # #241: Nextcloud admin credentials are deliberately NOT injected here. The
      # anonymous, internet-facing public portal no longer streams PDFs via WebDAV;
      # its /api/public/protocols/[id]/pdf route redirects the browser to the main
      # app (PUBLIC_MAIN_APP_URL above), which holds the NC creds legitimately. An
      # RCE/SSRF/env-leak in this container can no longer reach Nextcloud admin.
    networks:
      - gremion-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gremion-public.rule=Host(`public.${DOMAIN}`)"
      - "traefik.http.routers.gremion-public.entrypoints=websecure"
      - "traefik.http.routers.gremion-public.tls=true"
      - "traefik.http.routers.gremion-public.middlewares=public-ratelimit@docker"
      - "traefik.http.services.gremion-public.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.period=1m"
      # TASK-022 (round-2 HIGH): #251's original comment here said "key the
      # bucket on the real client IP (Cloudflare sets CF-Connecting-IP)". That
      # was true when cloudflared sat in front of Traefik and rewrote the
      # header itself. TASK-022 makes Traefik the first hop (see
      # docker/traefik/traefik.yml's forwardedHeaders header: "nothing keyed
      # on security may read a forwarded header"), so a sourceCriterion keyed
      # on a request header is read verbatim from whatever the client sends --
      # any client can rotate CF-Connecting-IP itself and mint a fresh 100
      # req/min bucket per request, voiding the limit. No sourceCriterion is
      # declared below, so Traefik falls back to the connection's own remote
      # address, which is the real client now that nothing sits in front of
      # it. Guarded by scripts/check-compose-edge.test.mjs guard 4, which reads
      # every service's rendered labels for a ratelimit sourceCriterion keyed
      # on CF-Connecting-IP / X-Forwarded-For / X-Real-IP.
    healthcheck:
      # Follows PUBLIC_BASE_PATH: under a base path the portal 404s outside it,
      # the container is marked unhealthy, and Traefik v3 removes its routers.
      # TASK-023: probes the database-free /healthz marker, not the home page.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000${PUBLIC_BASE_PATH:-}/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # Keycloak — central identity provider (OIDC/SSO)
  # Handles authentication for the Gremion portal (gremion-ui).
  # Admin UI: http://localhost:8082/auth/admin
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # B-01 (spec B §T.4): no boot-time realm. Keycloak starts with `master`
    # only; every tenant realm is composed by buildTenantRealmDoc
    # (gremion-ui/src/lib/server/tenant/provisioner/realm-doc.ts:254) and
    # created through the master bootstrap admin at tenant-create time.
    command:
      - start
      - --http-relative-path
      - /auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # TASK-036 (brief Q3, TRD-178): Keycloak's own readiness check on the
      # management port (9000; KC_HEALTH_ENABLED + KC_HTTP_MANAGEMENT_RELATIVE_PATH
      # below put it at /health/ready). A bare socket connect on :8080 passed as
      # soon as the JVM bound the port, before the database or anything else was
      # ready. The image ships neither curl nor wget, so bash's /dev/tcp speaks
      # HTTP/1.0 itself; the probe needs a 200 status line AND "status": "UP".
      # scripts/verify/census/keycloak-probe.test.mjs runs this script against
      # 503/DOWN stubs. `$$` is compose's escape for a literal `$`.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          r=''
          while IFS= read -r -t 5 l <&3; do r+="$$l"$$'\n'; done
          r+="$$l"
          case "$$r" in 'HTTP/1.'?' 200 '*'"status": "UP"'*) exit 0 ;; esac
          exit 1
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      # TASK-036 (Q3): health endpoints on the management port, at its root.
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      # Admin credentials (KC_BOOTSTRAP_* replaces KEYCLOAK_ADMIN_* in KC 26+)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Database
      KC_DB:          postgres
      KC_DB_URL:      jdbc:postgresql://postgres/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # HTTP
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED:       "true"
      KC_HOSTNAME_STRICT:    "false"
    volumes:
      # PR 7 (T7.1): gremion login theme (design-refresh tokens).
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - gremion-net

  # ============================================================
  # Legal — Static legal/portal pages (GDPR, Impressum, etc.)
  # ============================================================
  legal:
    # Same reason as gremion-public above: k8s/base/legal/deployment.yaml pins
    # ghcr.io/hello-n00del/gremion-legal, which nothing could build.
    image: ghcr.io/hello-n00del/gremion-legal:latest
    build:
      context: docker/legal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - legal/legal.env
    ports:
      # A-021 wave 2: container now serves on :8080 (non-root nginx).
      - "127.0.0.1:8083:8080"
    networks:
      - gremion-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/impressum | grep -q 'Impressum' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================
  # Traefik — reverse proxy (production only)
  # Writes JSON access logs to traefik-logs volume for Vector.
  # Local dev: skipped — services are exposed via direct ports.
  # ============================================================
  traefik:
    profiles: [production]
    image: traefik:v3.7.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Traefik cannot read these itself: with --configFile it ignores CLI
      # flags and TRAEFIK_* variables, and the static file performs no ${}
      # expansion (measured, scripts/verify-traefik-acme-wiring.sh). The
      # command below substitutes them into a rendered COPY at start-up.
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Whether this host issues its own certificates, and so whether
      # ACME_EMAIL is required. Dash, not colon-dash: an explicitly EMPTY value
      # means "TLS terminates in front of Traefik", the supported staging mode.
      TRAEFIK_CERT_RESOLVER: ${TRAEFIK_CERT_RESOLVER-le-http}
      ACME_CA_SERVER: ${ACME_CA_SERVER}
      EDGE_V4_SUBNET: ${EDGE_V4_SUBNET}
      EDGE_V6_SUBNET: ${EDGE_V6_SUBNET}
    # Render-at-start (spec B "Edge" §2): a plain `sed` of the four markers
    # into /tmp, then the image's OWN entrypoint, so Traefik runs exactly as it
    # did before. `$$` escapes compose interpolation so the CONTAINER's shell
    # expands these, against the environment block above. Every refusal names
    # its reason and stops the container before Traefik starts:
    #   - a resolver with a blank contact registers an ACME account that can
    #     never be recovered, so ACME_EMAIL is required while
    #     TRAEFIK_CERT_RESOLVER is non-empty (and only then);
    #   - an empty CA or subnet, a value carrying a sed or YAML metacharacter
    #     (| & backslash or "), or a subnet wider than /8 (v4) or /16 (v6)
    #     would render a different -- or a wide-open -- file than reviewed;
    #   - a marker that survives the render means a sed expression is missing.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        if [ -n "$${TRAEFIK_CERT_RESOLVER}" ] && [ -z "$${ACME_EMAIL}" ]; then
        echo "FATAL: TRAEFIK_CERT_RESOLVER=$${TRAEFIK_CERT_RESOLVER} means this host issues its own certificates, so ACME_EMAIL is required." >&2;
        exit 1; fi;
        for v in "$${ACME_CA_SERVER}" "$${EDGE_V4_SUBNET}" "$${EDGE_V6_SUBNET}"; do
        [ -n "$$v" ] || { echo "FATAL: ACME_CA_SERVER, EDGE_V4_SUBNET and EDGE_V6_SUBNET are required." >&2; exit 1; }; done;
        case "$${ACME_EMAIL}$${ACME_CA_SERVER}$${EDGE_V4_SUBNET}$${EDGE_V6_SUBNET}" in
        *'|'*|*'&'*|*'\'*|*'"'*) echo "FATAL: an edge value carries a sed or YAML metacharacter (| & backslash or double quote)." >&2; exit 1;; esac;
        case "$${EDGE_V4_SUBNET}" in */[0-7]) echo "FATAL: EDGE_V4_SUBNET is wider than /8 and would trust forwarded headers from much of the internet." >&2; exit 1;; esac;
        case "$${EDGE_V6_SUBNET}" in */[0-9]|*/1[0-5]) echo "FATAL: EDGE_V6_SUBNET is wider than /16 and would trust forwarded headers from much of the internet." >&2; exit 1;; esac;
        sed -e "s|@ACME_EMAIL@|$${ACME_EMAIL:-acme-unused@invalid}|g"
        -e "s|@ACME_CA_SERVER@|$${ACME_CA_SERVER}|g"
        -e "s|@EDGE_V4_SUBNET@|$${EDGE_V4_SUBNET}|g"
        -e "s|@EDGE_V6_SUBNET@|$${EDGE_V6_SUBNET}|g"
        /etc/traefik/traefik.yml > /tmp/traefik.yml;
        if grep -q '@[A-Z][A-Z0-9_]*@' /tmp/traefik.yml; then
        echo "FATAL: a @MARKER@ survived the render of /tmp/traefik.yml." >&2; exit 1; fi;
        exec /entrypoint.sh traefik --configFile=/tmp/traefik.yml
    # TRD-178. The entrypoint above is a shell: if the render produces a file
    # Traefik rejects, the container could sit "Up" routing nothing. This
    # probes the ping entrypoint (:8082, unpublished). `traefik healthcheck`
    # is not used: it re-reads configuration and cannot see the /tmp copy.
    # busybox wget is present in traefik:v3.7.1.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/ping | grep -q OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # Nothing here binds 0.0.0.0 (spec A §A). web/websecure publish on the
      # edge IP of each family; :80 carries the ACME HTTP-01 challenge and the
      # HTTPS redirect. The API (:8080) and internaltest (:8081) are loopback
      # only: an unauthenticated Traefik API on every interface is the whole
      # routing graph. ping (:8082) is not published at all.
      - "${EDGE_BIND_IP}:${EDGE_HTTP_PORT}:80"
      - "[${EDGE_BIND_IP6}]:${EDGE_HTTP_PORT}:80"
      - "${EDGE_BIND_IP}:${EDGE_HTTPS_PORT}:443"
      - "[${EDGE_BIND_IP6}]:${EDGE_HTTPS_PORT}:443"
      - "127.0.0.1:${TRAEFIK_API_PORT}:8080"
      - "127.0.0.1:${INTERNALTEST_PORT}:8081"
    # The Docker socket is no longer mounted here (#244): Traefik reaches the
    # Docker API through the read-only docker-socket-proxy over TCP instead, so a
    # compromise of this internet-facing edge proxy can no longer drive the full
    # Docker Engine API (POST /containers/create with a host bind == host root).
    depends_on:
      - docker-socket-proxy
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # The host's router directory (per-tenant files, etc/edge/active.yml):
      # the ONLY mount of /etc/traefik/dynamic any container holds, and
      # read-only -- writers work on the host side (spec B "Edge" §2).
      # Long syntax so a missing host directory is a refusal at `up`, not an
      # empty directory Docker creates and Traefik watches forever.
      - type: bind
        source: ${GREMION_ROOT}/etc/edge
        target: /etc/traefik/dynamic
        read_only: true
        bind:
          create_host_path: false
      # ACME account and certificates live only here (TRD-042). The Cloudflare
      # Origin certificate mounts left with dynamic/tls.yml.
      - traefik-acme:/letsencrypt
      - traefik-logs:/logs
    networks:
      - gremion-net

  # ============================================================
  # docker-socket-proxy — read-only Docker API gateway (production only)
  # Holds /var/run/docker.sock so Traefik's docker provider can read container
  # labels WITHOUT the internet-facing edge proxy mounting the raw socket. Only
  # the GET endpoints the provider needs are allowed; all writes (POST) and
  # dangerous endpoints stay denied. Not published — internal gremion-net only.
  # Pinned by digest (supply-chain hardening, #252 / gremion#22): the digest
  # below is the multi-arch manifest-list index for the 0.1.1 tag, so `docker`
  # still selects the right platform at pull time while the ref stays immutable.
  # To re-pin after an intentional bump: docker buildx imagetools inspect
  # tecnativa/docker-socket-proxy:<tag> --format '{{.Manifest.Digest}}'.
  # ============================================================
  docker-socket-proxy:
    profiles: [production]
    image: tecnativa/docker-socket-proxy:0.1.1@sha256:6c22b9545adc95258af9deffdde6c0ce0a0a70716771e5a4e02d24d1b6e0dda1
    restart: unless-stopped
    healthcheck:
      # TASK-036 (TRD-178): /_ping is in the proxy's default-allowed set, measured
      # at the pinned digest (wget present, body "OK"). An OK proves HAProxy is
      # listening AND can still reach the Docker socket -- the failure Traefik's
      # docker provider actually sees.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # Read scopes Traefik's docker provider consults. POST defaults to 0 — the
      # load-bearing denial that blocks container create / exec / image run.
      CONTAINERS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      TASKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gremion-net

  # ============================================================
  # Vector — log pipeline with ipcrypt-nd IP pseudonymisation
  # Tails Traefik access logs, pseudonymises IPs, enforces retention.
  # ============================================================
  vector:
    build:
      context: docker/vector
      dockerfile: Dockerfile
    image: ghcr.io/hello-n00del/gremion-vector:latest
    restart: unless-stopped
    healthcheck:
      # TASK-036 (TRD-178): Vector's own loopback API (docker/vector/vector.toml
      # [api]), measured answering {"ok":true} in the built image. entrypoint.sh
      # supervises process-logs.sh and the logrotate loop and exits the
      # container via `wait -n` when either dies, so container liveness covers
      # those two and this probe covers Vector actually serving.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8686/health | grep -q '\"ok\":true'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      IPCRYPT_KEY_FILE: /run/secrets/ipcrypt_key
      IPCRYPT_KEY_EPOCH: "0"
      # LOG_RETENTION_SECONDS must be a plain integer (seconds).
      # Computed from LOG_ACCESS_RETENTION_DAYS (days × 86400).
      LOG_RETENTION_SECONDS: "${LOG_ACCESS_RETENTION_SECONDS:-1209600}"
      RAW_LOG_PATH: /logs/traefik/access.log
      PROCESSED_LOG_PATH: /logs/processed/security.log
    secrets:
      - ipcrypt_key
    volumes:
      # :rw (was :ro) so the logrotate loop in entrypoint.sh can copytruncate the
      # raw access.log in place (#242). Traefik writes it on its own RW mount in a
      # separate container; copytruncate avoids any cross-container signal. Vector
      # only TAILS this file (process-logs.sh) and never writes it, so RW here is
      # used solely by the rotation loop.
      - traefik-logs:/logs/traefik:rw
      - vector-processed-logs:/logs/processed
    networks:
      - gremion-net

# ============================================================
# Volumes
# ============================================================
volumes:
  pg-data:
    name: gremion_pg_data
  board-pg-data:
    name: gremion_module_board_pg_data
  calendar-pg-data:
    name: gremion_module_calendar_pg_data
  content-pg-data:
    name: gremion_module_content_pg_data
  finance-pg-data:
    name: gremion_module_finance_pg_data
  newsletter-pg-data:
    name: gremion_module_newsletter_pg_data
  vault-pg-data:
    name: gremion_module_vault_pg_data
  mailpit-data:
    name: gremion_mailpit_data
  gremion-config-data:
    name: gremion_config_data
  # Mounted at /data on gremion-ui. Holds the per-tenant config files
  # (/data/<slug>/config.json).
  newsletter-data:
    name: gremion_tenant_config_data
  traefik-logs:
    name: gremion_traefik_logs
  # Created by infra/host/bootstrap.sh (stage_networks) and never by compose,
  # so a `down -v` cannot take the ACME account with it. Stack-scoped name
  # (spec A §E): a hardcoded gremion_traefik_acme is forbidden.
  traefik-acme:
    name: ${STACK}_traefik_acme
    external: true
  vector-processed-logs:
    name: gremion_vector_processed_logs

# ============================================================
# Secrets
# ============================================================
secrets:
  ipcrypt_key:
    file: ./secrets/ipcrypt_key.txt

# ============================================================
# Networks
# ============================================================
networks:
  gremion-net:
    name: gremion_net
    driver: bridge
